<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'none'; connect-src 'none'; form-action 'none'; base-uri 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<title>Catálogo de Ferramentas</title>
<style>
  :root {
    --bg: #0f1115; --card: #171a21; --border: #262b36;
    --text: #e4e7ec; --muted: #9aa3b2; --accent: #4f9cf9; --mark: #f5c518;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 15px; line-height: 1.5;
  }
  header {
    position: sticky; top: 0; z-index: 1;
    background: var(--bg); border-bottom: 1px solid var(--border);
    padding: 16px;
  }
  .wrap { max-width: 960px; margin: 0 auto; }
  h1 { margin: 0 0 12px; font-size: 20px; font-weight: 600; }
  #busca {
    width: 100%; padding: 12px 14px; font-size: 16px;
    background: var(--card); color: var(--text);
    border: 1px solid var(--border); border-radius: 8px; outline: none;
  }
  #busca:focus { border-color: var(--accent); }
  #contador { margin-top: 8px; color: var(--muted); font-size: 13px; }
  main { padding: 16px; }
  .item {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 8px; padding: 14px 16px; margin-bottom: 12px;
  }
  .item h2 { margin: 0 0 4px; font-size: 16px; }
  .item a { color: var(--accent); word-break: break-all; font-size: 13px; text-decoration: none; }
  .item a:hover { text-decoration: underline; }
  .item p { margin: 8px 0 0; color: var(--muted); }
  mark { background: none; color: var(--mark); font-weight: 600; }
  .vazio { text-align: center; color: var(--muted); padding: 40px 0; }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <h1>Catálogo de Ferramentas</h1>
    <input id="busca" type="search" placeholder="Pesquisar por nome, descrição ou link..." autocomplete="off" spellcheck="false" autofocus>
    <div id="contador"></div>
  </div>
</header>
<main class="wrap" id="lista"></main>

<script id="dados" type="application/json">[{"n":"1.1.1.1 (Cloudflare WARP)","u":"https://one.one.one.one/","d":"O 1.1.1.1 é um resolvedor de DNS público e gratuito operado pela Cloudflare que prioriza a privacidade e a velocidade dos usuários na internet. Além da resolução de DNS padrão com suporte a protocolos criptografados como DNS-over-HTTPS (DoH) e DNS-over-TLS (DoT), a plataforma oferece o serviço WARP. O WARP funciona como um túnel de rede criptografado construído sobre o protocolo WireGuard, protegendo todo o tráfego de internet do dispositivo e encaminhando-o através da rede global da Cloudflare para mitigar o monitoramento local e ocultar o tráfego do provedor de internet."},{"n":"360Cities","u":"https://www.360cities.net/","d":"O 360Cities é uma das maiores plataformas colaborativas do mundo dedicadas à publicação, catalogação e visualização de fotografias panorâmicas em 360 graus, vídeos imersivos e imagens gigapixel em altíssima resolução. O serviço organiza o conteúdo visual em um mapa global interativo, permitindo navegar virtualmente por locais urbanos, rurais, marcos arquitetônicos e pontos remotos em diversas partes do planeta."},{"n":"4Devs","u":"https://www.4devs.com.br/","d":"O 4Devs é uma plataforma web que reúne um conjunto diversificado de geradores e validadores de dados estruturados focados no padrão brasileiro. A ferramenta permite criar e testar a consistência matemática de dados civis e cadastrais — tais como CPF, CNPJ, RG, CNH, nomes de pessoas completas, endereços fictícios e contas bancárias — operando de forma puramente algorítmica e sem a necessidade de consultas diretas a bancos de dados governamentais reais."},{"n":"5Sim","u":"https://5sim.net/","d":"O 5Sim é um serviço online de ativação de SMS que disponibiliza números de telefone virtuais temporários de diversos países e operadoras de telefonia ao redor do mundo. A plataforma permite contornar a necessidade de utilização de um chip SIM físico pessoal para realizar a validação e verificação de contas em plataformas de redes sociais, e-mails, aplicativos de mensageria corporativa e outros serviços web que exigem um número telefônico ativo no momento do cadastro ou login."},{"n":"AbuseIPDB","u":"https://www.abuseipdb.com/","d":"O AbuseIPDB é uma plataforma online e um banco de dados colaborativo focado na detecção, reporte e análise de endereços IP associados a atividades maliciosas e comportamentos abusivos na internet. A ferramenta reúne relatórios de segurança de uma comunidade global de administradores de sistemas, webmasters e softwares automatizados de defesa (como o Fail2Ban) para mapear ameaças virtuais, gerando um histórico de reputação e calculando uma pontuação de probabilidade de abuso para cada IP consultado."},{"n":"Ahmia","u":"https://ahmia.fi/","d":"O Ahmia é um motor de busca de código aberto projetado especificamente para indexar, catalogar e permitir a pesquisa de conteúdos dentro da rede de anonimato Tor (serviços ocultos com sufixo `.onion`). Diferente de outros indexadores da Dark Web, o Ahmia pode ser acessado diretamente da \"Clear Web\" (internet comum), servindo como uma ponte de busca que mapeia milhares de páginas ativas, fóruns clandestinos, repositórios de dados e portais de vazamento, ao mesmo tempo em que aplica políticas de filtragem estritas para remover conteúdos de abuso infantil e exploração humana de seus resultados."},{"n":"AI or Not","u":"https://www.aiornot.com/","d":"O AI or Not é uma plataforma voltada para a identificação e verificação de conteúdos gerados por algoritmos de Inteligência Artificial. A ferramenta analisa imagens, arquivos de áudio (incluindo clones de voz e faixas musicais), vídeos e blocos de texto para determinar se a autoria é humana ou sintética. Ela é capaz de identificar criações de geradores populares como Midjourney, Stable Diffusion, DALL-E 3, Flux, ChatGPT, Claude, Suno, Udio e Sora, mapeando anomalias estruturais, consistência de quadros e assinaturas térmicas de renderização de pixels."},{"n":"Aleph (OCCRP)","u":"https://aleph.occrp.org/","d":"O Aleph é uma plataforma de dados e repositório global mantido pelo Organized Crime and Corruption Reporting Project (OCCRP). A ferramenta centraliza, indexa e torna pesquisáveis centenas de milhões de registros públicos, vazamentos de dados (*leaks*), relatórios governamentais, processos judiciais, bancos de dados corporativos e cadastros de propriedade de terras de diversos países do mundo, facilitando o rastreamento de redes criminosas, fluxos de corrupção e ocultação de patrimônio."},{"n":"AlienVault OTX (Open Threat Exchange)","u":"https://otx.alienvault.com/","d":"O AlienVault Open Threat Exchange (OTX) é uma das maiores comunidades colaborativas de inteligência de ameaças (Threat Intelligence) do mundo. A plataforma permite que pesquisadores de segurança, analistas de SOC e investigadores de ameaças compartilhem e analisem em tempo real os chamados \"pulses\" (pulsos), que são coleções estruturadas de Indicadores de Comprometimento (IoCs) — tais como endereços IP maliciosos, domínios suspeitos, hashes de arquivos de malware, URIs e chaves de registro associadas a campanhas ativas de cibercrime e espionagem estatal."},{"n":"Amazon Rekognition","u":"https://aws.amazon.com/pt/rekognition/","d":"O Amazon Rekognition é um serviço de visão computacional baseado em nuvem que utiliza modelos de aprendizado profundo (deep learning) altamente escaláveis para analisar mídias visuais. A ferramenta automatiza a extração de informações de imagens e vídeos, sendo capaz de identificar objetos, pessoas, textos manuscritos e digitais (OCR), cenas, atividades, além de realizar detecção de conteúdo inadequado e análise/comparação facial de alta precisão."},{"n":"AmIReal","u":"https://seintpl.github.io/AmIReal/","d":"O AmIReal é uma aplicação interativa baseada em web que serve como um guia metodológico passo a passo para auxiliar analistas a determinarem a autenticidade de um perfil digital. A ferramenta foca na identificação de contas falsas (*sock puppets*) e rostos gerados artificialmente por algoritmos de Inteligência Artificial (como redes GAN)."},{"n":"AmIUnique","u":"https://amiunique.org/fingerprint","d":"O AmIUnique é uma plataforma online voltada para a análise técnica detalhada da pegada digital de um navegador (*browser fingerprinting*). A ferramenta mapeia e analisa dezenas de identificadores transmitidos pelo sistema (como cabeçalhos HTTP, fontes do sistema, plugins, dados de Canvas, WebGL, fuso horário e configurações de hardware) para calcular o nível de exclusividade daquele perfil na internet."},{"n":"ANA (Agência Nacional de Águas e Saneamento Básico)","u":"https://www.gov.br/ana/pt-br","d":"O portal da Agência Nacional de Águas e Saneamento Básico (ANA) é a plataforma oficial do órgão regulador responsável pela gestão dos recursos hídricos e pela regulação do saneamento básico no Brasil. Por meio de seus subsistemas de informação, notadamente o Sistema Nacional de Informações sobre Recursos Hídricos (SNIRH) e a Plataforma Águas Brasil, a agência centraliza dados cadastrais de outorgas (autorizações de captação e uso de água), cadastros de usuários de recursos hídricos, monitoramento telemétrico e o Sistema Nacional de Informações sobre Segurança de Barragens (SNISB)."},{"n":"Android Studio","u":"https://developer.android.com/studio","d":"O Android Studio é o Ambiente de Desenvolvimento Integrado (IDE) oficial para a plataforma Android. Para fins de investigação e segurança, a ferramenta destaca-se por incluir o gerenciador de emuladores (Android Virtual Device - AVD) e um conjunto avançado de utilitários de depuração, análise de pacotes de aplicativos (APKs) e inspeção de código."},{"n":"ANY.RUN","u":"https://app.any.run","d":"O ANY.RUN é uma plataforma de sandbox interativa baseada na nuvem projetada para a execução, monitoramento e análise em tempo real de arquivos e URLs suspeitas. A ferramenta permite que o analista interaja diretamente com o sistema operacional virtualizado (como se estivesse em sua própria máquina) enquanto acompanha de forma dinâmica o comportamento do ecossistema: processos gerados, modificações em arquivos de sistema, chaves de registro e conexões de rede."},{"n":"Archive.today (archive.ph)","u":"https://archive.ph/","d":"O Archive.today (acessível via domínios como archive.ph, archive.is, archive.today) é uma plataforma online de arquivamento e preservação digital de páginas da World Wide Web. O serviço cria capturas sob demanda (*snapshots*) de URLs submetidas por usuários, gerando duas réplicas distintas do conteúdo: uma versão em texto estruturado e uma cópia visual estática de alta fidelidade baseada em imagem/rasterização, desprovida de scripts executáveis e elementos dinâmicos maliciosos."},{"n":"Arrows.app","u":"https://arrows.app/","d":"O Arrows.app é uma ferramenta baseada em web voltada para o desenho e a modelagem ágil de grafos de propriedades. Desenvolvido primariamente para apoiar o design de estruturas de bancos de dados orientados a grafos (como o Neo4j), o aplicativo permite criar nós, estabelecer relacionamentos direcionados (arestas) e customizar propriedades detalhadas (como pares de chave-valor) para cada elemento em uma interface puramente visual e interativa."},{"n":"Artbreeder","u":"https://www.artbreeder.com/","d":"O Artbreeder é uma plataforma online que utiliza modelos avançados de inteligência artificial (como Redes Adversárias Generativas - GANs e modelos de difusão) para criar e modificar imagens de forma altamente customizável. A ferramenta permite \"cruzar\" diferentes imagens e manipular \"genes\" visuais através de seletores (sliders), possibilitando alterações precisas em características faciais, expressões, idade, etnia e iluminação."},{"n":"ascii2d","u":"https://ascii2d.net/","d":"O ascii2d é um motor de busca reversa de imagens japonês projetado especificamente para rastrear e identificar ilustrações, arte digital, mangás e mídias visuais compartilhadas em plataformas e comunidades asiáticas (como Pixiv, X/Twitter e Nijie). O sistema oferece dois modos principais de correspondência: busca por detalhes/formas (*Feature Search*) e busca por paleta/distribuição de cores (*Color Search*)."},{"n":"Audacity","u":"https://www.audacityteam.org/","d":"O Audacity é um editor e gravador de áudio digital multi-faixa de código aberto e multiplataforma. A ferramenta permite realizar capturas de áudio ao vivo, manipular arquivos em diversos formatos estruturados (como WAV, MP3, FLAC, OGG) e aplicar filtros de engenharia de som para tratamento de sinais, remoção de ruídos e análise profunda de frequências sonoras."},{"n":"Avast Secure Browser","u":"https://www.avast.com/pt-br/secure-browser","d":"Navegador baseado em Chromium focado em segurança e privacidade. Inclui recursos nativos para bloquear rastreadores, forçar HTTPS e mascarar a impressão digital do navegador (*anti-fingerprinting*)."},{"n":"Aviation Safety Network (ASN)","u":"https://asn.flightsafety.org/","d":"O Aviation Safety Network (ASN) é um serviço especializado da Flight Safety Foundation que disponibiliza uma base de dados detalhada sobre acidentes, incidentes e falhas de segurança envolvendo aeronaves comerciais, jatos executivos e voos militares globalmente. A plataforma cataloga registros estruturados que incluem prefixos de matrícula (*tail numbers*), número de série de fabricação (MSN), histórico de operadores, cronologia de eventos e transcrições de relatórios de órgãos de aviação."},{"n":"Awesome OSINT","u":"https://github.com/jivoi/awesome-osint","d":"O Awesome OSINT é uma lista colaborativa com curadoria especializada hospedada no GitHub, reunindo uma vasta coleção de ferramentas, sites, frameworks e recursos técnicos voltados para a Inteligência de Fontes Abertas (OSINT). O repositório é estruturado por categorias operacionais bem definidas, servindo como um índice global para triagem e seleção de softwares de coleta, verificação e análise de dados públicos."},{"n":"AxCrypt","u":"https://axcrypt.net","d":"O AxCrypt é um software de criptografia de arquivos focado em garantir a confidencialidade de dados armazenados localmente ou compartilhados via serviços de nuvem. Utilizando algoritmos de criptografia simétrica (como AES-128 e AES-256), a ferramenta permite proteger arquivos individuais ou diretórios por meio de senhas fortes, além de oferecer suporte a funções de compartilhamento seguro baseado em chaves públicas."},{"n":"Axur Watchdog","u":"https://watchdog.axur.io","d":"O Axur Watchdog (Domain Watchdog, beta) é um buscador gratuito da Axur que lista domínios registrados contendo uma palavra-chave ou variações dela (typosquatting e homoglifos). Para cada domínio mostra data de criação, IP, registros NS/MX e portas abertas, permitindo identificar rapidamente sites de phishing ou de fraude que imitam uma marca."},{"n":"Baidu","u":"https://www.baidu.com/","d":"O Baidu é o principal mecanismo de busca e portal de serviços web da China, funcionando como o maior indexador de páginas e documentos digitais em língua chinesa no mundo. A ferramenta rastreia, cataloga e classifica conteúdos distribuídos na internet global com forte ênfase na web chinesa e no espaço regional da Ásia-Pacífico, disponibilizando módulos de pesquisa textual, busca por imagens, notícias, mapas e repositórios enciclopédicos (Baidu Baike)."},{"n":"Betaface (Old Demo)","u":"https://betaface.com/demo_old.html","d":"O Betaface é uma plataforma avançada de visão computacional especializada em detecção e reconhecimento facial automatizado. A sua interface de demonstração clássica permite o upload de arquivos de imagem para realizar a extração detalhada de pontos biométricos (geometria facial), classificação de atributos físicos (como estimativa de idade, gênero, cor de cabelo, presença de barba ou óculos) e a verificação de similaridade contra bancos de dados de figuras públicas."},{"n":"Biblioteca de Anúncios do Facebook (Meta Ad Library)","u":"https://www.facebook.com/ads/library/","d":"A Biblioteca de Anúncios do Facebook é uma plataforma pública e oficial criada pela Meta para fornecer transparência sobre as campanhas publicitárias veiculadas no Facebook, Instagram, Messenger e Audience Network. O repositório armazena e permite a busca de todas as peças publicitárias ativas na plataforma, além de manter um arquivo histórico de até sete anos para anúncios relacionados a temas sociais, eleições ou política, detalhando gastos estimados, alcance e dados demográficos do público atingido."},{"n":"Bing","u":"https://www.bing.com/","d":"O Bing é um motor de busca global desenvolvido e mantido pela Microsoft. A plataforma atua como um indexador massivo da internet superficial (Surface Web), mapeando, catalogando e classificando continuamente bilhões de páginas web, imagens, vídeos, produtos e notícias em escala global, integrando também capacidades de busca semântica."},{"n":"BitLocker Drive Encryption","u":"https://learn.microsoft.com/pt-br/windows/security/operating-system-security/data-protection/bitlocker/","d":"O BitLocker é um recurso nativo de segurança de dados integrado às versões Pro, Enterprise e Education do sistema operacional Microsoft Windows. Ele fornece criptografia de disco completo (Full Disk Encryption - FDE), protegendo o volume do sistema operacional, volumes de dados fixos e unidades de dados removíveis (BitLocker To Go) contra o acesso não autorizado a dados em dispositivos perdidos, roubados ou indevidamente descartados."},{"n":"Bitmask","u":"https://bitmask.net/","d":"O Bitmask é um aplicativo cliente de código aberto projetado para fornecer comunicações seguras e criptografadas de forma simplificada. Ele gerencia de maneira automatizada configurações complexas de rede para se conectar a provedores de serviços que utilizam a arquitetura LEAP (como Riseup e Calyx), entregando tunelamento de tráfego via VPN (Virtual Private Network) com forte foco em privacidade, além de suporte para criptografia de e-mails de ponta a ponta."},{"n":"Bitwarden","u":"https://bitwarden.com/","d":"O Bitwarden é um sistema de gerenciamento de credenciais e cofre de dados de código aberto baseado em nuvem. Ele permite o armazenamento, geração e preenchimento automatizado de senhas, notas estruturadas, chaves de autenticação e dados de identidade sob uma arquitetura de criptografia de ponta a ponta (zero-knowledge)."},{"n":"Blockchain.com Explorer","u":"https://www.blockchain.com/explorer","d":"O Blockchain.com Explorer é uma plataforma online que funciona como um motor de busca e livro-razão público para registros de redes blockchain, oferecendo suporte a criptoativos como Bitcoin (BTC), Ethereum (ETH) e Bitcoin Cash (BCH). A ferramenta permite inspecionar em tempo real o conteúdo de blocos minerados, o histórico completo de transações, os saldos de endereços públicos, taxas de mineração e a execução de contratos inteligentes."},{"n":"BlockSherlock","u":"https://www.blocksherlock.com/","d":"O BlockSherlock é uma plataforma nacional desenvolvida por especialistas da segurança pública e da persecução penal voltada para apoiar investigações de crimes de qualquer natureza que envolvam ativos virtuais. O portal funciona como um diretório especializado e hub de conhecimento, catalogando dezenas de exploradores de blockchain (*blockchain explorers*), listando as características e heurísticas de cada um, e fornecendo uma seção exclusiva de ferramentas úteis de inteligência para a busca de dados em fontes abertas."},{"n":"BlueStacks","u":"https://www.bluestacks.com/","d":"O BlueStacks é um software de emulação de Android projetado para ser executado em sistemas operacionais de desktop. A ferramenta cria um ambiente virtualizado que simula a arquitetura de um dispositivo móvel (smartphone ou tablet), permitindo o download, a instalação e a execução de qualquer aplicativo disponível para o ecossistema Android diretamente no computador."},{"n":"BoredHumans","u":"https://boredhumans.com/","d":"O BoredHumans é um portal web que agrupa um ecossistema com mais de 100 ferramentas gratuitas fundamentadas em modelos de inteligência artificial e aprendizado de máquina. A plataforma engloba utilitários que utilizam redes neurais generativas para a criação de imagens e rostos realistas, simuladores de conversação com personas artificiais, algoritmos para redação automatizada e ferramentas voltadas à reestruturação, resumo e tratamento de dados textuais."},{"n":"Brasil.io","u":"https://brasil.io/","d":"O Brasil.io é uma plataforma colaborativa que atua na libertação e estruturação de dados públicos brasileiros. O projeto captura dados originalmente disponibilizados por órgãos governamentais em formatos complexos, fechados ou de difícil manipulação (como PDFs restritivos ou planilhas massivas desorganizadas) e os converte em bancos de dados limpos, padronizados e acessíveis via interface web e API. Seu catálogo inclui o cadastro completo de CNPJs da Receita Federal, históricos de candidaturas e declarações de bens do TSE, salários do judiciário e dados epidemiológicos."},{"n":"Brave Browser","u":"https://brave.com/pt-br/","d":"Navegador de código aberto baseado em Chromium que bloqueia automaticamente anúncios e rastreadores. Possui integração nativa com a rede **Tor** e o protocolo **IPFS**, além de um motor de busca próprio focado em privacidade."},{"n":"BreachBase","u":"https://breachbase.com/","d":"O BreachBase é um serviço online voltado para a consulta e agregação de dados expostos em incidentes de segurança cibernética e megavazamentos (*data breaches*). A plataforma indexa bilhões de registros públicos e semi-públicos contendo e-mails, *usernames*, senhas em texto claro ou *hashes*, endereços IP e identificadores digitais obtidos a partir de compilações de violações de dados, fóruns e repositórios clandestinos."},{"n":"BrowserLeaks","u":"https://browserleaks.com/","d":"O BrowserLeaks é uma suíte de ferramentas web focada na auditoria de segurança, privacidade e anonimato de navegadores de internet. A plataforma realiza testes dinâmicos e profundos para identificar quais dados e metadados técnicos o dispositivo de um usuário expõe ao visitar uma página web, revelando potenciais vulnerabilidades como vazamentos de IP real via WebRTC, servidores de DNS configurados, assinaturas TLS (JA3/JA4), geolocalização da API do navegador, e técnicas complexas de rastreamento como Canvas, WebGL e Font Fingerprinting."},{"n":"Browsertrix Crawler","u":"https://crawler.docs.browsertrix.com/","d":"O Browsertrix Crawler é um rastreador web (*web crawler*) de alta fidelidade desenvolvido pelo projeto Webrecorder. Projetado para superar as limitações de rastreadores tradicionais frente à web moderna, ele utiliza navegadores reais controlados via automação (Chromium) para renderizar JavaScript complexo, carregar conteúdos dinâmicos (*Single Page Applications*), reproduzir mídias e rolar páginas automaticamente. A ferramenta empacota todo o tráfego HTTP, mídias e metadados coletados diretamente nos formatos padronizados de preservação digital WACZ e WARC."},{"n":"BuiltWith","u":"https://builtwith.com","d":"O BuiltWith é uma ferramenta de perfilamento de sites (website profiler) e inteligência de mercado que realiza varreduras contínuas na internet para indexar as tecnologias adotadas por milhões de páginas web. A plataforma armazena e organiza dados estruturados sobre sistemas de gerenciamento de conteúdo (CMS), servidores, provedores de hospedagem, CDN, certificados SSL/TLS, além de scripts analíticos e pixels de rastreamento publicitário."},{"n":"Busca Médicos - CFM","u":"https://portal.cfm.org.br/busca-medicos/","d":"O portal Busca Médicos é a plataforma oficial e centralizada mantida pelo Conselho Federal de Medicina (CFM) para a verificação pública da situação cadastral de profissionais de medicina em todo o território brasileiro. A ferramenta permite a realização de consultas estruturadas por nome, número de inscrição no Conselho Regional de Medicina (CRM), estado (UF), tipo de inscrição, situação do registro (como ativo, inativo, cancelado ou cassado) e especialidades ou áreas de atuação devidamente registradas (RQE - Registro de Qualificação de Especialidade)."},{"n":"Busca Placas","u":"https://buscaplacas.com.br/","d":"O Busca Placas é uma ferramenta baseada na web estruturada para a identificação e decodificação de dados automotores no Brasil. A plataforma permite que usuários insiram a placa de um veículo (no padrão antigo ou no formato Mercosul) para obter de forma automatizada informações consolidadas sobre o ativo, como marca, modelo, ano de fabricação, ano do modelo, cor, além da cidade e estado de emplacamento."},{"n":"Busca Textual CNPq (Plataforma Lattes)","u":"https://buscatextual.cnpq.br/buscatextual/busca.do?metodo=apresentar","d":"A Busca Textual do CNPq é a interface pública de consulta da Plataforma Lattes, o ecossistema oficial do Ministério da Ciência, Tecnologia e Inovação (MCTI) que centraliza os currículos de pesquisadores, estudantes, docentes e profissionais técnicos atuantes no Brasil. A base de dados agrega registros históricos detalhados sobre a trajetória acadêmica e profissional dos indivíduos cadastrados."},{"n":"Cadastro da Nota Fiscal Paulista (Consulta/Solicitação CPF)","u":"https://www.nfp.fazenda.sp.gov.br/cadastroCAT/SolicitacaoCadastroCPF.aspx","d":"A URL apontada corresponde à página oficial de solicitação de cadastro para pessoas físicas no sistema da Nota Fiscal Paulista, mantido pela Secretaria da Fazenda e Planejamento do Estado de São Paulo (SEFAZ-SP). O formulário realiza uma consulta síncrona automatizada com as bases integradas da Receita Federal do Brasil para checar se o CPF inserido é válido, se a data de nascimento informada coincide com o registro civil e qual a situação cadastral do documento."},{"n":"Cadastro Nacional de Condenações Cíveis por Ato de Improbidade Administrativa e Inelegibilidade (CNCIAI) - CNJ","u":"https://www.cnj.jus.br/improbidade_adm/consultar_requerido.php","d":"O Cadastro Nacional de Condenações Cíveis por Ato de Improbidade Administrativa e Inelegibilidade (CNCIAI), mantido pelo Conselho Nacional de Justiça (CNJ), é o sistema oficial que centraliza e unifica os dados de processos judiciais de todo o país relativos a condenações por improbidade e restrições de direitos políticos. A plataforma permite pesquisar se cidadãos ou empresas foram penalizados com a suspensão de direitos políticos, perda de cargo público, indisponibilidade de bens, inelegibilidade eleitoral ou proibição de contratar com o Poder Público."},{"n":"Cadastro Nacional dos Advogados (CNA) - OAB","u":"https://cna.oab.org.br/","d":"O Cadastro Nacional dos Advogados (CNA) é a plataforma oficial centralizada mantida pelo Conselho Federal da Ordem dos Advogados do Brasil (OAB). O sistema unifica os dados de todas as seccionais estaduais do país, permitindo a pesquisa em tempo real de profissionais do direito. As consultas podem ser parametrizadas por nome completo, número da inscrição, seccional (estado) e tipo de inscrição (advogado, estagiário ou consultor em direito estrangeiro), retornando a situação do registro (regular, suspenso, cancelado, licenciado ou excluído), a foto cadastrada (quando disponível) e a subseção de atuação."},{"n":"CadastroPré","u":"https://cadastropre.com.br/","d":"O CadastroPré é uma plataforma unificada criada pelas principais prestadoras de telecomunicação do Brasil (Algar, Claro, Sercomtel, TIM e Vivo) sob a coordenação da Conexis Brasil Digital e em estrita conformidade com as diretrizes regulatórias da ANATEL (Agência Nacional de Telecomunicações). O portal centraliza as consultas cadastrais permitindo verificar, por meio da inserção de um número de CPF, se existem linhas de telefonia móvel na modalidade pré-paga ativas vinculadas àquele documento em cada operadora."},{"n":"Caipora Pro","u":"https://caipora.pro/","d":"O Caipora Pro é uma plataforma web que atua como um repositório centralizado e curadoria estruturada de recursos, ferramentas e fontes abertas voltadas para Inteligência de Fontes Abertas (OSINT) e investigação digital. Organizado em dezenas de categorias temáticas — incluindo buscadores, análise de metadados, pessoas, empresas, consultas processuais, cartórios, portais da transparência, GEOINT, redes sociais e vazamentos —, o projeto foca especialmente no ecossistema e nas particularidades das bases de dados e registros públicos do Brasil."},{"n":"Canal de Verificação de Canais Oficiais - Porto Seguro","u":"https://www.portoseguro.com.br/pdc/recuperacao/canais","d":"A página de validação de canais da Porto Seguro é uma ferramenta institucional pública desenvolvida para permitir que clientes e investigadores verifiquem se um determinado número de telefone, link, e-mail ou domínio que se apresenta em nome da empresa é de fato um canal de atendimento oficial e autorizado ou se trata de uma tentativa de fraude (phishing, spoofing ou engenharia social)."},{"n":"Canarytokens","u":"https://canarytokens.org/","d":"O Canarytokens é uma plataforma online voltada para a criação simplificada de \"tokens de canário\", que atuam como armadilhas digitais (*tripwires* ou *honeypots*). A ferramenta permite gerar diversos tipos de identificadores camuflados — como links exclusivos, documentos do Word ou PDF, imagens, registros de DNS e chaves de API fictícias. Quando um terceiro ou invasor interage com esse arquivo ou link, o sistema dispara imediatamente um alerta por e-mail ou webhook contendo detalhes técnicos de quem o acessou."},{"n":"Carfacts","u":"https://carfacts.com.br/","d":"O Carfacts é uma plataforma web voltada para a centralização, consulta e emissão de históricos veiculares no território brasileiro. A ferramenta realiza buscas integradas em múltiplos bancos de dados e órgãos reguladores para fornecer relatórios detalhados contendo dados de fabricação, numeração de chassi/motor, histórico de quilometragem, restrições financeiras ou administrativas ativas (DETRAN), passagem por leilões, indícios de sinistro, multas e débitos pendentes."},{"n":"Carpivara","u":"https://consultasdeveiculos.com/","d":"O Carpivara é uma plataforma online voltada para a consulta e consolidação do histórico de veículos no território brasileiro. O sistema centraliza dados sobre a procedência de automóveis, permitindo verificar a existência de multas, autuações, gravames, restrições judiciais ou administrativas, além de informações sobre leilões e sinistros a partir de identificadores básicos como a placa ou o chassi do veículo."},{"n":"Carrot2","u":"https://search.carrot2.org/#/search/web","d":"O Carrot2 é um mecanismo de busca e framework de clustering de código aberto voltado para a organização dinâmica de informações da web. Em vez de entregar os resultados exclusivamente em uma lista linear convencional, a ferramenta processa os snippets e resumos de buscas na rede e os organiza automaticamente em tópicos temáticos (clusters). A plataforma disponibiliza interfaces gráficas com visualizações interativas em formato de mapas em árvore (*treemap*) e círculos concêntricos (*pie-chart / foamtree*)."},{"n":"CCFácil","u":"https://ccfacil.com.br/default.aspx","d":"O CCFácil é uma plataforma online que opera como distribuidora autorizada de bureaus de crédito (como a Serasa Experian), centralizando serviços de consultas cadastrais, análise patrimonial e de risco no território brasileiro. O sistema permite a emissão de relatórios consolidados sobre CPFs e CNPJs, fornecendo dados sobre protestos, registros de inadimplência, dívidas vencidas, pontuação de score, ações judiciais em andamento, além de históricos de localização e composição de sociedades empresariais."},{"n":"CCleaner","u":"https://www.ccleaner.com/","d":"O CCleaner é um utilitário de otimização e privacidade projetado para sistemas operacionais desktop. A ferramenta realiza a varredura e a eliminação sistemática de arquivos temporários, logs de aplicativos, caches de navegadores, históricos de navegação, cookies e entradas inválidas ou obsoletas no Registro do Windows. Seu objetivo principal é liberar espaço em disco e mitigar a retenção de dados persistentes no sistema local."},{"n":"CENSEC (Central Notarial de Serviços Eletrônicos Compartilhados)","u":"https://www.censec.org.br/","d":"A CENSEC é uma plataforma operacional gerida pelo Colégio Notarial do Brasil (CNB-CF) sob regulamentação do Conselho Nacional de Justiça (CNJ). O sistema centraliza e indexa os dados de atos notariais lavrados em todos os cartórios de notas do território nacional, englobando o Registro Central de Testamentos (RCTO), a Central de Escrituras e Procurações (CESDI) e a Central de Escrituras Públicas de Separações, Divórcios e Inventários (CEP)."},{"n":"Censys Search","u":"https://platform.censys.io/search","d":"O Censys Search é um motor de busca especializado na indexação de dispositivos conectados à internet e na análise da superfície de ataque global. A plataforma realiza varreduras contínuas no espaço de endereçamento IPv4 e IPv6, coletando dados estruturados sobre portas abertas, serviços ativos, banners de software, configurações de rede e registros detalhados de certificados criptográficos SSL/TLS por meio de logs de Transparência de Certificados (CT Logs)."},{"n":"Central de Certidões Nada Consta (CNC) - TJDFT","u":"https://cnc.tjdft.jus.br/solicitacao-externa","d":"A Central de Certidões Nada Consta (CNC) do Tribunal de Justiça do Distrito Federal e dos Territórios (TJDFT) é a plataforma oficial destinada à solicitação e emissão de certidões de distribuição judicial. O sistema permite a qualquer cidadão requerer certidões cíveis, criminais, de falência, concordata e recuperação judicial, além de execuções fiscais, consolidadas sob a jurisdição do Distrito Federal."},{"n":"Central Nacional de Serviços Compartilhados dos Protestos (Pesquisa Protesto)","u":"https://www.pesquisaprotesto.com.br/","d":"A Pesquisa Protesto é o portal oficial da Central Nacional de Serviços Compartilhados dos Protestos (CENPROT), que permite a consulta gratuita e unificada sobre a existência de protestos em cartórios de todo o território nacional. A busca é efetuada a partir da inserção de um número de CPF (pessoa física) ou de CNPJ (pessoa jurídica), retornando informações sobre a regularidade financeira e inadimplência do alvo pesquisado."},{"n":"Certidão de Débitos Trabalhistas (TST - CNDT)","u":"https://cndt-certidao.tst.jus.br/","d":"O portal de Certidão de Débitos Trabalhistas do Tribunal Superior do Trabalho (TST) é o sistema oficial centralizado para a emissão e validação da Certidão Negativa de Débitos Trabalhistas (CNDT). A plataforma realiza uma varredura em tempo real no Banco Nacional de Devedores Trabalhistas (BNDT) para identificar se uma pessoa física ou jurídica possui obrigações processuais inadimplidas, decorrentes de sentenças condenatórias transitadas em julgado, acordos judiciais descumpridos ou execuções de acordos firmados perante o Ministério Público do Trabalho."},{"n":"Certidão de Feitos Trabalhistas (TRT-3)","u":"https://certidao.trt3.jus.br/certidao/feitosTrabalhistas/aba1.emissao.htm","d":"O portal de Certidão de Feitos Trabalhistas do Tribunal Regional do Trabalho da 3ª Região (TRT-3) é o canal oficializado para a emissão de certidões eletrônicas que atestam a existência ou inexistência de processos e reclamações trabalhistas em nome de pessoas físicas ou jurídicas. A consulta varre os sistemas processuais da Justiça do Trabalho no âmbito do estado de Minas Gerais, cobrindo ações em andamento nas Varas do Trabalho e no Tribunal."},{"n":"Certidão de Filiação Partidária - TSE (Filia Consulta)","u":"https://filia-consulta.tse.jus.br/#/principal/certidao-gerar","d":"O sistema Filia Consulta é uma plataforma oficial mantida pelo Tribunal Superior Eleitoral (TSE) da Justiça Eleitoral brasileira. O portal permite a qualquer cidadão consultar, gerar e validar a Certidão de Filiação Partidária, um documento oficial que atesta o histórico ou a ausência de vínculo formal de um indivíduo com agremiações políticas registradas no país."},{"n":"Certidão de Quitação Eleitoral (TSE)","u":"https://www.tse.jus.br/servicos-eleitorais/autoatendimento-eleitoral#/certidoes-eleitor/certidao-quitacao-eleitoral","d":"O portal de Certidão de Quitação Eleitoral do Tribunal Superior Eleitoral (TSE) é um serviço público unificado que permite a emissão e validação de documentos que atestam a regularidade do cidadão perante a Justiça Eleitoral brasileira. O sistema realiza uma varredura em tempo real nas bases de dados consolidadas para verificar se o indivíduo está em pleno gozo dos seus direitos políticos, se votou ou justificou a ausência nos pleitos passados, se atendeu a convocações para o serviço de mesário e se possui multas eleitorais ativas pendentes."},{"n":"ChatGPT (OpenAI)","u":"https://chatgpt.com/","d":"O ChatGPT é um assistente conversacional baseado em modelos de linguagem de larga escala (LLM) desenvolvido pela OpenAI. A plataforma processa, gera e analisa grandes volumes de texto estruturado e não estruturado, permitindo a execução de tarefas complexas que envolvem tradução, programação, reconfiguração de formatos de dados e interpretação contextual de informações textuais fornecidas pelo usuário."},{"n":"Chatmind","u":"https://mapify.so/pt","d":"O Chatmind é uma plataforma online baseada em inteligência artificial projetada para a criação e estruturação automatizada de mapas mentais, diagramas conceituais e fluxogramas a partir de comandos textuais ou documentos fornecidos pelo usuário. O sistema utiliza processamento de linguagem natural (PLN) para interpretar textos desorganizados ou instruções diretas, convertendo-os em estruturas visuais hierárquicas e ramificadas."},{"n":"CheckLeaked WhatsApp","u":"https://whatsapp.checkleaked.cc/pt","d":"O CheckLeaked WhatsApp é uma plataforma web especializada na consulta e validação de números de telefone com foco no ecossistema do aplicativo de mensageria WhatsApp. A ferramenta analisa o identificador numérico fornecido para determinar o status da conta, verificar se há registros associados e detectar potenciais exposições ou vinculações a vazamentos públicos."},{"n":"Cobertura Celular","u":"http://www.coberturacelular.com.br/","d":"O Cobertura Celular é uma plataforma web voltada ao mapeamento e localização de infraestruturas de telecomunicações no território brasileiro. Desenvolvido com base em dados técnicos e regulatórios públicos da Agência Nacional de Telecomunicações (Anatel), o portal permite consultar a localização exata de Estações Rádio Base (ERBs/torres celulares), identificar a proximidade de antenas por operadora (Claro, TIM, Vivo, entre outras) e verificar a disponibilidade das tecnologias suportadas (2G, 3G, 4G e 5G) a partir de endereços, bairros ou coordenadas geográficas."},{"n":"Comment Picker - Find Instagram Username by User ID","u":"https://commentpicker.com/instagram-username.php","d":"O utilitário \"Find Instagram Username\" do Comment Picker é uma ferramenta online desenvolvida para resolver identificadores numéricos exclusivos do Instagram (User ID / UID) em seus respectivos nomes de usuário (@username). O serviço realiza consultas diretas às APIs públicas e pontos de extremidade da plataforma para retornar o *handle* atual associado a uma conta, permitindo contornar alterações frequentes de nome feitas por usuários."},{"n":"Comodo Dragon / IceDragon","u":"https://www.comodo.com/home/browsers-toolbars/browser.php","d":"Navegador focado em segurança extrema, disponível em versões baseadas em Chromium (Dragon) ou Firefox (IceDragon). Ele utiliza os servidores de DNS da Comodo para filtrar sites maliciosos e possui um inspetor de certificados SSL muito rigoroso."},{"n":"Concessões Ferroviárias - ANTT","u":"https://www.gov.br/antt/pt-br/assuntos/ferrovias/concessoes-ferroviarias","d":"O portal de Concessões Ferroviárias da ANTT (Agência Nacional de Transportes Terrestres) é o espaço oficial que reúne dados e documentos sobre a malha ferroviária federal outorgada à iniciativa privada. A página centraliza informações sobre os contratos de concessão vigentes, termos aditivos, prorrogações contratuais, investimentos previstos e a delimitação geográfica das malhas sob controle empresarial."},{"n":"Conjunto de Dados Abertos (TCE-SP)","u":"https://transparencia.tce.sp.gov.br/conjunto-de-dados","d":"A página de \"Conjunto de Dados\" é o repositório centralizado de dados abertos do Tribunal de Contas do Estado de São Paulo (TCE-SP). Este canal disponibiliza para download integral arquivos estruturados (em formatos como CSV e XML) contendo históricos completos de despesas, receitas, licitações, contratos, aditivos, repasses ao terceiro setor e o quadro de pessoal dos órgãos e municípios sob a jurisdição fiscalizatória do tribunal."},{"n":"Consulta ao Registro Aeronáutico Brasileiro (RAB) - ANAC","u":"https://aeronaves.anac.gov.br/aeronaves/cons_rab.asp","d":"O sistema de consulta ao Registro Aeronáutico Brasileiro (RAB), mantido pela Agência Nacional de Aviação Civil (ANAC), é uma plataforma pública oficial que centraliza os dados cadastrais, técnicos e jurídicos de todas as aeronaves civis registradas no território nacional. O portal disponibiliza informações que abrangem desde as marcas de matrícula (prefixo), fabricante, modelo, ano de fabricação e número de série, até a situação de aeronavegabilidade e o histórico de gravames associados ao ativo."},{"n":"Consulta de CCMEI - Receita Federal","u":"https://mei.receita.economia.gov.br/certificado/consulta","d":"O sistema de Emissão de Certificado do MEI (CCMEI) é uma plataforma oficial do governo federal brasileiro, gerida pela Secretaria da Receita Federal. O portal permite a consulta, geração e validação do documento que comprova a existência jurídica do Microempreendedor Individual, consolidando em um único relatório dados do negócio e do seu titular único."},{"n":"Consulta de CNPJ - Secretaria da Receita Federal do Brasil","u":"https://solucoes.receita.fazenda.gov.br/Servicos/cnpjreva/Cnpjreva_Solicitacao.asp","d":"O serviço de Emissão de Comprovante de Inscrição e de Situação Cadastral é a plataforma pública e oficial mantida pela Secretaria da Receita Federal do Brasil (RFB) para a verificação de dados de pessoas jurídicas. O sistema centraliza e disponibiliza em tempo real as informações cadastrais de qualquer entidade registrada sob o Cadastro Nacional da Pessoa Jurídica (CNPJ), incluindo matrizes, filiais, órgãos públicos e entidades filantrópicas."},{"n":"Consulta de CPF - Secretaria da Receita Federal do Brasil","u":"https://servicos.receita.fazenda.gov.br/servicos/cpf/consultasituacao/consultapublica.asp","d":"O serviço de Consulta Pública de Situação Cadastral no CPF é a plataforma oficial gerida pela Secretaria da Receita Federal do Brasil (RFB). O sistema permite a emissão do comprovante que atesta a situação de inscrição de uma pessoa física no Cadastro de Pessoas Físicas (CPF), refletindo em tempo real os assentamentos administrativos do órgão federal."},{"n":"Consulta de Inscritos - CFO (Conselho Federal de Odontologia)","u":"https://busca-profissionais.cfo.org.br/","d":"O sistema de Consulta de Inscritos é a plataforma oficial unificada do Conselho Federal de Odontologia (CFO). O portal permite a pesquisa de profissionais (cirurgiões-dentistas, técnicos e auxiliares) e de pessoas jurídicas (clínicas e consultórios registrados) em situação ativa ou inativa perante os Conselhos Regionais de Odontologia (CRO) de todos os estados do território nacional."},{"n":"Consulta de Médicos (RMS) - Programa Mais Médicos","u":"https://maismedicos.saude.gov.br/new/web/app.php/maismedicos/rms","d":"O sistema de busca de Registro do Ministério da Saúde (RMS) é uma aplicação web integrada ao SGP (Sistema de Gestão de Programas) do Programa Mais Médicos para o Brasil. A plataforma destina-se a fornecer de maneira pública e unificada o status de regularidade e a habilitação legal de profissionais (notadamente médicos intercambistas, brasileiros formados no exterior ou estrangeiros) autorizados a exercer a medicina de forma restrita e direcionada dentro do escopo do programa federal."},{"n":"Consulta de Profissionais - CNES/DATASUS","u":"https://cnes.datasus.gov.br/pages/profissionais/consulta.jsp","d":"O sistema de Consulta de Profissionais do CNES (Cadastro Nacional de Estabelecimentos de Saúde), gerenciado pelo DATASUS (Departamento de Informática do Sistema Único de Saúde), é uma plataforma pública oficial instituída pelo Ministério da Saúde do Brasil. O portal centraliza e disponibiliza informações cadastrais detalhadas sobre todos os indivíduos que atuam formalmente no setor de saúde nacional, abrangendo registros de médicos, enfermeiros, psicólogos, fisioterapeutas, técnicos e demais colaboradores vinculados a instituições públicas, filantrópicas ou privadas."},{"n":"Consulta de Profissionais - CONFEA","u":"https://consultaprofissional.confea.org.br/","d":"O portal de Consulta Profissional do CONFEA (Conselho Federal de Engenharia e Agronomia) é a plataforma centralizada que integra as bases de dados de todos os Conselhos Regionais (CREA) do território nacional. O sistema permite pesquisar e validar publicamente o registro de profissionais das áreas de engenharia, agronomia, geologia, geografia e meteorologia, além de tecnólogos e técnicos vinculados."},{"n":"Consulta de Protesto - CENPROT-SP","u":"https://protestosp.com.br/consulta-de-protesto","d":"A Consulta de Protesto é uma ferramenta oficial disponibilizada pela Central de Serviços Eletrônicos Compartilhados dos Cartórios de Protesto do Estado de São Paulo (CENPROT-SP). A plataforma permite verificar, de forma centralizada e em tempo real, se um determinado CPF ou CNPJ possui títulos inadimplentes protestados em qualquer um dos Cartórios de Protesto de Letras e Títulos do estado."},{"n":"Consulta de Restituição IRPF - Receita Federal","u":"https://www.restituicao.receita.fazenda.gov.br/#/","d":"O sistema de Consulta à Restituição é uma plataforma oficial disponibilizada pela Secretaria da Receita Federal do Brasil. O portal permite a qualquer cidadão verificar o status de processamento da Declaração do Imposto de Renda da Pessoa Física (DIRPF) de um determinado ano-calendário, informando se a restituição já foi paga, se está na fila de espera, se foi enviada para o banco ou se apresenta pendências (malha fiscal)."},{"n":"Consulta Número - ABR Telecom","u":"https://consultanumero.abrtelecom.com.br/","d":"O portal Consulta Número é uma plataforma oficial mantida pela ABR Telecom (Associação Brasileira de Recursos em Telecomunicações). A entidade é a administradora judicialmente responsável pela portabilidade numérica no Brasil. O site permite que qualquer usuário insira um número de telefone (com DDD) para identificar a qual operadora de telecomunicações aquele terminal pertence no momento exato da consulta, além de informar se o número passou por portabilidade recente."},{"n":"Consulta Pública RNTRC - ANTT","u":"https://consultapublica.antt.gov.br/Site/ConsultaRNTRC.aspx","d":"O sistema de Consulta Pública do RNTRC (Registro Nacional de Transportadores Rodoviários de Cargas) é uma plataforma oficial mantida pela ANTT (Agência Nacional de Transportes Terrestres). O portal permite verificar a regularidade jurídica e operacional de Transportadores Autônomos de Cargas (TAC), Empresas de Transporte Rodoviário de Cargas (ETC) e Cooperativas (CTC) que operam no território nacional."},{"n":"ConsultaOperadora.com.br","u":"http://consultaoperadora.com.br/","d":"O ConsultaOperadora.com.br é um serviço web independente estruturado para identificar de forma rápida a operadora prestadora de serviços de telecomunicação vinculada a qualquer número de telefone brasileiro. A ferramenta processa consultas de telefonia fixa e móvel, levando em consideração as atualizações constantes decorrentes da portabilidade numérica no país."},{"n":"Consultas de Certidão PGFN/RFB (Pessoa Física)","u":"https://servicos.receitafederal.gov.br/servico/certidoes/","d":"Este sistema oficial da Secretaria da Receita Federal do Brasil (RFB) em conjunto com a Procuradoria-Geral da Fazenda Nacional (PGFN) permite a emissão da certidão conjunta de débitos federais para pessoas físicas. O serviço realiza uma varredura em tempo real nas bases de dados da União para verificar a existência de pendências de tributos administrados pela RFB e de débitos inscritos em Dívida Ativa da União sob a gestão da PGFN."},{"n":"Cover Your Tracks - EFF","u":"https://coveryourtracks.eff.org/","d":"O Cover Your Tracks (anteriormente conhecido como Panopticlick) é uma ferramenta de segurança e privacidade digital desenvolvida e mantida pela Electronic Frontier Foundation (EFF). A plataforma realiza uma simulação de rastreamento em tempo real para analisar a fundo a configuração do navegador do usuário, medindo o nível de proteção contra rastreadores invisíveis, anúncios invasivos e, principalmente, quantificando a singularidade da impressão digital do navegador (*browser fingerprinting*)."},{"n":"Craiyon","u":"https://www.craiyon.com/","d":"O Craiyon (anteriormente conhecido como DALL-E Mini) é um modelo de inteligência artificial generativa focado na conversão de texto em imagem (text-to-image). A plataforma processa comandos textuais descritivos (prompts) inseridos pelo usuário para renderizar e fornecer conjuntos de imagens inéditas e sintéticas em diversos estilos visuais, como fotografias, ilustrações e arte digital."},{"n":"Credilink","u":"https://www.credilink.com.br/","d":"A Credilink é uma plataforma privada voltada para a centralização de informações cadastrais, localização de indivíduos e empresas, análise de crédito e prevenção a fraudes no cenário brasileiro. O sistema consolida extensas bases de dados para fornecer relatórios detalhados contendo dados de contato, históricos de endereços, capacidade financeira e estruturas societárias."},{"n":"Criminal IP","u":"https://www.criminalip.io/","d":"O Criminal IP é uma plataforma de inteligência de ameaças cibernéticas (CTI) e um motor de busca especializado no mapeamento e monitoramento de ativos conectados à internet. A ferramenta realiza varreduras globais contínuas para coletar e indexar dados sobre endereços IP, portas abertas, serviços ativos, vulnerabilidades (CVEs), certificados SSL/TLS e reputação de domínios, gerando pontuações de risco em tempo real."},{"n":"crt.sh","u":"https://crt.sh/","d":"O crt.sh é um motor de busca público projetado para consultar logs de Transparência de Certificados (Certificate Transparency - CT). A ferramenta indexa continuamente todos os certificados digitais SSL/TLS emitidos por Autoridades Certificadoras (CAs) globais, permitindo auditar o histórico de emissões e a estrutura criptográfica de qualquer organização na internet."},{"n":"Crunchbase","u":"https://www.crunchbase.com/","d":"O Crunchbase é uma plataforma global de inteligência corporativa e dados de negócios focada no ecossistema de startups, empresas de tecnologia e fundos de investimento. O serviço cataloga e estrutura informações sobre rodadas de financiamento, investidores, aquisições, quadro de liderança, fundadores, estimativas de receita e tecnologias utilizadas por organizações empresariais no mundo todo."},{"n":"CTI Dashboard (Start.me)","u":"https://start.me/p/X2J5Gy/cti","d":"A página hospedada no Start.me é um painel (dashboard) customizado e centralizado que reúne uma vasta coleção de marcadores, links e ferramentas essenciais para analistas de Cyber Threat Intelligence (CTI). O repositório agrupa de forma categorizada diversos recursos web para análise de indicadores de comprometimento (IoCs), mapeamento de infraestruturas cibernéticas maliciosas, fontes de dados de phishing, análise de malware e monitoramento de atores de ameaças (APT)."},{"n":"CyberChef","u":"https://gchq.github.io/CyberChef/","d":"O CyberChef é uma aplicação web de código aberto desenvolvida pelo GCHQ (Government Communications Headquarters), conhecida como o \"Canivete Suíço Cibernético\". Ela permite realizar operações complexas de manipulação e transformação de dados, como codificação, decodificação, formatação, criptografia, descompressão e extração de propriedades, tudo por meio de uma interface visual intuitiva baseada em encadeamento de blocos (construção de \"receitas\")."},{"n":"Cyotek WebCopy","u":"https://www.cyotek.com/cyotek-webcopy","d":"O Cyotek WebCopy é um software utilitário desenvolvido para o sistema operacional Windows com o objetivo de baixar sites inteiros ou parciais localmente em um disco rígido para posterior visualização offline. Funcionando como um rastreador da web (*web crawler*), a ferramenta analisa recursivamente a estrutura de links de um endereço fornecido e realiza o download automático de todos os recursos disponíveis (páginas HTML, folhas de estilo CSS, scripts, imagens e documentos), remapeando os caminhos das URLs para que apontem para os arquivos locais."},{"n":"Câmeras CET-SP","u":"https://cameras.cetsp.com.br/View/Cam.aspx","d":"O portal de câmeras da CET-SP (Companhia de Engenharia de Tráfego de São Paulo) é uma plataforma governamental que disponibiliza aos cidadãos o acesso a imagens capturadas por centenas de câmeras de monitoramento viário distribuídas ao longo das principais avenidas, rodovias urbanas, marginais e cruzamentos da capital paulista."},{"n":"d4shboard (Start.me)","u":"https://start.me/p/vjlrM1/d4shboard","d":"A página d4shboard hospedada na plataforma Start.me é um painel visual personalizado que funciona como um indexador central de links e ferramentas para inteligência em fontes abertas (OSINT). O painel organiza de maneira categorizada diversos recursos de terceiros voltados para a busca e validação de identidades, usernames, números de telefone, dados de redes sociais, infraestruturas de rede e vazamentos de dados."},{"n":"Dados Abertos da Dívida Ativa da União (PGFN)","u":"https://www.gov.br/pgfn/pt-br/assuntos/divida-ativa-da-uniao/transparencia-fiscal-1/copy_of_dados-abertos","d":"Este portal, mantido pela Procuradoria-Geral da Fazenda Nacional (PGFN), disponibiliza de forma pública e estruturada as bases de dados de devedores que possuem débitos inscritos em Dívida Ativa da União e do Fundo de Garantia do Tempo de Serviço (FGTS). O repositório abrange registros detalhados contendo a identificação dos devedores (pessoas físicas e jurídicas), os valores consolidados das pendências financeiras, a natureza das dívidas (tributária, não tributária ou previdenciária) e a respectiva unidade da federação responsável pela cobrança."},{"n":"Dados Abertos da Receita Federal do Brasil","u":"https://www.gov.br/receitafederal/pt-br/acesso-a-informacao/dados-abertos","d":"A página de Dados Abertos da Receita Federal do Brasil (RFB) é o canal oficial de disponibilização de bases de dados estruturadas sobre a atividade cadastral e fiscal de pessoas jurídicas no país. O repositório centraliza e distribui os arquivos mensais da base pública do CNPJ, além de dados sobre comércio exterior, registros aduaneiros, estatísticas de arrecadação e cadastros de regimes tributários (como o Simples Nacional)."},{"n":"DarkWebInformer","u":"https://darkwebinformer.com/","d":"O DarkWebInformer é uma plataforma especializada em Cyber Threat Intelligence (CTI) focada no monitoramento, agregação e reporte de atividades cibercriminosas em tempo real. O serviço rastreia ativamente publicações de grupos de ransomware (shame sites), anúncios de venda de bancos de dados exfiltrados, vazamentos de credenciais e discussões de agentes de ameaça em fóruns clandestinos e canais restritos."},{"n":"Data Fake Generator","u":"https://datafakegenerator.com/generador.php","d":"O Data Fake Generator é uma plataforma online voltada para a geração automatizada de dados biográficos, civis e financeiros fictícios. A ferramenta simula perfis completos com nomes aleatórios, números de identificação (como CPFs ou equivalentes internacionais), endereços, e-mails, números de telefone e dados de cartões de teste de forma imediata e estruturada."},{"n":"Deep Dork Web","u":"https://guilherme-moraiss.github.io/Deep-Dork-Web/","d":"O Deep Dork Web é uma ferramenta baseada no navegador projetada para simplificar, organizar e automatizar a criação e execução de buscas avançadas utilizando operadores do Google (Google Dorks). A plataforma oferece uma interface gráfica que categoriza dorks predefinidas (como dados sensíveis, vulnerabilidades e falhas de configuração), permitindo a filtragem em tempo real e a substituição dinâmica de marcadores de posição (*placeholders*) pelos termos de interesse do investigador, gerando os links diretos para os mecanismos de busca."},{"n":"deepdarkCTI","u":"https://github.com/fastfire/deepdarkCTI","d":"O deepdarkCTI é um projeto hospedado no GitHub que funciona como uma coleção centralizada e colaborativa de fontes de Inteligência de Ameaças Cibernéticas (Cyber Threat Intelligence - CTI) focada estritamente nos domínios da Deep e Dark Web. O repositório agrupa listas estruturadas contendo endereços de páginas de gangues de ransomware (RaaS), fóruns de cibercrime, mercados negros (darknets), canais e grupos de Telegram/Discord focados em vazamentos de dados, bancos de dados de exploits e perfis de agentes de ameaça no X (Twitter). Além dos índices, o projeto documenta técnicas de busca e monitoramento voltadas a essas plataformas de segurança mitigada."},{"n":"DeHashed","u":"https://www.dehashed.com","d":"O DeHashed é um mecanismo de busca voltado à segurança cibernética e um agregador massivo de dados expostos. A ferramenta é projetada para analistas de segurança, investigadores e profissionais de inteligência, permitindo indexar e pesquisar bilhões de registros oriundos de vazamentos históricos de dados, violações de servidores, dumps de credenciais e exposições de dados ocorridas em fóruns cibercriminosos ou na Dark Web."},{"n":"Depositphotos Search by Image","u":"https://depositphotos.com/search-by-image.html","d":"O Depositphotos Search by Image é um recurso de busca reversa baseado em inteligência visual integrado à plataforma de banco de imagens Depositphotos. A ferramenta permite o upload de fotografias ou ilustrações para rastrear ativos visuais correspondentes, variações idênticas ou elementos estéticos semelhantes dentro de um catálogo com centenas de milhões de fotos de estoque, vetores e ilustrações comerciais."},{"n":"Despesas por Fornecedor (TCE-SP)","u":"https://transparencia.tce.sp.gov.br/despesas-fornecedor","d":"A seção \"Despesas por Fornecedor\" do Portal da Transparência do Tribunal de Contas do Estado de São Paulo (TCE-SP) é uma interface pública especializada de consulta que consolida todas as saídas orçamentárias e fluxos financeiros públicos direcionados a um contratado específico. Informando o identificador da entidade, o portal agrupa de forma cronológica os empenhos, liquidações e pagamentos executados pelos órgãos governamentais estaduais e municipais sob a jurisdição do tribunal."},{"n":"DeviceInfo.me","u":"https://www.deviceinfo.me/","d":"O DeviceInfo.me é uma plataforma web abrangente projetada para analisar, diagnosticar e exibir em tempo real todas as informações e metadados que um navegador de internet vaza ou expõe para os servidores web durante a navegação. A ferramenta destrincha parâmetros profundos de hardware (arquitetura da CPU, núcleos, nível de bateria, GPU), software (sistema operacional, agentes de usuário, plugins), rede (endereços IPv4/IPv6, provedor, ASN) e técnicas complexas de rastreamento adaptativo, como impressões digitais de Canvas, WebGL e AudioContext."},{"n":"Disconnect Search","u":"https://search.disconnect.me/","d":"O Disconnect Search é um metabuscador focado em privacidade que atua como um intermediário seguro entre o usuário e os principais mecanismos de busca da internet (como Google e Bing). O serviço encaminha as consultas de pesquisa de forma criptografada e anônima através dos servidores do Disconnect, impedindo que os provedores de busca capturem o endereço IP real, associem termos pesquisados a contas pessoais ou instalem cookies e rastreadores persistentes no navegador do usuário."},{"n":"DivulgaCandContas","u":"https://divulgacandcontas.tse.jus.br/","d":"O DivulgaCandContas (Sistema de Divulgação de Candidaturas e Contas Eleitorais) é uma plataforma oficial mantida pelo Tribunal Superior Eleitoral (TSE) do Brasil. O sistema consolida e disponibiliza dados detalhados sobre todos os candidatos que solicitaram registro para concorrer a cargos públicos em eleições municipais, estaduais e federais no país, além de centralizar as respectivas prestações de contas de campanha."},{"n":"DMI Tool Database","u":"https://wiki.digitalmethods.net/Dmi/ToolDatabase","d":"O DMI Tool Database (Digital Methods Initiative Tool Database), mantido pela Universidade de Amsterdã, é um diretório centralizado e uma enciclopédia wiki que cataloga ferramentas de software projetadas para a pesquisa de mídia digital, raspagem de dados públicos (*scraping*), mapeamento de redes e análise do comportamento de plataformas online. O repositório agrupa utilitários desenvolvidos tanto por acadêmicos quanto por comunidades de código aberto para interagir com APIs e interfaces web de grandes redes sociais, motores de busca e ecossistemas digitais."},{"n":"DNSdumpster","u":"https://dnsdumpster.com/","d":"O DNSdumpster é uma ferramenta online de inteligência e reconhecimento passivo mantida pelo projeto HackerTarget. Projetada para pesquisa técnica de superfície de ataque, a plataforma realiza consultas abrangentes em tabelas de registros DNS públicos, identificando servidores de nomes (NS), servidores de e-mail (MX), apontamentos de hosts (A e AAAA), registros de texto e validação (TXT) e subdomínios associados a um domínio-alvo. Além da listagem estruturada com respectivos endereços IP, ASN, provedor e geolocalização cadastral, a ferramenta gera mapas visuais e grafos interativos da arquitetura de rede mapeada."},{"n":"dnstwist","u":"https://dnstwist.it/","d":"O dnstwist é uma ferramenta especializada no processamento e geração de permutações de nomes de domínio para identificar possíveis ameaças cibernéticas. A partir de um domínio inserido, a plataforma utiliza algoritmos avançados de substituição (bitsquatting, homóglifos, omissão, transposição e inserção de caracteres) para conceber variações textuais idênticas ou semelhantes ao domínio original. Em seguida, ela faz varreduras ativas para checar quais dessas variantes estão registradas na internet e operando serviços de rede."},{"n":"Domain Hunter Gatherer","u":"https://domainhuntergatherer.com/","d":"O Domain Hunter Gatherer é uma ferramenta instalável projetada para localizar, minerar e analisar domínios expirados ou abandonados que ainda possuem relevância técnica na internet. O software automatiza a varredura de motores de busca por palavras-chave, realiza a raspagem crawling de sites de alta autoridade à procura de links quebrados e monitora plataformas de leilão de domínios, agregando métricas de SEO e históricos de funcionamento de forma centralizada."},{"n":"Domain Reputation Check - APIVoid","u":"https://www.apivoid.com/tools/domain-reputation-check","d":"O APIVoid Domain Reputation Check é uma ferramenta baseada na web projetada para analisar a confiabilidade e a segurança de um nome de domínio. Ela cruza o alvo contra dezenas de mecanismos de reputação cibernética, listas de bloqueio de spam, servidores de comando e controle (C2), e bases de dados de phishing e malware, fornecendo um score de risco consolidado, além de informações básicas sobre o IP e o servidor de hospedagem."},{"n":"DomainTools WHOIS","u":"https://whois.domaintools.com/","d":"O DomainTools WHOIS é uma plataforma avançada de inteligência cibernética focada no mapeamento de infraestrutura de rede e propriedades digitais. A ferramenta coleta, centraliza e analisa dados de registros de nomes de domínio (WHOIS), informações de servidores de DNS, históricos de apontamentos e dados de endereços IP. Ela permite identificar os proprietários legais, organizações associadas, localizações cadastrais e datas de criação de ativos na internet."},{"n":"DotDB","u":"https://dotdb.com/","d":"O DotDB é um motor de busca especializado em nomes de domínio que gerencia um banco de dados massivo contendo informações sobre centenas de milhões de registros distribuídos em praticamente todas as extensões disponíveis (TLDs e ccTLDs). A plataforma permite a execução de consultas textuais para identificar qualquer domínio registrado na internet que contenha uma palavra-chave, substring ou padrão específico em seu nome."},{"n":"DuckDuckGo","u":"https://duckduckgo.com/","d":"O DuckDuckGo é um mecanismo de busca na web voltado para a preservação da privacidade e confidencialidade das consultas dos usuários. A plataforma indexa a rede mundial de computadores por meio de seu próprio rastreador (*DuckDuckBot*) e da agregação de centenas de fontes externas (como Bing, Wikipedia e parceiros próprios). Diferente dos mecanismos comerciais tradicionais, o DuckDuckGo não rastreia o histórico de navegação, não associa consultas a perfis de usuários, não armazena endereços IP em logs persistentes e não constrói perfis comportamentais para direcionamento de anúncios."},{"n":"E-mail Header Analyzer (Gaijin.at)","u":"https://gaijin.at/en/tools/e-mail-header-analyzer","d":"O Gaijin.at E-mail Header Analyzer é uma utilidade web desenvolvida para decodificar, estruturar e analisar metadados técnicos ocultos contidos em cabeçalhos brutos de mensagens eletrônicas (e-mails). A ferramenta processa as linhas de texto inseridas pelo usuário e organiza de forma legível o fluxo de entrega da mensagem, explicitando carimbos de data/hora (timestamps), clientes de e-mail utilizados, servidores de trânsito, registros de segurança (como SPF, DKIM e DMARC) e os saltos (hops) efetuados pela mensagem desde a origem até o destino."},{"n":"e-Simples Auditoria - Consulta CNPJ","u":"https://www.esimplesauditoria.com/consulta-cnpj","d":"A ferramenta de Consulta CNPJ da e-Simples Auditoria é uma interface web voltada para a busca e consolidação de informações cadastrais de empresas registradas no Brasil. A plataforma consome e organiza dados públicos da Receita Federal e de órgãos fazendários, disponibilizando de forma estruturada a Razão Social, Nome Fantasia, situação cadastral, data de abertura, Classificação Nacional de Atividades Econômicas (CNAE principal e secundários), endereço físico completo, regime de tributação (como opção pelo Simples Nacional/MEI) e a composição do Quadro de Sócios e Administradores (QSA)."},{"n":"Emkei.cz","u":"https://emkei.cz/","d":"O Emkei.cz é uma plataforma online de \"fake mailer\" estruturada para permitir o envio de e-mails com cabeçalhos SMTP totalmente customizáveis. A ferramenta possibilita a alteração arbitrária de campos críticos como o remetente (From), destinatário (To), assunto, conteúdo da mensagem (em formato de texto simples ou código HTML estruturado), além de permitir a inclusão de arquivos anexos e a parametrização de cabeçalhos avançados, como *Reply-To*, *Errors-To* e variáveis personalizadas do protocolo de correio eletrônico."},{"n":"Epieos","u":"https://epieos.com/","d":"O Epieos é uma plataforma modular de inteligência de fontes abertas (OSINT) especializada na realização de buscas reversas automatizadas a partir de e-mails ou números de telefone. A ferramenta consulta de forma passiva diversas APIs de plataformas globais (com forte ênfase no ecossistema Google, Skype e redes sociais) para extrair identificadores exclusivos (como o GAIA ID), nomes reais, fotos de perfil, avaliações no Google Maps e calendários públicos vinculados ao dado inicial."},{"n":"Escavador","u":"https://www.escavador.com/","d":"O Escavador é uma plataforma brasileira especializada na centralização, estruturação e indexação de dados públicos provenientes de diários oficiais, tribunais de justiça e órgãos governamentais. A ferramenta compila essas informações fragmentadas e organiza perfis automatizados que reúnem o histórico jurídico, menções profissionais, nomeações públicas e trajetórias acadêmicas de pessoas físicas, além de dados institucionais e processos associados a pessoas jurídicas."},{"n":"eTools.ch","u":"https://www.etools.ch/","d":"O eTools.ch é um serviço de metabusca transparente e privativo sediado na Suíça. A ferramenta atua como um agregador federado de motores de pesquisa, realizando consultas simultâneas em diversos buscadores comerciais e independentes de relevância global (como Google, Bing, Brave, Yahoo, Wikipedia, Exalead, Mojeek, entre outros). A plataforma normaliza, desduplica e reordena os resultados em uma interface centralizada e rápida, sem armazenar dados de identificação pessoal, sem registrar endereços IP ou histórico de pesquisas e sem injetar cookies persistentes de rastreamento comercial."},{"n":"Everypixel","u":"https://www.everypixel.com/","d":"O Everypixel é um mecanismo de busca avançado e metabuscador visual alimentado por inteligência artificial, especializado em indexar, filtrar e agregar milhões de fotografias de bancos de imagens gratuitos e pagos de todo o mundo. A plataforma conta com recursos de busca reversa de imagens, classificação estética por aprendizado de máquina, detecção de padrões visuais, reconhecimento de componentes por visão computacional e identificação de imagens geradas por IA."},{"n":"Exa (antigo Metaphor)","u":"https://exa.ai/","d":"O Exa é um mecanismo de busca e API construído especificamente para modelos de inteligência artificial e analistas de dados. Diferente dos indexadores convencionais baseados em correspondência exata de palavras-chave, o Exa utiliza representações vetoriais (*embeddings*) e modelos de linguagem para processar consultas em linguagem natural ou por similaridade semântica. O sistema prevê URLs e recupera páginas web com base no significado contextual do texto, possibilitando buscas por intenção, conceito, estrutura textual ou links análogos."},{"n":"Exif Viewer","u":"https://addons.mozilla.org/pt-BR/firefox/addon/exif-viewer/","d":"O Exif Viewer é uma extensão para o navegador Mozilla Firefox projetada para ler e exibir metadados estruturados (como EXIF, IPTC e XMP) embutidos em arquivos de imagem. A ferramenta inspeciona os parâmetros técnicos ocultos da mídia diretamente da página web ou de arquivos locais, revelando dados como o modelo da câmera/smartphone, configurações de captura (abertura, ISO, velocidade), data e hora exatas da criação do arquivo, software de edição utilizado e, quando disponíveis, as coordenadas geográficas precisas (GPS) de onde a foto foi tirada."},{"n":"ExifData.com","u":"https://www.exifdata.com/","d":"O ExifData.com é uma aplicação web voltada para a inspeção e extração de metadados técnicos incorporados em arquivos de imagem digital (como JPEG, TIFF, PNG e RAW). A ferramenta processa o arquivo submetido pelo usuário e decodifica as estruturas de dados dos padrões EXIF, IPTC e XMP, revelando parâmetros de captura da câmera/smartphone (marca, modelo, abertura, velocidade do obturador, ISO, distância focal), data e hora de criação/modificação, dados de software de edição e coordenadas geográficas de GPS (latitude, longitude e altitude)."},{"n":"ExifTool","u":"https://exiftool.org/","d":"O ExifTool é um aplicativo multiplataforma de linha de comando e uma biblioteca Perl dedicada à leitura, escrita e edição de metadados estruturados contidos em uma ampla variedade de arquivos (como imagens, vídeos, áudios, PDFs e documentos de texto). A ferramenta é considerada a referência global para extração de dados ocultos, decodificando tags complexas de fabricantes de câmeras, informações de direitos autorais, históricos de modificação de software, parâmetros técnicos de captura e coordenadas geográficas de satélite."},{"n":"ExpandURL","u":"https://www.expandurl.net/","d":"O ExpandURL é uma plataforma online desenvolvida para expandir e revelar o endereço de destino real oculto por trás de URLs encurtadas (como as geradas por serviços como bit.ly, tinyurl, t.co, entre outros). A ferramenta processa a cadeia de redirecionamentos HTTP, inspeciona os cabeçalhos de resposta dos servidores envolvidos e fornece um detalhamento técnico do link final sem exigir que o usuário acesse diretamente o endereço."},{"n":"Export Comments","u":"https://exportcomments.com/","d":"O Export Comments é um serviço baseado na web projetado para coletar, extrair e exportar comentários, respostas e metadados de engajamento de postagens em diversas redes sociais (incluindo Instagram, YouTube, TikTok, Facebook, Twitter/X e Reddit). A ferramenta processa a URL fornecida e compila as interações da postagem em planilhas estruturadas (Excel/CSV), contendo nomes de perfil, identificadores de usuário (@handles), carimbos de data/hora (timestamps), textos dos comentários e contagens de reações/curtidas."},{"n":"ExpressVPN","u":"https://www.expressvpn.com/","d":"O ExpressVPN é um serviço comercial de Rede Virtual Privada (VPN) projetado para tunelar e criptografar o tráfego de internet do usuário, mascarando o seu endereço IP real. A ferramenta opera através de uma infraestrutura global de servidores de alta velocidade distribuídos em múltiplos países, utilizando protocolos de segurança avançados (como o Lightway) para impedir a interceptação de dados transitados e mitigar o rastreamento geográfico ou técnico por parte de terceiros."},{"n":"Extrator CPF/CNPJ Console","u":"https://github.com/willianwistuba/ExtratorCPFCNPJ_Console/blob/main/extratorCPFCNPJ.js","d":"O Extrator CPF/CNPJ Console é um script em JavaScript desenvolvido para automatizar a varredura, identificação e extração de números de Cadastro de Pessoas Físicas (CPF) e Cadastro Nacional da Pessoa Jurídica (CNPJ). Operando diretamente na linha de comando, a ferramenta processa cadeias de caracteres (*strings*) ou arquivos de texto estruturados e desestruturados, aplicando expressões regulares (RegEx) para isolar esses identificadores fiscais brasileiros de forma célere."},{"n":"Extrator de Links (Inspetor de Elementos)","u":"https://github.com/willianwistuba/extracao_URLs_Inspetor_Elementos/blob/main/extractorLinks.js","d":"O Extrator de Links é um script em JavaScript projetado para ser executado diretamente no Console do Desenvolvedor (DevTools) de qualquer navegador de internet. A ferramenta realiza uma varredura automatizada no Modelo de Objeto do Documento (DOM) da página web que está atualmente aberta, localizando, isolando e listando de forma estruturada todos os hiperlinks (`href`) e URLs presentes nas tags HTML."},{"n":"FAA Aircraft Registry - Name Inquiry","u":"https://registry.faa.gov/aircraftinquiry/Search/NameInquiry","d":"O *Name Inquiry* do Registro de Aeronaves da Federal Aviation Administration (FAA) é o mecanismo de consulta pública oficial do governo dos Estados Unidos para verificar a titularidade e o registro de aeronaves civis norte-americanas (prefixo N-Number). O sistema permite realizar pesquisas estruturadas a partir do nome de indivíduos ou da razão social de empresas, retornando uma listagem completa das aeronaves registradas sob aquela titularidade, com detalhes técnicos de fabricante, modelo, número de série, ano de fabricação, tipo de motor, status do certificado de aeronavegabilidade e endereço cadastral declarado."},{"n":"FaceCheck.id","u":"https://facecheck.id/","d":"O FaceCheck.id é um motor de busca especializado em reconhecimento facial baseado em inteligência artificial. A plataforma permite que o usuário envie a imagem do rosto de um indivíduo e, por meio do mapeamento de vetores biométricos, realize uma varredura em uma ampla base de dados indexada da internet. O sistema localiza correspondências visuais em redes sociais, fóruns, blogs, portais de notícias, sites institucionais e registros públicos (como arquivos de canais de denúncia ou cadastros criminais), apontando os links de onde as imagens semelhantes foram extraídas."},{"n":"FaceMorph.me","u":"https://facemorph.me/","d":"O FaceMorph.me é uma plataforma web baseada em algoritmos de Inteligência Artificial Generativa (como redes adversárias generativas - GANs) que permite a criação, modificação e transição suave (interpolação) entre rostos humanos gerados sinteticamente. O utilizador pode navegar por um espaço latente de características faciais para customizar traços e gerar faces exclusivas de pessoas que não existem no mundo real."},{"n":"FaceReader (Noldus)","u":"https://www.noldus.com/facereader","d":"O FaceReader é um software de nível científico desenvolvido pela Noldus Information Technology para a análise automática de expressões faciais. A ferramenta utiliza modelos avançados de visão computacional e inteligência artificial para codificar e classificar instantaneamente as expressões faciais humanas em emoções básicas (alegria, tristeza, raiva, surpresa, medo, nojo e neutralidade), além de estimar métricas como idade, género, etnia, direção do olhar e orientação da cabeça."},{"n":"FaceSwapper.ai","u":"https://faceswapper.ai/","d":"O FaceSwapper.ai é uma plataforma online baseada em modelos de inteligência artificial generativa que executa a troca automatizada de rostos (*face swap*) em arquivos de imagem e vídeo. A ferramenta identifica os pontos biométricos de uma face em uma foto de origem e os projeta de forma fluida sobre o corpo e cenário de uma imagem de destino, preservando as expressões, iluminação e angulação do arquivo original."},{"n":"Fake Name Generator","u":"https://pt.fakenamegenerator.com","d":"O Fake Name Generator é uma plataforma online projetada para a criação automatizada de identidades fictícias completas e realistas. A ferramenta gera instantaneamente um perfil civil simulado, incluindo nome, endereço, número de tele
