everse Image Search","u":"https://www.numlookup.com/reverse-image-search?utm_source=chatgpt.com","d":"O NumLookup Reverse Image Search é uma ferramenta online de busca reversa de imagens e inteligência visual (IMINT). Utilizando visão computacional e algoritmos de aprendizado profundo (*deep learning*), a plataforma analisa padrões visuais, faces, formas e texturas em arquivos enviados ou URLs, comparando-os com uma base massiva de bilhões de imagens indexadas na internet para encontrar correspondências idênticas, versões modificadas ou conteúdos contextualmente correlacionados."},{"n":"OffSec Tools - OSINT Tag","u":"https://offsec.tools/tag/osint","d":"O OffSec Tools é um repositório e diretório colaborativo focado em catalogar ferramentas de segurança da informação, testes de intrusão e cibersegurança. A seção filtrada pela tag `osint` reúne uma coleção de softwares, scripts, frameworks e utilitários voltados especificamente para a coleta, processamento e análise de dados de fontes abertas na internet."},{"n":"Oh Shint It's A Blog","u":"https://ohshint.gitbook.io/oh-shint-its-a-blog/","d":"O *Oh Shint It's A Blog* (hospedado no GitBook) é um repositório centralizado de conhecimento voltado para a comunidade de Inteligência de Fontes Abertas (OSINT). A plataforma funciona como uma enciclopédia prática e um guia de links curados, oferecendo listas estruturadas de ferramentas, metodologias passo a passo para investigações digitais, dicas de OPSEC (Segurança de Operações) e recursos para rastreamento de diversas entidades na internet."},{"n":"OnionLand Search Engine","u":"https://onionlandsearchengine.net/","d":"O OnionLand Search Engine é um motor de busca especializado na varredura e indexação de conteúdos dentro da Dark Web, cobrindo de forma simultânea as redes ocultas Tor (`.onion`) e I2P, além de correlacionar resultados com a internet convencional (Clearnet). A plataforma atua de maneira semelhante aos buscadores convencionais, mas foca em extrair e catalogar dados textuais de fóruns anônimos, mercados clandestinos, diretórios e repositórios não indexados pelo Google."},{"n":"OnlineSIM","u":"https://onlinesim.io/","d":"O OnlineSIM é um serviço focado no fornecimento de números de telefone virtuais temporários (VoIP) e chips virtuais de diversos países. A ferramenta permite a recepção de mensagens de texto (SMS) de forma automatizada através de sua interface web ou API, servindo primordialmente para contornar mecanismos de autenticação de dois fatores (2FA) e validação de registros em serviços digitais."},{"n":"Open-i","u":"https://openi.nlm.nih.gov/","d":"O Open-i é um serviço de busca e recuperação de imagens biomédicas desenvolvido pela National Library of Medicine (NLM), vinculada ao National Institutes of Health (NIH) dos Estados Unidos. A ferramenta provê acesso indexado a milhões de imagens, ilustrações clínicas, fotografias médicas, gráficos e radiografias provenientes de artigos científicos de acesso aberto do PubMed Central (PMC), associando cada imagem ao seu resumo e contexto textual original."},{"n":"OpenCorporates","u":"https://opencorporates.com/","d":"O OpenCorporates é a maior base de dados aberta sobre o ecossistema corporativo mundial, indexando e padronizando informações de centenas de milhões de empresas e administradores em mais de 140 jurisdições. A plataforma coleta dados diretamente dos registros públicos oficiais de governos (juntas comerciais, casas de registros e secretarias de estado), consolidando informações como identificadores corporativos, status operacional, data de incorporação, endereços de registro, estrutura societária e cargos diretivos (diretores, administradores e secretários corporativos)."},{"n":"OpenCTI (Open Cyber Threat Intelligence)","u":"https://filigran.io/products/opencti","d":"O OpenCTI é uma plataforma de código aberto projetada para gerenciar, estruturar e operacionalizar o conhecimento de inteligência de ameaças cibernéticas (Cyber Threat Intelligence - CTI). Desenvolvida originalmente em colaboração com a CERT-EU, a ferramenta unifica dados técnicos (como indicadores de comprometimento - IoCs, IPs, hashes) e dados táticos/estratégicos (como perfis de grupos de ameaças (APTs), táticas, técnicas e procedimentos (TTPs) do framework MITRE ATT&CK, campanhas e malwares) em um modelo de dados unificado baseado no padrão STIX2."},{"n":"OpenFace","u":"https://github.com/TadasBaltrusaitis/OpenFace","d":"O OpenFace é uma ferramenta de código aberto voltada para a análise de faces humanas por meio de técnicas avançadas de visão computacional. O software é capaz de realizar a detecção e o rastreamento de pontos de referência faciais (*facial landmarks*), estimar a pose geométrica e a rotação da cabeça, rastrear a direção do olhar (gaze) e reconhecer Unidades de Ação Facial (*Action Units* - AUs) baseadas no Sistema de Codificação de Ação Facial (FACS) para identificar microexpressões e emoções."},{"n":"OpenStreetMap (OSM)","u":"https://www.openstreetmap.org","d":"O OpenStreetMap é um projeto colaborativo global que visa criar e fornecer dados geográficos e cartográficos livres e editáveis para todo o mundo. Diferente de provedores de mapas proprietários, a plataforma funciona como uma base de dados geoespaciais construída por voluntários, fornecendo detalhes minuciosos sobre ruas, construções, pontos de interesse (POIs), hidrografia, linhas de transporte e rotas."},{"n":"OSINT Dashboard (Start.me)","u":"https://start.me/p/MER7on/osint","d":"A página hospedada na plataforma Start.me é um painel visual personalizado que atua como um indexador abrangente de links e ferramentas para inteligência em fontes abertas (OSINT). O painel é estruturado em blocos e categorias temáticas, reunindo recursos voltados para a investigação de pessoas, e-mails, números de telefone, redes sociais, imagens, dados geoespaciais, registros governamentais e infraestruturas digitais."},{"n":"OSINT Dojo Resources","u":"https://www.osintdojo.com/resources/","d":"A página de recursos do OSINT Dojo é um diretório digital estruturado que atua como uma central de curadoria para a comunidade de inteligência de fontes abertas. A plataforma reúne, categoriza e indexa uma ampla gama de links para ferramentas externas, frameworks especializados, guias práticos, mapas mentais, blogs de referência e materiais de treinamento voltados para capacitação acadêmica e profissional em OSINT."},{"n":"OSINT Framework","u":"https://osintframework.com/","d":"O OSINT Framework é uma plataforma web baseada em uma estrutura de árvore interativa que visa facilitar a busca e o acesso a ferramentas e fontes de informações públicas na internet. O diretório organiza recursos por categorias focadas em tipos específicos de dados (como endereços de e-mail, nomes de usuário, redes sociais, IPs, registros públicos, geolocalização, entre outros), servindo como um guia tático de navegação para analistas de inteligência e segurança cibernética."},{"n":"OSINT Industries","u":"https://www.osint.industries/","d":"O OSINT Industries é uma plataforma avançada de inteligência de fontes abertas voltada para o enriquecimento de dados e rastreamento de identidades a partir de pontos de entrada mínimos, como um endereço de e-mail ou um número de telefone. A ferramenta realiza varreduras em tempo real em centenas de sites, serviços web e redes sociais para identificar contas associadas, perfis digitais, fotos, localizações sugeridas e outras pegadas digitais deixadas pelo alvo na internet."},{"n":"OSINT Stuff Tool Collection","u":"https://cipher387.github.io/osint_stuff_tool_collection/","d":"O OSINT Stuff Tool Collection (mantido por cipher387 / @cyb_detective) é uma das coleções e diretórios mais abrangentes da comunidade de inteligência de fontes abertas. A página funciona como um índice centralizado que categoriza e redireciona o usuário para centenas de ferramentas online, scripts e motores de busca especializados em subnichos de OSINT (como geolocalização, redes sociais específicas, análise de mídias, investigação de IPs/domínios e infraestrutura de mensageiros)."},{"n":"OSINT.SH","u":"https://osint.sh/","d":"O OSINT.SH é uma plataforma web centralizada que reúne uma coleção diversificada de ferramentas gratuitas voltadas para a fase de reconhecimento e coleta de informações de infraestrutura (*Information Gathering*). O site oferece utilitários automatizados para auditoria e mapeamento de domínios, subdomínios, registros de DNS, certificados SSL, histórico de WHOIS, geolocalização de IPs e identificação de buckets públicos expostos em serviços de nuvem (como AWS e Azure)."},{"n":"OSINTLeak","u":"https://osintleak.com/","d":"O OSINTLeak é uma plataforma especializada em inteligência de fontes abertas voltada para a identificação e monitoramento de dados comprometidos. O serviço agrega e indexa bilhões de registros oriundos de grandes vazamentos, violações de segurança corporativas, dumps de bancos de dados clandestinos, stealer logs e conteúdos monitorados em fóruns cibercriminosos e redes anônimas."},{"n":"PagSeguro (Tela de Acesso / Recuperação)","u":"https://acesso.pagseguro.uol.com.br/","d":"A URL corresponde à interface de login e recuperação de credenciais do PagSeguro (PagBank), uma das principais plataformas de serviços financeiros e meios de pagamento do Brasil. No contexto de segurança e investigações, sua área pública de redefinição de senha permite submeter dados cadastrais para verificar vínculos de contas."},{"n":"Painel de Consultas Públicas - IBAMA","u":"https://www.gov.br/ibama/pt-br/servicos/consultas","d":"O portal de serviços e consultas públicas do IBAMA (Instituto Brasileiro do Meio Ambiente e dos Recursos Naturais Renováveis) é a plataforma oficial centralizada que reúne as bases de dados de fiscalização, controle e licenciamento ambiental do governo federal. O sistema disponibiliza o acesso a relatórios públicos contendo autuações, multas administrativas, áreas embargadas (por desmatamento ou irregularidades), consulta ao Cadastro Técnico Federal (CTF) e o status de licenças ambientais."},{"n":"Palette (OSINT Industries)","u":"https://palette.osint.industries/","d":"O Palette é uma ferramenta utilitária desenvolvida pela OSINT Industries projetada para processar e analisar imagens, extraindo suas paletas de cores proeminentes e metadados visuais básicos de forma automatizada. Ela auxilia analistas a decompor componentes cromáticos e elementos de mídia para investigações visuais e forenses."},{"n":"Pesquisa CNPA - ANAC","u":"https://cnpa.anac.gov.br/CNPA/PesquisarCnpa","d":"O sistema de pesquisa da Certidão Negativa de Propriedade de Aeronaves (CNPA), gerenciado pela Agência Nacional de Aviação Civil (ANAC), é uma plataforma pública oficial integrada à base de dados do Registro Aeronáutico Brasileiro (RAB). O portal permite consultar de forma direta se um determinado CPF (pessoa física) ou CNPJ (pessoa jurídica) consta como proprietário de alguma aeronave registrada no território nacional. Caso nenhum ativo esteja vinculado ao documento informado, o sistema possibilita a emissão instantânea da Certidão Negativa."},{"n":"Pesquisa Pública de Processos SEI - ANAC","u":"https://sei.anac.gov.br/sei/modulos/pesquisa/md_pesq_processo_pesquisar.php?acao_externa=protocolo_pesquisar&acao_origem_externa=protocolo_pesquisar&id_orgao_acesso_externo=0","d":"O módulo de Pesquisa Pública do Sistema Eletrônico de Informações (SEI) da ANAC é a interface oficial voltada à consulta e acompanhamento de processos administrativos eletrônicos e documentos gerados no âmbito da agência reguladora. A plataforma permite a qualquer interessado realizar buscas parametrizadas por número de protocolo/processo, interessado/remetente (nome de pessoa física ou razão social/CNPJ), assunto, unidade geradora, data de autuação ou termos textuais livres contidos nos autos públicos."},{"n":"PhishTank","u":"https://phishtank.org/","d":"O PhishTank é uma plataforma colaborativa global e um repositório centralizado de inteligência contra ameaças, especializado na identificação, compartilhamento e validação de URLs utilizadas em ataques de engenharia social e *phishing*. Operado de forma comunitária, o serviço permite que analistas de segurança enviem suspeitas de links fraudulentos, os quais passam por um sistema de votação e validação técnica por pares para confirmar se a infraestrutura está sendo utilizada para fins maliciosos."},{"n":"Phonebook.cz","u":"https://phonebook.cz","d":"O Phonebook.cz é uma aplicação web especializada de propriedade da Intelligence X que realiza pesquisas em larga escala para listar subdomínios, endereços de correio eletrônico e URLs correspondentes a um determinado domínio de entrada. A ferramenta opera consultando o massivo arquivo de dados indexados da Intelligence X, varrendo bilhões de registros para recuperar seletores de identidade associados a uma infraestrutura organizacional específica."},{"n":"PhoneInfoga","u":"https://github.com/sundowndev/PhoneInfoga","d":"O PhoneInfoga é uma das ferramentas de código aberto mais conhecidas para a coleta de inteligência e reconhecimento de números de telefone internacionais. Desenvolvido em Go (com suporte a execução via CLI e Web UI), o software processa números no padrão internacional E.164 para validar sua existência, determinar operadora de telefonia, linha de transmissão (VoIP, móvel, fixo), país/região geográfica associada e automatizar buscas por pegada digital em motores de busca e serviços públicos da web através de mecanismos de *footprinting*."},{"n":"Photopea","u":"https://www.photopea.com/","d":"O Photopea é um editor de gráficos rasterizados e vetoriais avançado que funciona inteiramente no navegador de internet, sem a necessidade de plugins ou instalações locais. Ele possui compatibilidade nativa com os principais formatos de arquivos de imagem e design do mercado (como PSD, AI, XD, Sketch, RAW, PDF, PNG e JPG), oferecendo uma interface e funcionalidades equivalentes a softwares profissionais de edição instaláveis."},{"n":"Pic2Map","u":"https://www.pic2map.com/","d":"O Pic2Map é uma ferramenta online e automatizada de análise de dados de imagem que processa metadados ocultos contidos em arquivos de fotografia (como metadados EXIF/TIFF). Ao receber o upload de uma imagem, a plataforma extrai as coordenadas geográficas gravadas pelo GPS do dispositivo captor (se houver) e plota instantaneamente a localização exata do registro fotográfico em um mapa digital interativo."},{"n":"Picarta.ai","u":"https://picarta.ai/","d":"O Picarta.ai é uma plataforma online que utiliza modelos avançados de inteligência artificial, visão computacional e redes neurais profundas para geolocalizar fotografias automaticamente. Ao processar uma imagem enviada pelo usuário, o sistema analisa elementos visuais complexos — como características arquitetônicas, vegetação, relevo, sinalizações viárias, padrões climáticos e iluminação — sem depender de metadados EXIF, calculando e estimando o país, a região, a cidade e as coordenadas de GPS mais prováveis do local da captura, acompanhados de um raio de confiança estatística."},{"n":"PicWish","u":"https://picwish.com/pt/","d":"O PicWish é uma plataforma online equipada com ferramentas de inteligência artificial voltadas para o processamento, edição e aprimoramento automatizado de imagens. Suas principais funcionalidades incluem a remoção instantânea de planos de fundo, eliminação de objetos indesejados através de preenchimento inteligente, upscaling (aumento de resolução) de mídias de baixa qualidade, além de recursos para desfoque de rostos e restauração de fotografias antigas ou corrompidas."},{"n":"PimEyes","u":"https://pimeyes.com/","d":"O PimEyes é um motor de busca de reconhecimento facial avançado baseado em nuvem que permite aos usuários fazer o upload de uma fotografia contendo um rosto humano para escanear a internet pública em busca de outras imagens contendo a mesma pessoa. A ferramenta utiliza algoritmos de inteligência artificial e aprendizado de máquina para mapear características biométricas faciais, cruzando-as com um índice massivo de fotos extraídas de sites, blogs, fóruns, portais de notícias e artigos públicos na web."},{"n":"Pipl Personal Information Removal Request","u":"https://pipl.com/personal-information-removal-request","d":"Esta URL corresponde à página oficial de solicitação de remoção de informações pessoais (Opt-Out) do Pipl, um dos maiores e mais robustos motores de busca de identidade e agregação de dados biográficos do mundo. O formulário permite que indivíduos solicitem formalmente a exclusão de seus registros (como nomes, e-mails, históricos de endereços, números de telefone e perfis sociais) para que deixem de ser localizados e exibidos através das consultas comerciais da plataforma."},{"n":"PIX QRCode Tool","u":"https://pix.nascent.com.br/","d":"O PIX QRCode Tool é uma aplicação utilitária web voltada para o parsing (análise gramatical), decodificação e validação de strings de \"PIX Copia e Cola\" ou payloads de QRCodes baseados no padrão EMV Co (BRCode), adotado pelo Banco Central do Brasil para o sistema de pagamentos instantâneos. A ferramenta decompõe a arquitetura do código de barras bidimensional, valida e corrige o código de redundância cíclica (CRC) e exibe os blocos informacionais estruturados de maneira legível ao usuário."},{"n":"Pixsy Monitor","u":"https://www.pixsy.com/monitor","d":"O Pixsy Monitor é uma plataforma online desenvolvida para monitorar e rastrear a utilização de imagens e fotografias na internet. Utilizando algoritmos proprietários de inteligência visual e rastreadores automatizados (scrapers), o serviço permite que fotógrafos, criadores e analistas submetam portfólios visuais para escanear continuamente a web em busca de correspondências exatas ou imagens derivadas, identificando onde, quando e por quem uma mídia está sendo exibida."},{"n":"Plataforma Krea.ai","u":"https://www.krea.ai/","d":"O Krea.ai é uma plataforma baseada em inteligência artificial focada na geração, edição, ampliação (*upscaling*) e aprimoramento em tempo real de imagens e vetores. Utilizando modelos generativos avançados, a ferramenta permite converter esboços simples em imagens complexas, otimizar resoluções de arquivos visuais de baixa qualidade e renderizar elementos gráficos customizados de forma ágil."},{"n":"Plataforma Lampyre","u":"https://lampyre.io/","d":"O Lampyre é uma ferramenta analítica profissional projetada para investigadores, analistas de segurança da informação e especialistas em OSINT. O ecossistema opera por meio de um software instalado localmente que se conecta a serviços em nuvem para executar centenas de requisições automatizadas (chamadas de *Tasks*). A ferramenta consolida dados de fontes abertas, registros públicos e bancos de dados comerciais, estruturando as respostas em tabelas relacionais e mapas de vínculos visuais."},{"n":"Plataforma Let's Enhance","u":"https://letsenhance.io/","d":"O Let's Enhance é uma plataforma baseada em nuvem que utiliza redes neurais e algoritmos de aprendizado profundo para automatizar o aprimoramento e a ampliação (*upscaling*) de imagens. A ferramenta é especializada em aumentar a resolução de arquivos visuais em até 16 vezes sem perda de definição, remover artefatos de compressão (comuns em formatos JPEG), ajustar cores automaticamente e restaurar a nitidez de fotos desfocadas ou severamente pixeladas."},{"n":"Plataforma Lucidchart","u":"https://lucid.co/lucidchart","d":"O Lucidchart é uma plataforma de colaboração visual baseada em nuvem que permite aos usuários criar diagramas, fluxogramas, mapas mentais, organogramas e esquemas técnicos de forma intuitiva. A ferramenta oferece uma vasta biblioteca de formas, conectores automáticos e recursos de arrastar e soltar, facilitando a organização de informações complexas de maneira gráfica e centralizada."},{"n":"Plate Recognizer","u":"https://platerecognizer.com/","d":"O Plate Recognizer é uma solução comercial de reconhecimento automático de placas veiculares (ALPR). O módulo Snapshot lê placas em fotografias enviadas pelo site ou por API, e o Stream processa transmissões de câmeras (RTSP) e arquivos de vídeo. Além da placa, o sistema identifica marca, modelo, cor, região e direção do veículo, funcionando mesmo com imagens escuras, borradas ou em ângulo, com suporte a placas de mais de 90 países, incluindo o Brasil."},{"n":"PlayPhrase.me","u":"https://br.playphrase.me/","d":"O PlayPhrase.me é uma plataforma de busca e indexação audiovisual que cataloga milhões de frases e diálogos falados em filmes e produções cinematográficas. A ferramenta permite que o usuário pesquise uma frase específica em texto e reproduza instantaneamente os trechos de vídeo exatos onde a expressão é pronunciada, organizando os clipes sequencialmente com legendas sincronizadas e referências aos títulos das obras."},{"n":"Portal BNMP (Banco Nacional de Monitoramento de Prisões)","u":"https://portalbnmp.cnj.jus.br/#/pesquisa-peca","d":"O Banco Nacional de Monitoramento de Prisões (BNMP), mantido pelo Conselho Nacional de Justiça (CNJ), é uma ferramenta que centraliza o registro de mandados de prisão, mandados de internação, alvarás de soltura e guias de recolhimento emitidos pelo Poder Judiciário em todo o território nacional. A interface pública de \"Pesquisa de Peça\" permite consultar ordens de restrição de liberdade ativas e pendentes de cumprimento."},{"n":"Portal da Nota Fiscal Eletrônica (Consulta NF-e)","u":"https://www.nfe.fazenda.gov.br/portal/consultaRecaptcha.aspx","d":"O Portal da Nota Fiscal Eletrônica é o ambiente oficial centralizado do Ministério da Fazenda e da Secretaria Especial da Receita Federal do Brasil projetado para a validação e consulta pública de documentos fiscais eletrônicos. A página específica de consulta permite a inserção da chave de acesso de 44 dígitos de uma NF-e para recuperar a sua respectiva autorização de uso, validade jurídica e dados estruturados."},{"n":"Portal da Transparência (Download de Dados)","u":"https://portaldatransparencia.gov.br/download-de-dados","d":"A seção de Download de Dados do Portal da Transparência é o repositório oficial mantido pela Controladoria-Geral da União (CGU) para a distribuição centralizada e massiva de dados abertos do Governo Federal do Brasil. A plataforma permite o download de arquivos consolidados (geralmente em formato CSV) divididos por temas, anos e meses, abrangendo a execução financeira de despesas e receitas, contratos, convênios, licitações, patrimônio, programas de transferência de renda (como Bolsa Família) e quadros funcionais de servidores públicos civis e militares."},{"n":"Portal da Transparência (Pessoa Física)","u":"https://portaldatransparencia.gov.br/pessoa-fisica/busca/","d":"A seção de Pessoa Física do Portal da Transparência, mantida pela Controladoria-Geral da União (CGU), é o canal oficial unificado do Governo Federal do Brasil para a consulta pública de dados consolidados sobre indivíduos que possuem alguma relação financeira ou funcional com o Estado. A interface permite realizar buscas estruturadas por nome completo, CPF (parcial ou mascarado) ou Número de Identificação Social (NIS)."},{"n":"Portal da Transparência (Pessoa Jurídica)","u":"https://portaldatransparencia.gov.br/pessoa-juridica/","d":"A seção de Pessoa Jurídica do Portal da Transparência, mantida pela Controladoria-Geral da União (CGU), é o canal oficial de busca unificada voltado ao levantamento de dados econômicos, contratuais e correcionais de empresas que possuem ou possuíram interações com a Administração Pública Federal do Brasil. A interface permite pesquisar por CNPJ ou Razão Social para consolidar o histórico comercial e administrativo da entidade frente ao Estado."},{"n":"Portal da Transparência do TCE-SP","u":"https://transparencia.tce.sp.gov.br/","d":"O Portal da Transparência do Tribunal de Contas do Estado de São Paulo (TCE-SP) é a plataforma oficial destinada à fiscalização, controle externo e divulgação de dados orçamentários e financeiros dos órgãos jurisdicionados ao tribunal. O portal reúne dados detalhados sobre as contas públicas estaduais e de 644 municípios paulistas (excluindo a capital), abrangendo contratos, licitações, convênios, repasses a entidades do terceiro setor, além de alertas de irregularidades e painéis específicos como o \"Painel de Distribuição de Recursos\"."},{"n":"Portal de Dados Abertos da ANEEL","u":"https://dadosabertos.aneel.gov.br/dataset/","d":"O Portal de Dados Abertos da ANEEL (Agência Nacional de Energia Elétrica) é uma plataforma oficial que disponibiliza bases de dados estruturadas relativas ao setor elétrico brasileiro. O repositório centraliza informações públicas sobre concessionárias de energia, tarifas de distribuição, capacidade de geração, redes de transmissão, usinas outorgadas e indicadores de qualidade de serviços."},{"n":"Portal de Dados Abertos do Governo Digital (Gov.br)","u":"https://www.gov.br/governodigital/pt-br/dados-abertos","d":"O Portal de Dados Abertos do Governo Digital é o ambiente oficial que coordena e centraliza a Política Nacional de Dados Abertos do Poder Executivo Federal brasileiro. Sob a gestão do Governo Federal, este espaço unifica as diretrizes técnicas, os cronogramas de abertura de bases e os Planos de Dados Abertos (PDA) de ministérios, autarquias e fundações públicas, funcionando como o núcleo estrutural e normativo de transparência do país."},{"n":"Portal de Dados Abertos do TSE","u":"https://dadosabertos.tse.jus.br/dataset/","d":"O Portal de Dados Abertos do TSE (Tribunal Superior Eleitoral) é a plataforma oficial que centraliza e disponibiliza bases de dados estruturadas referentes ao processo eleitoral brasileiro. O repositório armazena informações públicas sobre o perfil do eleitorado, histórico de candidaturas, resultados de votações, registros de filiações partidárias e, de forma minuciosa, a prestação de contas de campanhas e partidos (receitas, despesas, doadores e fornecedores)."},{"n":"Portal e-Proclamas","u":"https://proclamas.org.br/","d":"O e-Proclamas é um sistema centralizado mantido por registradores civis que possibilita a pesquisa pública de editais de proclamas de casamento publicados em diversos Cartórios de Registro Civil das Pessoas Naturais. A plataforma agrupa os avisos oficiais que antecedem as uniões civis, permitindo que qualquer interessado consulte a intenção de casamento de indivíduos."},{"n":"Portal KePlaca","u":"https://www.keplaca.com/","d":"O KePlaca é uma plataforma online desenvolvida para a consulta de informações cadastrais e dados técnicos de veículos registrados no território brasileiro. A partir da inserção da sequência alfanumérica de uma placa (seja no formato tradicional cinza ou no padrão Mercosul), o portal retorna registros consolidados que detalham o fabricante, modelo, ano de fabricação, ano do modelo, cor declarada, além do município e estado de emplacamento do automóvel."},{"n":"PortraitAI","u":"https://portraitai.app/","d":"O PortraitAI é uma ferramenta baseada em nuvem que utiliza redes neurais gerativas (GANs) para transformar fotografias de rostos humanos em retratos pintados de estilo clássico ou artístico. A inteligência artificial analisa as características estruturais e biométricas da face fornecida e reconstrói a imagem aplicando filtros texturizados e estilizações pictóricas automáticas."},{"n":"Posteo","u":"https://posteo.de/","d":"O Posteo é um serviço de e-mail independente com sede na Alemanha, desenvolvido com foco estrito na privacidade, segurança e proteção de dados do usuário. Operando sob o modelo de código aberto, a plataforma destaca-se por não coletar dados pessoais no momento do cadastro e por rejeitar o registro de logs de IP de conexão ou metadados de tráfego. O ecossistema disponibiliza criptografia assimétrica de ponta a ponta, recursos de autodestruição de mensagens e suporte a métodos de pagamento totalmente anônimos."},{"n":"Praat","u":"https://www.fon.hum.uva.nl/praat/","d":"O Praat é um programa de código aberto especializado na análise científica, síntese e manipulação da fala e de sinais sonoros. Desenvolvido por linguistas do Instituto de Fonética da Universidade de Amsterdã, o software permite realizar leituras detalhadas de elementos acústicos como pitch (frequência fundamental), formantes, intensidade, espectrogramas e oscilogramas."},{"n":"Prey Project","u":"https://preyproject.com/","d":"O Prey Project é uma plataforma unificada de gerenciamento de dispositivos móveis (MDM) e segurança de dados voltada para o rastreamento, monitoramento e recuperação de notebooks, tablets e smartphones. O sistema funciona através da instalação de um agente local que se comunica silenciosamente com um painel central baseado na nuvem, permitindo geolocalizar o hardware, emitir alertas, bloquear acessos e extrair informações do ambiente onde o dispositivo se encontra."},{"n":"PrivateMail","u":"https://privatemail.com/","d":"O PrivateMail é um serviço focado em privacidade que oferece e-mail criptografado de ponta a ponta e armazenamento em nuvem seguro. Utilizando criptografia OpenPGP nativa no lado do cliente, a plataforma garante que nem mesmo os provedores de serviços tenham acesso ao conteúdo das mensagens, arquivos ou metadados de comunicação enviados e recebidos."},{"n":"Proton Mail","u":"https://proton.me/mail","d":"O Proton Mail é um serviço de e-mail seguro com sede na Suíça que utiliza criptografia de ponta a ponta e de zero acesso. Ele foi projetado para proteger a privacidade das comunicações, impedindo que terceiros ou o próprio provedor decodifiquem as mensagens enviadas e recebidas."},{"n":"ProtonVPN","u":"https://protonvpn.com/","d":"O ProtonVPN é um serviço de Rede Privada Virtual (VPN) focado em privacidade, desenvolvido pela empresa suíça Proton AG. A ferramenta estabelece um túnel de comunicação totalmente criptografado entre o dispositivo do usuário e seus servidores dedicados, mascarando o endereço IP real do investigador, mitigando vazamentos de DNS e protegendo o tráfego de internet contra interceptações e monitoramento por terceiros."},{"n":"qpdf","u":"https://qpdf.sourceforge.io/","d":"O qpdf é uma ferramenta de linha de comando de código aberto especializada em realizar transformações estruturais e de conteúdo em arquivos PDF. Diferente de leitores ou editores convencionais, o qpdf interage diretamente com a árvore de objetos internos do formato PDF, permitindo descriptografar arquivos (removendo senhas de restrição de edição/impressão), linearizar documentos para visualização rápida na web (web-optimization), mesclar e dividir páginas, além de inspecionar a estrutura interna de fluxos de dados filtrados ou comprimidos."},{"n":"Qual Operadora","u":"https://www.qualoperadora.net/","d":"O Qual Operadora é um serviço online voltado para a identificação da operadora de telefonia atual de qualquer número de telefone (fixo ou móvel) registrado no Brasil. A plataforma consulta bases de dados de telecomunicações para retornar a operadora de origem ou o destino atual do número após processos de portabilidade, além de identificar o estado (UF) e a região geográfica associada ao código de área (DDD)."},{"n":"Qubes OS","u":"https://www.qubes-os.org/","d":"O Qubes OS é um sistema operacional de desktop voltado para a segurança que foca na abordagem de \"segurança por compartimentação\". Utilizando o hipervisor Xen, ele permite que o usuário divida digitalmente o computador em várias máquinas virtuais isoladas chamadas \"Qu技术bes\" (como domínios separados para trabalho, navegação pessoal, redes não confiáveis e cofres de senhas offline), garantindo que o comprometimento de um único ambiente não exponha o restante do sistema."},{"n":"Querido Diário","u":"https://queridodiario.org.br/","d":"O Querido Diário é um projeto de código aberto idealizado pela Open Knowledge Brasil (OKBR) que utiliza inteligência artificial e raspagem de dados para libertar, centralizar e indexar os Diários Oficiais dos municípios brasileiros. A plataforma transforma arquivos PDF fechados e imagens escaneadas em texto estruturado e pesquisável, permitindo que qualquer cidadão ou investigador realize buscas textuais por palavras-chave, nomes, CPFs ou CNPJs em diários oficiais municipais de diversas regiões do país através de uma única interface."},{"n":"Random Name Generator","u":"https://www.random-name-generator.com/","d":"O Random Name Generator é uma ferramenta baseada na web projetada para gerar de forma automatizada e aleatória nomes próprios e sobrenomes baseados em diferentes nacionalidades e características demográficas. A plataforma permite customizar critérios como gênero e país de origem para produzir dados de identificação fictícios realistas."},{"n":"ReceitaWS","u":"https://receitaws.com.br/","d":"O ReceitaWS é uma plataforma comercial que oferece uma API para a consulta automatizada de dados de pessoas jurídicas inscritas no Cadastro Nacional da Pessoa Jurídica (CNPJ) do Brasil. A ferramenta realiza a extração e estruturação das informações públicas diretamente de bases oficiais, fornecendo dados detalhados como a razão social, nome fantasia, atividade econômica (CNAE), quadro de sócios e administradores (QSA), capital social, endereço e situação cadastral."},{"n":"Reclame Aqui","u":"https://www.reclameaqui.com.br","d":"O Reclame Aqui é a maior plataforma brasileira de monitoramento de reputação, reclamações e interações entre consumidores e empresas. O portal permite que usuários registrem insatisfações, denunciem problemas na prestação de serviços ou venda de produtos, e recebam respostas públicas das empresas cadastradas. A plataforma indexa e calcula notas de confiabilidade com base em índices de solução e intenção de novos negócios por parte dos reclamantes."},{"n":"Reclame Aqui (Recuperação de Senha)","u":"https://www.reclameaqui.com.br/esqueci-minha-senha/","d":"A página de recuperação de credenciais do Reclame Aqui é o canal oficial destinado a usuários (consumidores) que esqueceram suas senhas de acesso à plataforma de reclamações e resolução de conflitos de consumo. O sistema permite a inserção de um identificador para localizar o cadastro e iniciar o fluxo de redefinição de acesso."},{"n":"Recuperação de Senha - Casas Bahia","u":"https://cliente.casasbahia.com.br/recuperacao/esqueci-senha","d":"A página de recuperação de senha do portal do cliente das Casas Bahia é uma interface pública desenvolvida para permitir que usuários legítimos restabeleçam o acesso às suas contas informando identificadores civis, especificamente o CPF."},{"n":"Recuperação de Senha - Claro","u":"https://cadastro.claro.com.br/recuperar-senha","d":"A página de recuperação de senha do portal de cadastro da operadora Claro é uma interface pública desenvolvida para permitir que clientes legítimos restabeleçam o acesso às suas contas de serviços residenciais ou móveis por meio da inserção de identificadores civis, especificamente o CPF."},{"n":"Recuperação de Senha - Extra Hipermercados","u":"https://cliente.extra.com.br/recuperacao/esqueci-senha","d":"A página de recuperação de senha do portal do cliente do Extra é uma interface pública desenvolvida para permitir que usuários legítimos restabeleçam o acesso às suas contas informando identificadores civis, especificamente o CPF."},{"n":"Recuperação de Senha - Magazine Luiza","u":"https://sacola.magazineluiza.com.br/n#/recuperar-senha","d":"A página de recuperação de senha do portal de compras da Magazine Luiza é uma interface pública desenvolvida para permitir que usuários legítimos restabeleçam o acesso às suas contas informando identificadores civis, especificamente o CPF."},{"n":"Rede CNPJ","u":"https://www.redecnpj.com/r/","d":"O Rede CNPJ é uma plataforma online focada na consulta, cruzamento e mapeamento de dados cadastrais de pessoas jurídicas registradas no Brasil. A ferramenta compila informações provenientes da base pública da Receita Federal e de outras fontes abertas, exibindo estruturas corporativas e ramificações societárias de forma estruturada."},{"n":"REDESIM (Rede Nacional para a Simplificação do Registro e da Legalização de Empresas e Negócios)","u":"https://www.gov.br/empresas-e-negocios/pt-br/redesim","d":"A REDESIM é um sistema integrado que unifica os processos de abertura, alteração, licenciamento e fechamento de empresas no Brasil. O portal conecta os sistemas das Juntas Comerciais, Receita Federal, Secretarias de Fazenda estaduais, Prefeituras e órgãos licenciadores (como Corpo de Bombeiros e Vigilância Sanitária)."},{"n":"Regex101","u":"https://regex101.com/","d":"O Regex101 é uma ferramenta interativa online projetada para construir, testar e depurar expressões regulares. A plataforma suporta múltiplos sabores de RegEx (como PCRE, JavaScript, Python, Golang e Java), oferecendo uma interface em tempo real que destaca correspondências em blocos de texto e detalha o funcionamento de cada token utilizado na expressão."},{"n":"Registradores - ONR (Operador Nacional do Registro Eletrônico de Imóveis)","u":"https://ridigital.org.br/","d":"O portal Registradores é a plataforma do Serviço de Atendimento Eletrônico Compartilhado (SAEC), mantida pelo ONR sob regulação do Conselho Nacional de Justiça (CNJ). Ele unifica o acesso digital aos Cartórios de Registro de Imóveis de diversos estados brasileiros, permitindo solicitar certidões, pesquisar a existência de bens e visualizar matrículas imobiliárias."},{"n":"Registrato (Banco Central do Brasil)","u":"https://www.bcb.gov.br/meubc/registrato","d":"O Registrato é um sistema administrado pelo Banco Central do Brasil (BCB) que permite aos cidadãos e empresas acessarem, de forma centralizada, relatórios detalhados sobre suas movimentações financeiras. O sistema consolida dados enviados por todas as instituições financeiras do país, gerando extratos de contas bancárias ativas, chaves PIX cadastradas, empréstimos, financiamentos (SCR) e operações de câmbio."},{"n":"Registro Aeronáutico Brasileiro (RAB) - Dados Abertos ANAC","u":"https://www.gov.br/anac/pt-br/acesso-a-informacao/dados-abertos/areas-de-atuacao/aeronaves-1/registro-aeronautico-brasileiro","d":"A página de Dados Abertos do Registro Aeronáutico Brasileiro (RAB), disponibilizada pela Agência Nacional de Aviação Civil (ANAC), é um repositório institucional que centraliza e distribui bases de dados completas e atualizadas sobre todas as aeronaves civis registradas no Brasil. O portal permite o acesso a microdados estruturados contendo informações cadastrais, fabricantes, modelos, ano de fabricação, tipo de uso, marcas de matrícula (prefixos), operadores, proprietários e status de aeronavegabilidade."},{"n":"Registro de Voos - Força Aérea Brasileira (FAB)","u":"https://www.fab.mil.br/voos","d":"O portal de Voos da Força Aérea Brasileira é o canal oficial de transparência ativa destinado à publicação de registros de missões de transporte aéreo doméstico e internacional. A plataforma disponibiliza dados sobre os voos realizados por autoridades públicas (Ministros de Estado, Presidentes de Poderes e demais servidores previstos em decreto) e informações institucionais referentes ao Correio Aéreo Nacional (CAN)."},{"n":"Registro.br - Ferramenta WHOIS","u":"https://registro.br/tecnologia/ferramentas/whois/","d":"O WHOIS do Registro.br é o serviço oficial de consulta mantido pelo Núcleo de Informação e Coordenação do Ponto BR (NIC.br). A ferramenta permite pesquisar a disponibilidade e obter informações cadastrais detalhadas de qualquer nome de domínio registrado sob a extensão nacional `.br`."},{"n":"REGULARIZE (Procuradoria-Geral da Fazenda Nacional - PGFN)","u":"https://www.regularize.pgfn.gov.br/","d":"O REGULARIZE é o portal digital de serviços da Procuradoria-Geral da Fazenda Nacional (PGFN). A plataforma é voltada para que contribuintes (pessoas físicas ou jurídicas) consultem, negociem (por meio de transações resolutivas), parcelem e emitam guias de pagamento para débitos tributários e não tributários que foram inscritos em Dívida Ativa da União ou do FGTS."},{"n":"Remaker AI","u":"https://remaker.ai/","d":"O Remaker AI é uma plataforma online baseada em inteligência artificial generativa que oferece ferramentas de edição de imagem, criação de arte digital e, principalmente, a funcionalidade de *face swap* (troca de rostos em fotos e vídeos) e geração de mídias sintéticas."},{"n":"Remove.bg","u":"https://www.remove.bg/pt-br/","d":"O Remove.bg é um serviço automatizado baseado em nuvem que utiliza modelos de inteligência artificial para identificar o elemento principal em uma fotografia (como pessoas, produtos ou objetos) e isolá-lo, removendo completamente o plano de fundo em poucos segundos."},{"n":"ReplayWeb.page","u":"https://replayweb.page","d":"O ReplayWeb.page é uma ferramenta desenvolvida pelo projeto Webrecorder que permite a reprodução e navegação em arquivos de preservação digital da web, como os formatos padrão WARC (*Web ARChive*) e WACZ (*Web Archive Zipped*). A plataforma reconstrói o comportamento original das páginas capturadas, executando scripts e renderizando elementos dinâmicos diretamente no navegador."},{"n":"Reverse WHOIS - WhoisXMLAPI","u":"https://reverse-whois.whoisxmlapi.com","d":"O Reverse WHOIS da WhoisXMLAPI é uma ferramenta avançada de inteligência cibernética que permite aos investigadores realizar buscas reversas em bancos de dados WHOIS globais. Em vez de pesquisar um domínio para encontrar seu proprietário, a ferramenta permite inserir termos específicos (como o nome de uma pessoa, uma empresa, uma palavra-chave ou um endereço de e-mail) para descobrir todos os nomes de domínio conectados a esse critério."},{"n":"RocketReach","u":"https://rocketreach.co","d":"O RocketReach é uma plataforma de inteligência de contatos comerciais que indexa perfis profissionais de milhões de empresas globalmente. A ferramenta correlaciona dados públicos, perfis de redes sociais (como o LinkedIn) e registros corporativos para encontrar e validar e-mails estruturados (pessoais e de trabalho) e números de telefone de profissionais em diversos níveis hierárquicos."},{"n":"Same Energy","u":"https://same.energy/","d":"O Same Energy é um motor de busca visual minimalista alimentado por aprendizado profundo (*deep learning*) e visão computacional. Diferente dos mecanismos de busca reversa tradicionais que buscam apenas cópias exatas ou correspondências diretas por metadados e texto, a ferramenta indexa imagens analisando estilo artístico, clima (*mood*), paleta cromática, iluminação, composição espacial e padrões semânticos, permitindo navegar infinitamente por correlações visuais similares."},{"n":"ScamSearch.io","u":"https://scamsearch.io","d":"O ScamSearch.io é um indexador e motor de busca focado na consolidação de relatórios de fraudes, golpes e atividades maliciosas reportadas globalmente. A plataforma rastreia e centraliza informações coletadas de centenas de bancos de dados públicos, listas de denúncias e fóruns de segurança, permitindo consultas unificadas por e-mails, usernames, números de telefone, nomes completos ou endereços de carteiras de criptoativos."},{"n":"Senha Web (Recuperação de Senha) - Prefeitura de São Paulo","u":"https://senhaweb.prefeitura.sp.gov.br/FormsPwdRecovery/PasswordRecovery.aspx","d":"A página de recuperação de senha do sistema \"Senha Web\" da Prefeitura de São Paulo é um serviço digital voltado a cidadãos e empresas estabelecidas no município. O sistema gerencia o acesso a serviços tributários e administrativos municipais (como emissão de Notas Fiscais Paulistanas e consulta de IPTU)."},{"n":"Seção de Acesso à Informação - ICMBio","u":"https://www.gov.br/icmbio/pt-br/acesso-a-informacao","d":"A página de Acesso à Informação do ICMBio (Instituto Chico Mendes de Conservação da Biodiversidade) é o canal oficial de transparência ativa da autarquia socioambiental do governo federal brasileiro. O portal centraliza e disponibiliza dados públicos estruturados referentes a auditorias, licitações, convênios, repasses financeiros, despesas, servidores, além de relatórios de fiscalização ambiental, autos de infração e registros de áreas embargadas."},{"n":"Shadowmap","u":"https://shadowmap.org/","d":"O Shadowmap é uma plataforma interativa de inteligência geoespacial baseada em dados cartográficos tridimensionais, dados de relevo e modelos solares cronológicos. A ferramenta calcula a posição exata do sol em qualquer coordenada global, renderizando dinamicamente as sombras geradas por prédios (incluindo edifícios 3D do Google e dados do OpenStreetMap), montanhas e vegetações em qualquer data e horário do ano."},{"n":"Sherlockeye","u":"https://sherlockeye.io/","d":"O Sherlockeye é uma plataforma avançada e integrada de OSINT alimentada por inteligência artificial, projetada para automatizar fluxos de investigação digital e unificar coletas de dados. A ferramenta conecta e cruza informações em tempo real provenientes de mais de 800 fontes abertas globais e nacionais, oferecendo recursos de pesquisa reversa a partir de um único ponto de entrada."},{"n":"Shodan","u":"https://shodan.io","d":"O Shodan é um motor de busca especializado que varre continuamente a internet global para indexar servidores, roteadores, câmeras de segurança, sistemas de controle industrial (SCADA) e qualquer outro dispositivo diretamente conectado à rede. Ao contrário dos motores de busca tradicionais que indexam o conteúdo de páginas web, o Shodan coleta e categoriza os metadados gerados pelas respostas dos protocolos de rede (banners de serviço)."},{"n":"SICAFI - Módulo Externo (IBAMA)","u":"https://servicos.ibama.gov.br/sicafiext/","d":"O SICAFI (Sistema de Cadastro, Arrecadação e Fiscalização) é a plataforma oficial do Instituto Brasileiro do Meio Ambiente e dos Recursos Naturais Renováveis (IBAMA) destinada ao gerenciamento de débitos, taxas e sanções pecuniárias aplicadas por infrações ambientais. O módulo externo permite a consulta pública de regularidade e a validação de certidões."},{"n":"SIGEF - Consulta de Parcelas (INCRA)","u":"https://sigef.incra.gov.br/consultar/parcelas/","d":"O SIGEF (Sistema de Gestão Fundiária) é a plataforma oficial desenvolvida pelo Instituto Nacional de Colonização e Reforma Agrária (INCRA) para subsidiar a governança fundiária do território nacional. O módulo de consulta de parcelas permite o acesso público e transparente a dados técnicos de imóveis rurais que foram georreferenciados e certificados nos termos da Lei nº 10.267/2001."},{"n":"SINESP Cidadão (App Store)","u":"https://apps.apple.com/br/app/sinesp-cidad%C3%A3o/id768157962","d":"O SINESP Cidadão é um aplicativo oficial do Sistema Nacional de Informações de Segurança Pública, desenvolvido pelo Ministério da Justiça e Segurança Pública (MJSP) do Brasil. Ele permite o acesso direto de cidadãos a bases de dados criminais e de trânsito nacionais para checagem de restrições e mandados."},{"n":"Sistema de Consulta de Dados Públicos (CDP) - ANP","u":"https://cdp.anp.gov.br/ords/r/cdp_apex/consulta-dados-publicos-cdp/home","d":"O Sistema de Consulta de Dados Públicos (CDP) da ANP (Agência Nacional do Petróleo, Gás Natural e Biocombustíveis) é a plataforma oficial integrada que fornece o histórico cadastral e a situação operacional de todos os agentes que atuam na indústria de combustíveis e energia no Brasil. O portal centraliza consultas relativas a postos revendedores, revendas de GLP, distribuidoras, operadores de oleodutos e gasodutos, produtores de etanol ou biodiesel, além de dados técnicos sobre blocos exploratórios sob concessão e declarações de comercialidade."},{"n":"Sistema de Consultas - ANVISA","u":"https://consultas.anvisa.gov.br/#/","d":"O Sistema de Consultas da ANVISA (Agência Nacional de Vigilância Sanitária) é o portal oficial que centraliza a pesquisa de atos regulatórios, registros, certificações e autorizações emitidos pela agência. A plataforma permite consultar em tempo real a regularidade de medicamentos, alimentos, cosméticos, saneantes e produtos para a saúde (correlatos), além de fornecer dados técnicos sobre a Autorização de Funcionamento de Empresas (AFE) e Autorização Especial (AE)."},{"n":"Sistema de Valores a Receber - SVR (Banco Central do Brasil)","u":"https://valoresareceber.bcb.gov.br/publico","d":"O Sistema de Valores a Receber (SVR) é um serviço oficial mantido pelo Banco Central do Brasil que permite a cidadãos e empresas consultarem se possuem dinheiro esquecido em bancos, consórcios, cooperativas ou outras instituições financeiras reguladas."},{"n":"Situação Cadastral","u":"https://www.situacao-cadastral.com/","d":"O site Situacao-Cadastral.com é uma ferramenta de utilidade pública voltada para a consulta rápida do status de inscrição de pessoas físicas (CPF) e jurídicas (CNPJ) perante a Receita Federal do Brasil. A plataforma espelha e simplifica o acesso a dados cadastrais públicos de forma direta."},{"n":"Skymem","u":"https://www.skymem.info/","d":"O Skymem é um motor de busca e plataforma de raspagem de dados em fontes abertas focado na localização e validação de endereços de e-mail. A ferramenta varre continuamente a internet, perfis de redes sociais e conteúdos digitais públicos para estruturar um banco de dados massivo (com centenas de milhões de registros) vinculando e-mails a indivíduos, corporações e nomes de domínio."},{"n":"SMS24.me","u":"https://sms24.me/","d":"O SMS24.me é um serviço online que disponibiliza números de telefone públicos e temporários de diversos países. A plataforma permite receber mensagens de texto (SMS) diretamente pela interface web, sendo amplamente utilizada para contornar etapas de verificação de número de telefone em cadastros digitais e ativações de serviços na internet."},{"n":"SMSPVA","u":"https://smspva.com/","d":"O SMSPVA é uma plataforma comercial que fornece números de telefone temporários de múltiplos países para o recebimento de mensagens de texto (SMS). O serviço é estruturado para contornar processos de verificação automatizada (PVA - *Phone Verification SMS*) em plataformas da internet, redes sociais, aplicativos de mensageria e serviços financeiros."},{"n":"SNCR - Sistema Nacional de Cadastro Rural (Consulta Pública)","u":"https://sncr.serpro.gov.br/sncr-web/consultaPublica.jsf","d":"A Consulta Pública do Sistema Nacional de Cadastro Rural (SNCR), desenvolvida pelo Serpro para o INCRA (Instituto Nacional de Colonização e Reforma Agrária), é uma interface oficial que permite a validação e consulta de dados cadastrais de imóveis rurais no território brasileiro. A plataforma possibilita a verificação da autenticidade do Certificado de Cadastro de Imóvel Rural (CCIR), documento indispensável para desmembrar, arrendar, hipotecar ou transferir propriedades rurais."},{"n":"Social Analyzer","u":"https://github.com/qeeqbox/social-analyzer","d":"O Social Analyzer é uma ferramenta de código aberto voltada para a inteligência em fontes abertas (OSINT) e análise de mídias sociais (SOCMINT). O software automatiza o rastreamento, a verificação e a extração de dados públicos em centenas de redes sociais e sites, buscando correspondências para nomes de usuário (*usernames*), nomes civis e identificadores com base em heurísticas avançadas de detecção, metadados de páginas e APIs."},{"n":"Social Searcher","u":"https://www.social-searcher.com/","d":"O Social Searcher é um motor de busca especializado em redes sociais (SOCMINT) que permite rastrear menções públicas a termos, nomes, marcas ou hashtags em tempo real. A plataforma varre uma ampla variedade de fontes públicas, incluindo redes como X (Twitter), Google+, Youtube, Instagram, Tumblr, Reddit, Flickr e notícias da web, consolidando os resultados em um painel unificado com análises de sentimento, tendências de postagem e usuários mais ativos."},{"n":"Social Searcher - Google Social Search","u":"https://www.social-searcher.com/google-social-search/","d":"O Social Searcher (especificamente em sua vertente \"Google Social Search\") é um mecanismo de busca e monitoramento projetado para vasculhar menções públicas em diversas redes sociais de forma simultânea. A ferramenta rastreia, indexa e agrupa publicações, conteúdos de mídia, hashtags e atividades de usuários em plataformas de grande relevância (como X/Twitter, Facebook, YouTube, Instagram, Reddit, Tumblr, entre outras), exibindo os dados consolidados em um painel analítico unificado."},{"n":"Sogou Pic (Sogou Images)","u":"https://pic.sogou.com/","d":"O Sogou Pic é o serviço especializado de busca de imagens e reconhecimento visual do Sogou, um dos principais motores de busca da China. A plataforma oferece capacidades avançadas de busca reversa por upload de arquivo ou URL, utilizando algoritmos de visão computacional otimizados para rastrear correspondências visuais, padrões faciais, fotografias similares e produtos em páginas indexadas da internet global e, especialmente, na web asiática."},{"n":"Sonic Visualiser","u":"https://www.sonicvisualiser.org/","d":"O Sonic Visualiser é uma aplicação de código aberto voltada para a visualização, análise e anotação detalhada de dados contidos em arquivos de áudio. Desenvolvido no Centre for Digital Music da Queen Mary University of London, o software permite examinar gravações de forma profunda através de espectrogramas, formas de onda, análise de frequências e elementos estruturais do som, suportando uma ampla gama de plugins (como os formatos VAMP) para automação de tarefas acústicas."},{"n":"Sputnik","u":"https://chromewebstore.google.com/detail/sputnk/manapjdamopgbpimgojkccikaabhmocd","d":"O Sputnik é uma extensão de navegador desenvolvida para otimizar e acelerar o processo de triagem de indicadores técnicos (artefatos digitais). A ferramenta permite que o analista selecione um texto ou clique com o botão direito sobre links, sublinhados, imagens ou mídias e escolha, diretamente em um menu de contexto expandido, entre diversas plataformas de OSINT parceiras e gratuitas para realizar consultas instantâneas sobre endereços IP, nomes de domínio, hashes de arquivos e URLs suspeitas."},{"n":"Sr. Watson","u":"https://srwatson.io/","d":"O Sr. Watson é uma plataforma web voltada para a inteligência e investigação corporativa no ecossistema de dados brasileiro. A ferramenta indexa e correlaciona dezenas de milhões de registros públicos da Receita Federal e outros órgãos oficiais, permitindo pesquisar empresas por CNPJ, Razão Social, sócios (CPF), e-mails e telefones de contato. O diferencial da aplicação reside na estruturação de dados em formato de grafo interativo (mapa de vínculos), possibilitando a identificação visual de quadros societários (QSA), filiais, empresas coligadas, laranjas, grupos econômicos ocultos e endereços compartilhados."},{"n":"Startpage","u":"https://www.startpage.com/","d":"O Startpage é um mecanismo de busca web privativo que atua como intermediário entre o usuário e o índice de pesquisa do Google. A plataforma consulta os servidores do Google de forma anônima e entrega os resultados ao usuário sem registrar endereços IP, sem armazenar consultas em logs de servidores, sem utilizar cookies de perfilamento e sem construir históricos comportamentais para anúncios direcionados. Além disso, disponibiliza a função \"Visualização Anônima\" (*Anonymous View*), que permite carregar páginas da lista de resultados por meio de um servidor proxy integrado."},{"n":"Stolen Camera Finder","u":"https://stolencamerafinder.com/","d":"O Stolen Camera Finder é uma plataforma web especializada em rastrear a presença digital de câmeras fotográficas por meio do número de série único embutido nos metadados EXIF das imagens. Ao fazer o upload de uma foto ou inserir o identificador manualmente, o sistema realiza o cruzamento com um banco de dados próprio, alimentado por indexadores que varrem a internet pública à procura de fotografias que compartilhem o mesmo registro de hardware."},{"n":"Subzin","u":"https://www.subzin.com/","d":"O Subzin é uma plataforma online de indexação e busca textual baseada em legendas e transcrições de obras cinematográficas e episódios de séries de televisão. O serviço mapeia milhões de linhas de diálogo, permitindo ao usuário pesquisar citações ou frases específicas para identificar o título exato da produção, a temporada/episódio e o instante temporal (*timestamp*) em que a fala ocorre."},{"n":"SunCalc","u":"https://www.suncalc.org/","d":"O SunCalc é uma aplicação web que permite calcular a posição do sol, o ângulo solar, a direção da luz e o comprimento das sombras em qualquer coordenada geográfica e momento temporal específico do dia e do ano."},{"n":"SunEarthTools","u":"https://www.sunearthtools.com/","d":"O SunEarthTools é um portal multifuncional que fornece uma ampla gama de ferramentas e calculadoras científicas voltadas para o estudo da física solar e posicionamento astronômico em relação à Terra. Ele permite determinar com alta precisão matemática as coordenadas do Sol, o ângulo de incidência dos raios solares, o azimute, a elevação e a projeção exata de sombras em qualquer localização geográfica com base em datas e horários específicos."},{"n":"SUPERAntiSpyware","u":"https://www.superantispyware.com","d":"O SUPERAntiSpyware é um software de segurança voltado para sistemas operacionais de desktop projetado para detectar, isolar e remover uma ampla gama de ameaças cibernéticas locais, tais como spywares, adwares, malwares, cavalos de troia, rootkits e keyloggers. Ele atua fazendo varreduras profundas no sistema de arquivos e na memória do computador para mitigar infecções."},{"n":"Swisscows","u":"https://swisscows.com/pt","d":"O Swisscows é um motor de busca na web com sede e infraestrutura de servidores localizadas na Suíça, projetado com foco estrito em privacidade e proteção de dados. A ferramenta opera com indexação própria combinada a índices parceiros sem armazenar endereços IP, sem registrar o histórico de pesquisas, sem criar perfis comportamentais e sem utilizar cookies de rastreamento comercial. Além disso, disponibiliza mapas conceituais e sugestões de termos interligados por relevância semântica."},{"n":"SynScan Breaches (Verified Search)","u":"https://synscan.net/breaches","d":"O SynScan Breaches é um módulo especializado da plataforma SynScan voltado para a inteligência de vazamentos (*Breach Intelligence*). A ferramenta indexa e disponibiliza dados provenientes de incidentes de segurança, vazamentos de bases de dados (*data leaks*) e repositórios expostos, permitindo buscas estruturadas por múltiplos campos em texto claro mediante a comprovação de propriedade ou escopo de análise."},{"n":"SynthID","u":"https://deepmind.google/models/synthid/","d":"O SynthID é uma tecnologia desenvolvida pela Google DeepMind voltada para a aplicação e detecção de marcas d'água digitais imperceptíveis em mídias geradas por inteligência artificial. A ferramenta atua de forma nativa nas estruturas internas dos arquivos — modificando de maneira sutil a distribuição de pixels de imagens, os quadros de vídeos, os espectrogramas de áudio e as probabilidades de amostragem de tokens em cadeias de texto —, permitindo que a assinatura de procedência resista a transformações comuns, como compressão de dados, edições, cortes e aplicação de filtros, sem degradar a qualidade perceptível do conteúdo original."},{"n":"Tails (The Amnesic Incognito Live System)","u":"https://tails.net/","d":"O Tails é um sistema operacional portátil baseado em Debian Linux projetado especificamente para preservar a privacidade e o anonimato dos usuários. Ele é executado em modo \"Live\" diretamente a partir de uma mídia externa (como um pendrive ou DVD), operando inteiramente na memória RAM do computador sem deixar rastros ou modificar o sistema operacional instalado no disco rígido da máquina hospedeira. Por padrão, o sistema força todo o tráfego de internet de saída a passar obrigatoriamente pela rede Tor e apaga todos os dados residuais assim que é encerrado."},{"n":"Tela de Recuperação de Senha - Vivo (Meu Vivo)","u":"https://mvfront.vivo.com.br/password-recovery#/welcome-vivo/recover-password","d":"A página de recuperação de senha do portal Meu Vivo é o endpoint oficial da operadora de telecomunicações Vivo destinado a permitir que usuários restabeleçam o acesso às suas contas informando dados cadastrais, como CPF, e-mail ou número de telefone celular."},{"n":"Teletudo Busqueitor","u":"https://teletudo.com/busqueitor","d":"O Teletudo Busqueitor é uma ferramenta web que funciona como um catálogo telefônico digital integrado para o território brasileiro. A plataforma indexa e estrutura registros de assinantes de telefonia fixa e comercial, permitindo a realização de buscas diretas e cruzadas por meio de nomes de indivíduos, termos comerciais, logradouros (endereços) ou números de telefone específicos."},{"n":"Tempail","u":"https://tempail.com/pt/","d":"O Tempail é uma plataforma online que fornece endereços de e-mail temporários, descartáveis e anônimos que expiram após um determinado período. O serviço permite receber mensagens e anexos em tempo real diretamente por meio de sua interface web, eliminando a necessidade de fornecer o e-mail real do investigador em sites de terceiros."},{"n":"ThatsThem","u":"https://thatsthem.com/","d":"O ThatsThem é um mecanismo de busca de pessoas (*people search engine*) e agregador de registros públicos focado em dados de residentes nos Estados Unidos. A plataforma indexa e correlaciona bilhões de registros públicos, cadastros comerciais e bases de dados abertas, permitindo consultas cruzadas e buscas reversas por nome completo, endereço residencial, número de telefone, endereço de e-mail, número de identificação veicular (VIN) e endereço IP."},{"n":"The Aviation Herald (AvHerald)","u":"https://avherald.com/","d":"O The Aviation Herald (AvHerald) é um portal especializado que rastreia, documenta e publica relatórios detalhados sobre incidentes, acidentes e anomalias operacionais ocorridas na aviação comercial global em tempo real. A plataforma consolida dados técnicos provenientes de relatórios oficiais de órgãos reguladores de aviação civil, relatórios de tripulações, dados de telemetria e comunicados de companhias aéreas."},{"n":"The Grugq - OPSEC Blog","u":"https://grugq.github.io/blog/categories/opsec/","d":"A seção de OPSEC do blog do renomado especialista em segurança \"The Grugq\" funciona como um repositório técnico e conceitual sobre Segurança das Operações. O site centraliza ensaios, lições aprendidas de casos reais e frameworks táticos detalhando como agentes, investigadores e analistas devem se comportar no ambiente digital e físico para mitigar riscos de rastreamento, atribuição e vazamento de dados corporativos ou governamentais."},{"n":"This Person Does Not Exist","u":"https://this-person-does-not-exist.com","d":"O This Person Does Not Exist é um serviço online baseado em algoritmos de Inteligência Artificial e Redes Adversariais Generativas (GAN). A plataforma gera, de forma automatizada e a cada atualização de página, um retrato fotográfico hiper-realista de um rosto humano que não pertence a nenhuma pessoa real."},{"n":"ThreatFox","u":"https://threatfox.abuse.ch/","d":"O ThreatFox é uma plataforma centralizada e de acesso público desenvolvida pelo projeto abuse.ch, com foco no mapeamento, compartilhamento e catalogação de Indicadores de Comprometimento (IoCs) associados a campanhas ativas de malwares. A ferramenta armazena assinaturas digitais estruturadas, abrangendo endereços IP de servidores de Comando e Controle (C2), nomes de domínios maliciosos, URLs de entrega de payloads e hashes de arquivos maliciosos."},{"n":"TinEye Reverse Image Search","u":"https://www.tineye.com/","d":"O TinEye é um dos pioneiros motores de busca reversa de imagens na web, utilizando tecnologia proprietária de reconhecimento de padrões e assinaturas digitais visuais (*image fingerprinting*). A plataforma permite que usuários façam o upload de um arquivo ou forneçam uma URL para encontrar correspondências exatas, versões recortadas, redimensionadas, editadas ou com sobreposições gráficas em bilhões de páginas indexadas."},{"n":"TLG.pm Search","u":"https://tlg.pm/search","d":"O TLG.pm Search é um motor de busca de terceiros projetado especificamente para indexar e rastrear o ecossistema público do Telegram. A ferramenta varre repositórios abertos e metadados de chats para permitir que usuários e investigadores localizem canais, grupos de discussão, bots automatizados e postagens de texto específicas por meio do uso de palavras-chave."},{"n":"TorMap","u":"https://tormap.org/","d":"O TorMap é uma aplicação web interativa projetada para mapear, plotar e correlacionar a localização geográfica de todos os servidores, nós de entrada, relés intermediários e nós de saída (*Exit Nodes*) ativos que compõem a rede de anonimato Tor. A plataforma consome dados em tempo real da infraestrutura oficial do Tor Project e os renderiza sobre uma camada cartográfica digital, permitindo a inspeção de metadados técnicos de cada servidor distribuído globalmente."},{"n":"TorWhois","u":"https://torwhois.com/","d":"O TorWhois é uma plataforma online projetada para atuar como um mecanismo de busca e índice histórico de registros de domínios pertencentes à rede de anonimato Tor (com sufixo `.onion`). Diferente da internet superficial (Clear Web), a rede Tor não possui um sistema unificado e público de registro WHOIS nativo. O TorWhois busca preencher essa lacuna coletando, catalogando e preservando metadados estruturais, títulos de páginas, cabeçalhos técnicos e referências históricas de sites da Dark Web."},{"n":"Truecaller","u":"https://www.truecaller.com/pt-br","d":"O Truecaller é uma plataforma global de inteligência telefônica que funciona alimentada por um banco de dados de listas de contatos compartilhadas de forma colaborativa por milhões de usuários. O serviço mapeia, padroniza e armazena registros telefônicos vinculados a nomes reais, empresas, e-mails e categorias de risco (como spam ou golpes)."},{"n":"Tuta (anteriormente Tutanota)","u":"https://tuta.com/","d":"O Tuta é um serviço global de webmail focado em estrita privacidade e segurança, sediado na Alemanha. A plataforma implementa criptografia de ponta a ponta (AES e RSA) nativa para proteger mensagens, calendários e contatos. O serviço não rastreia IPs de conexão, remove metadados dos cabeçalhos dos e-mails enviados e possui código-fonte aberto, permitindo auditorias independentes de sua infraestrutura."},{"n":"UK-OSINT - Creating Fake IDs & Personas","u":"https://www.uk-osint.net/creatingids.html","d":"A página \"Creating Fake IDs & Personas\" do portal UK-OSINT é um repositório especializado que reúne links, ferramentas e guias voltados para auxiliar investigadores na criação de contas de cobertura (*sock puppets*) e identidades sintéticas na internet de maneira estruturada. O site compila recursos que vão desde geradores de nomes falsos e dados civis fictícios até plataformas de recepção de SMS temporários e geradores de rostos por Inteligência Artificial."},{"n":"Undetectable AI","u":"https://undetectable.ai/","d":"O Undetectable AI é uma plataforma voltada para o processamento de texto que atua em duas frentes principais: a identificação de trechos escritos por modelos de linguagem generativa (como GPT, Claude e Gemini) através de múltiplos validadores simultâneos, e a reescrita automatizada de conteúdos (humanização) para modificar a estrutura sintática e o padrão de escolhas lexicais, visando contornar algoritmos de detecção automatizada de conteúdo sintético."},{"n":"Unstoppable Domains","u":"https://unstoppabledomains.com/pt-br","d":"O Unstoppable Domains é uma plataforma comercial especializada no registro e gerenciamento de domínios descentralizados baseados em tecnologia blockchain (como as extensões `.crypto`, `.nft`, `.x`, `.wallet`, entre outras). Esses domínios substituem endereços complexos de carteiras de criptoativos por sequências textuais legíveis e servem como sistemas de identidade soberana para aplicações e serviços da Web3."},{"n":"URLhaus","u":"https://urlhaus.abuse.ch","d":"O URLhaus é um projeto colaborativo operado pelo abuse.ch que coleta, armazena e compartilha ativamente URLs associadas à distribuição de malwares. A plataforma serve como uma central de dados de inteligência de ameaças (Threat Intelligence), fornecendo feeds de segurança estruturados e permitindo pesquisas manuais ou automatizadas sobre links suspeitos reportados pela comunidade de segurança."},{"n":"URLScan.io","u":"https://urlscan.io/","d":"O URLScan.io é um serviço web gratuito e comercial projetado para analisar e escanear sites de forma pública ou privada. Ao submeter uma URL, a plataforma simula o comportamento de um usuário comum navegando pela página e registra todas as requisições HTTP, conexões de rede, scripts JavaScript executados, cookies criados, além de capturar um screenshot da interface final apresentada ao visitante."},{"n":"VeraCrypt","u":"https://veracrypt.io/","d":"O VeraCrypt é um software utilitário de código aberto utilizado para criptografia de dados em tempo real (OTFE). Ele permite a criação de discos virtuais criptografados dentro de um arquivo (contêineres), a criptografia completa de partições de armazenamento locais (como pendrives e discos rígidos externos) ou a cifragem total do sistema operacional onde está instalado."},{"n":"VerExif","u":"https://www.verexif.com/","d":"O VerExif é uma plataforma online projetada para processar arquivos de imagem, permitindo a visualização detalhada de metadados ocultos contidos no padrão EXIF (Exchangeable Image File Format). O serviço possibilita que o usuário faça o upload de uma fotografia ou indique uma URL externa para inspecionar parâmetros técnicos de captura, além de oferecer uma função direta para remover todas as propriedades identificáveis do arquivo original."},{"n":"Verifact","u":"https://www.verifact.com.br/","d":"A Verifact é uma plataforma online brasileira especializada na coleta e preservação de provas digitais contidas na internet. O serviço permite o registro de conteúdos extraídos de sites, redes sociais, aplicativos de mensageria e e-mails, gerando um relatório técnico auditável acompanhado de metadados detalhados, vídeos do processo de captura e chaves criptográficas (hashes) que atestam a imutabilidade e a anterioridade dos dados coletados."},{"n":"VesselFinder","u":"https://www.vesselfinder.com/","d":"O VesselFinder é uma plataforma de monitoramento que fornece dados em tempo real sobre as posições, movimentos e rotas de navios ao redor do mundo. Utilizando uma ampla rede de receptores do Sistema de Identificação Automática (AIS) terrestres e de satélites, o serviço compila dados técnicos detalhados sobre frotas marítimas, históricos de porto e trajetórias comerciais."},{"n":"VideoLAN (VLC Media Player)","u":"https://www.videolan.org/","d":"A VideoLAN é uma organização sem fins lucrativos responsável pelo desenvolvimento de softwares multimídia de código aberto, com destaque para o VLC Media Player. O VLC é um reprodutor de mídias portátil e multiplataforma que possui decodificadores internos nativos, sendo capaz de reproduzir virtualmente qualquer formato de arquivo de áudio ou vídeo, codecs complexos, transmissões de streaming e discos físicos sem a necessidade de pacotes externos de terceiros."},{"n":"ViewDNS.info","u":"https://viewdns.info/","d":"O ViewDNS.info é um portal web que centraliza uma vasta coleção de utilitários de conferência e mapeamento de rede. A plataforma permite realizar investigações reversas e diretas sobre componentes da arquitetura da internet, oferecendo consultas que cruzam históricos de IPs, servidores de nomes (Name Servers), registros de e-mail (MX), localizações geográficas de servidores e a presença de múltiplos sites compartilhando uma mesma infraestrutura."},{"n":"VirtualBox","u":"https://www.virtualbox.org/","d":"O Oracle VM VirtualBox é um software de virtualização multiplataforma de código aberto que permite a execução de múltiplos sistemas operacionais (como distribuições Linux, Windows ou Android) simultaneamente em uma única máquina física. Ele atua como um hipervisor hospedado, isolando completamente o ambiente virtualizado do sistema operacional nativo do usuário."},{"n":"VirusTotal","u":"https://www.virustotal.com","d":"O VirusTotal é um serviço online que analisa arquivos brutos, URLs, endereços IP e nomes de domínio para detectar conteúdos maliciosos, códigos suspeitos e anomalias de segurança. A plataforma agrega resultados de mais de 70 antivírus, mecanismos de varredura de sites e ferramentas de extração de metadados, atuando como um gigantesco banco de dados centralizado sobre infraestrutura cibernética e vetores de ameaças."},{"n":"VMware Workstation Player","u":"https://www.vmware.com/products/desktop-hypervisor/workstation-and-fusion","d":"O VMware Workstation Player é um utilitário de virtualização de desktop simplificado e estável que permite a execução de múltiplos sistemas operacionais isolados na mesma máquina física. Desenvolvido pela VMware (Broadcom), o software atua como um hipervisor hospedado, criando sandboxes completas capazes de rodar distribuições de segurança, forense ou sistemas operacionais convencionais de forma totalmente segregada do sistema hospedeiro."},{"n":"VPN Gate","u":"https://www.vpngate.net/","d":"O VPN Gate é um projeto de pesquisa científica de código aberto e de âmbito global hospedado na Universidade de Tsukuba, no Japão. A plataforma funciona como um repositório distribuído e dinâmico de servidores de VPN de trânsito público operados voluntariamente por usuários de diversas partes do mundo, suportando protocolos consolidados de comunicação segura como L2TP/IPsec, OpenVPN, MS-SSTP e SSL-VPN."},{"n":"Wayback Machine (Internet Archive)","u":"https://web.archive.org/","d":"A Wayback Machine é um arquivo digital da World Wide Web fundado pelo Internet Archive. A plataforma captura, armazena e disponibiliza réplicas históricas (*snapshots*) de bilhões de páginas públicas da internet ao longo do tempo, permitindo o acesso a conteúdos que já foram modificados, deletados ou que pertencem a domínios desativados."},{"n":"Webmii","u":"https://webmii.com/","d":"O Webmii é uma plataforma de busca global centralizada no mapeamento de pessoas e identidades na internet. A ferramenta realiza uma varredura automatizada em múltiplos serviços digitais a partir de um nome ou sobrenome fornecido, gerando um índice de visibilidade pública e correlacionando links, palavras-chave, imagens e contas associadas ao indivíduo em uma única interface."},{"n":"Webrecorder","u":"https://webrecorder.net","d":"O Webrecorder é um conjunto de ferramentas de código aberto projetado para criar arquivos digitais de alta fidelidade da internet. Diferente de capturas estáticas ou prints tradicionais, a plataforma grava o tráfego de rede interativo enquanto o analista navega pela página, permitindo a reprodução e preservação exata de mídias, scripts, redes sociais dinâmicas e conteúdos complexos sob o padrão internacional ISO WARC (Web ARChive)."},{"n":"WhatsMyName","u":"https://whatsmyname.app","d":"O WhatsMyName é uma ferramenta especializada na detecção e enumeração de nomes de usuário (*usernames*) em uma vasta quantidade de sites, fóruns e plataformas digitais. A plataforma utiliza um método automatizado de requisições web baseadas em dicionários e assinaturas predefinidas para validar em quais serviços um determinado apelido ou identificador digital possui uma conta ativa."},{"n":"WhatsMyUA","u":"https://www.whatsmyua.info/","d":"O WhatsMyUA é uma aplicação baseada na web projetada especificamente para capturar, exibir e analisar em tempo real a *string* de User-Agent enviada pelo navegador de internet do usuário. A ferramenta quebra a assinatura técnica complexa em blocos inteligíveis, identificando com precisão o sistema operacional, arquitetura de hardware, motor de renderização, navegador e suas respectivas versões."},{"n":"Whimsical","u":"https://whimsical.com/","d":"O Whimsical é uma plataforma colaborativa baseada na web projetada para a criação centralizada de artefatos visuais, como mapas mentais, diagramas de fluxo (*flowcharts*), wireframes e quadros de notas pegajosas. A ferramenta oferece uma interface fluida que permite organizar ideias, sequências lógicas e estruturas complexas de informações de forma ágil e altamente visual."},{"n":"Whitepages","u":"https://www.whitepages.com/","d":"O Whitepages é uma plataforma online de diretórios e registros públicos focada principalmente no território norte-americano. A ferramenta agrupa dados de listas telefônicas, registros de propriedade, históricos residenciais e cadastros civis, permitindo que os usuários busquem informações detalhadas sobre cidadãos e empresas a partir de nomes, telefones, endereços ou e-mails."},{"n":"Who Posted What?","u":"https://whopostedwhat.com","d":"O Who Posted What? é uma ferramenta web voltada para investigações em redes sociais (SOCMINT), projetada especificamente para estruturar consultas complexas e realizar pesquisas precisas dentro do ecossistema do Facebook. A plataforma permite contornar as limitações da interface de pesquisa padrão do Facebook, permitindo localizar postagens por palavras-chave específicas em datas exatas, além de auxiliar analistas a extrair IDs de usuários e páginas de forma ágil."},{"n":"WhoisFreaks Reverse WHOIS Search","u":"https://whoisfreaks.com/tools/whois/reverse/search","d":"O WhoisFreaks Reverse WHOIS Search é uma ferramenta especializada de inteligência cibernética que permite a realização de buscas reversas em registros de propriedades digitais. Em vez de consultar quais dados pertencem a um domínio específico, a ferramenta permite que o investigador insira um termo conhecido (como o nome de um proprietário, um endereço de e-mail corporativo ou a razão social de uma empresa) para descobrir todos os nomes de domínio atualmente ou anteriormente vinculados àquele identificador."},{"n":"WhoIsHostingThis?","u":"https://www.whoishostingthis.com/","d":"O WhoIsHostingThis? é uma ferramenta de consulta rápida projetada para identificar qual empresa ou provedor de serviços de internet (ISP) está hospedando um determinado site. Ao inserir um nome de domínio, a plataforma resolve os registros técnicos necessários para apontar o servidor web ativo, o endereço IP e a localização geográfica da infraestrutura física onde os dados do domínio estão armazenados."},{"n":"Whonix","u":"https://www.whonix.org/","d":"O Whonix é um sistema operacional voltado para segurança e privacidade, baseado na distribuição Debian Linux e projetado para rodar dentro de máquinas virtuais. Sua arquitetura única é dividida em dois componentes isolados que rodam de forma simultânea: o Whonix-Gateway, que gerencia as conexões e força de forma estrita que todo o tráfego de rede passe pela rede de anonimato Tor, e o Whonix-Workstation, um ambiente de usuário totalmente isolado do qual nenhuma conexão direta à internet consegue vazar."},{"n":"Whoxy","u":"https://www.whoxy.com/","d":"O Whoxy é uma plataforma especializada em inteligência de domínios e serviços de WHOIS que fornece um banco de dados robusto contendo centenas de milhões de registros de domínios internacionais. A ferramenta permite realizar buscas detalhadas de dados cadastrais atuais e históricos de sites, além de oferecer funcionalidades avançadas de WHOIS reverso, onde é possível descobrir todos os domínios registrados sob o mesmo nome de proprietário, empresa, endereço de e-mail ou palavra-chave específica."},{"n":"WiFi Map","u":"https://www.wifimap.io/","d":"O WiFi Map é uma plataforma baseada em dados colaborativos (*crowdsourcing*) que mapeia milhões de pontos de acesso Wi-Fi, redes sem fio e roteadores ao redor do mundo. Alimentado por sua comunidade de usuários, o serviço cataloga coordenadas geográficas precisas, nomes
