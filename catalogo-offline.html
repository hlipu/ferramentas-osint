 de redes (SSIDs), senhas de acesso fornecidas publicamente e comentários sobre a qualidade da conectividade local."},{"n":"WiGLE","u":"https://wigle.net/","d":"O WiGLE (Wireless Geographic Logging Engine) é o maior banco de dados global consolidado focado no mapeamento geográfico de redes sem fio. A plataforma centraliza e indexa bilhões de registros coletados por entusiastas e profissionais de segurança via *wardriving* ao redor do mundo, catalogando redes Wi-Fi por meio de seus nomes de exibição (SSIDs) e endereços físicos de hardware (BSSIDs/Endereços MAC), além de mapear torres de telefonia celular e antenas de transmissão (Bluetooth e infraestruturas móveis)."},{"n":"WolframAlpha","u":"https://www.wolframalpha.com/","d":"O WolframAlpha é um motor de busca computacional de conhecimento que, diferentemente dos motores de busca tradicionais que indexam páginas web, responde a consultas extraindo e processando dados diretamente de uma base de conhecimento estruturada e curada. A ferramenta utiliza algoritmos avançados, inteligência computacional e processamento de linguagem natural para gerar relatórios dinâmicos, cálculos matemáticos, análises estatísticas e visualizações gráficas em tempo real."},{"n":"World Bank Open Data - Brazil","u":"https://data.worldbank.org/country/brazil","d":"O portal de dados abertos do Banco Mundial para o Brasil é uma plataforma institucional centralizada que compila, estrutura e disponibiliza séries temporais de indicadores de desenvolvimento global. A base de dados reúne métricas oficiais coletadas em parceria com órgãos estatísticos nacionais (como o IBGE) abrangendo dados econômicos (PIB, inflação, comércio), sociais (índices de pobreza, educação, saúde), demográficos (crescimento populacional, urbanização) e ambientais."},{"n":"World Imagery Wayback (Esri Living Atlas)","u":"https://livingatlas.arcgis.com/wayback/","d":"O World Imagery Wayback é uma plataforma digital desenvolvida pela Esri que funciona como um repositório histórico de mapas e imagens de satélite globais. A ferramenta permite aos usuários acessar, visualizar e comparar diferentes versões e atualizações da camada de imagens de satélite do *World Imagery* coletadas ao longo dos anos, funcionando como uma \"máquina do tempo\" geoespacial."},{"n":"X Pro (antigo TweetDeck)","u":"https://pro.x.com/","d":"O X Pro (anteriormente conhecido como TweetDeck) é a interface avançada de gerenciamento, visualização e monitoramento contínuo de conteúdo da rede social X. A ferramenta organiza feeds, listas de usuários, menções, notificações e pesquisas em colunas modulares em tempo real, permitindo a aplicação de operadores de busca, filtros de engajamento, restrições temporais e localização geográfica."},{"n":"Yandex Images","u":"https://yandex.com/images","d":"O Yandex Images é o serviço especializado de busca e indexação visual do motor de busca multinacional Yandex. A ferramenta destaca-se globalmente no cenário tecnológico devido à alta precisão e sofisticação de seus algoritmos de visão computacional, que superam frequentemente outros indexadores convencionais na identificação de similaridades geométricas, correspondência exata de locais, leitura de caracteres em texturas visuais e, especialmente, no reconhecimento e isolamento de características faciais humanas."},{"n":"yEd Graph Editor","u":"https://www.yworks.com/products/yed/download","d":"O yEd Graph Editor é um software de desktop poderoso para a criação de diagramas e grafos de alta qualidade. Ele permite gerar estruturas visuais complexas de forma manual ou por meio da importação de dados externos (como planilhas do Excel), oferecendo algoritmos automáticos de layout que organizam dinamicamente grandes volumes de dados interconectados para facilitar a legibilidade de redes relacionais."},{"n":"Zadarma","u":"https://zadarma.com/","d":"O Zadarma é uma plataforma global de telecomunicações baseada em nuvem que oferece serviços de VoIP (Voz sobre IP), sistemas de PABX virtual e a contratação de números de telefone virtuais (VoIP/DID) de mais de 100 países. A plataforma permite a realização e o recebimento de chamadas telefônicas via internet, além do recebimento de mensagens de texto (SMS) diretamente pelo painel web ou via integração de API."},{"n":"Zoho","u":"https://www.zoho.com/","d":"A Zoho é uma plataforma global de software como serviço (SaaS) que oferece uma suíte abrangente de aplicações de negócios, produtividade e colaboração em nuvem. Entre suas ferramentas mais proeminentes estão o Zoho Mail (provedor de e-mail seguro e corporativo), o Zoho CRM (gestão de relacionamento) e soluções de gerenciamento de identidades e acessos."},{"n":"ZXing Decoder Online","u":"https://zxing.org/w/decode.jspx","d":"O ZXing (Zebra Crossing) Decoder Online é uma ferramenta web de código aberto baseada em Java que permite extrair as informações textuais ou numéricas contidas em imagens de códigos de barras e QR Codes. O usuário submete uma imagem local ou fornece uma URL direta, e o decodificador interpreta a matriz gráfica de dados, exibindo o conteúdo bruto codificado (como URLs, textos simples ou dados estruturados) e informações técnicas adicionais."}]</script>
<script>
(function () {
  var dados = JSON.parse(document.getElementById('dados').textContent);
  var lista = document.getElementById('lista');
  var busca = document.getElementById('busca');
  var contador = document.getElementById('contador');

  function norm(s) {
    return String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
  }
  dados.forEach(function (d) { d._i = norm(d.n + ' ' + d.d + ' ' + d.u); });

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  // Destaca os termos sem perder acentuação do texto original
  function destacar(texto, termos) {
    if (!termos.length) return esc(texto);
    var n = norm(texto), marcas = new Array(texto.length).fill(false);
    termos.forEach(function (t) {
      var i = 0;
      while ((i = n.indexOf(t, i)) !== -1) {
        for (var k = i; k < i + t.length; k++) marcas[k] = true;
        i += t.length;
      }
    });
    var out = '', aberto = false;
    for (var i = 0; i < texto.length; i++) {
      if (marcas[i] && !aberto) { out += '<mark>'; aberto = true; }
      if (!marcas[i] && aberto) { out += '</mark>'; aberto = false; }
      out += esc(texto[i]);
    }
    return out + (aberto ? '</mark>' : '');
  }

  function linkSeguro(u) {
    return /^https?:\/\//i.test(u) ? u : '#';
  }

  function render() {
    var termos = norm(busca.value).split(/\s+/).filter(Boolean);
    var res = dados.filter(function (d) {
      return termos.every(function (t) { return d._i.indexOf(t) !== -1; });
    });
    contador.textContent = res.length + ' de ' + dados.length + ' ferramentas';
    if (!res.length) {
      lista.innerHTML = '<div class="vazio">Nenhuma ferramenta encontrada.</div>';
      return;
    }
    lista.innerHTML = res.map(function (d) {
      return '<article class="item">' +
        '<h2>' + destacar(d.n, termos) + '</h2>' +
        '<a href="' + esc(linkSeguro(d.u)) + '" target="_blank" rel="noopener noreferrer nofollow">' + destacar(d.u, termos) + '</a>' +
        '<p>' + destacar(d.d, termos) + '</p>' +
        '</article>';
    }).join('');
  }

  var timer;
  busca.addEventListener('input', function () {
    clearTimeout(timer);
    timer = setTimeout(render, 120);
  });
  render();
})();
</script>
</body>
</html>
