fone, data de nascimento, dados de emprego, características físicas e até mesmo dados financeiros temporários (como números de cartão de crédito válidos apenas em estruturas de testes algorítmicos), alinhados às características demográficas e geográficas do país escolhido pelo usuário."},{"n":"Fake Person Generator","u":"https://www.fakepersongenerator.com/","d":"O Fake Person Generator é uma plataforma online projetada para a geração automatizada de perfis biográficos e cadastrais completamente fictícios. A ferramenta utiliza algoritmos de randomização associados a bancos de dados padronizados para fornecer dados verossímeis em tempo real, incluindo nomes complexos, endereços estruturados, números de telefone simulados, datas de nascimento, ocupações profissionais, características físicas e dados simulados de identificação civil (como o SSN norte-americano)."},{"n":"Falecidos no Brasil","u":"https://www.falecidosnobrasil.org.br/","d":"O Falecidos no Brasil é um portal indexador e motor de busca centralizado projetado para a localização de registros de óbito, notas de falecimento, obituários e informações de sepultamento ocorridos em território nacional. A ferramenta agrega dados provenientes de fontes institucionais, administrações de cemitérios, funerárias e atos oficiais, permitindo a pesquisa estruturada por meio do nome completo do indivíduo, estado, município e período estimado do falecimento."},{"n":"FauxID","u":"https://fauxid.com/","d":"O FauxID é uma plataforma online desenvolvida para a geração automatizada e algorítmica de identidades fictícias e dados pessoais sintéticos detalhados. A ferramenta cria perfis biográficos completos sob demanda, incluindo nomes realistas, endereços postais simulados, números de telefone fictícios, credenciais de segurança e identificadores documentais (como SSN e cartões de crédito gerados por algoritmos de verificação como o de Luhn), além de traços de perfil como ocupação, preferências e dados de hardware simulados."},{"n":"FaviHash","u":"https://www.favihash.com/","d":"O FaviHash é uma ferramenta web especializada na extração e no cálculo do valor hash (utilizando predominantemente o algoritmo MurmurHash3) do favicon (ícone de identificação visual) de aplicações e servidores web. A plataforma permite que o usuário informe diretamente a URL de um site para que o sistema capture o ícone de forma automatizada, ou realize o upload manual de um arquivo de imagem correspondente ao favicon."},{"n":"FaviHunter","u":"https://github.com/eremit4/favihunter","d":"O FaviHunter é uma ferramenta de linha de comando (CLI) desenvolvida em Python que automatiza o processo de extração, análise e geração de assinaturas digitais de favicons (*ícones de aplicações web*). A partir de uma URL ou de um arquivo de imagem local, o script realiza o download do artefato, calcula seus hashes de forma automatizada em múltiplos algoritmos compatíveis com indexadores de rede (como MurmurHash3, MD5 e SHA256) e compõe links diretos para a execução de consultas e buscas correlacionadas em plataformas de inteligência de ameaças."},{"n":"Feodo Tracker","u":"https://feodotracker.abuse.ch/","d":"O Feodo Tracker é um projeto do abuse.ch que identifica e acompanha servidores de comando e controle (C2) usados por famílias de malware bancário e botnets, como Dridex, Emotet, QakBot e similares. A plataforma publica o histórico de cada IP de C2 (malware associado, porta, ASN, país, primeira e última detecção) e disponibiliza listas de bloqueio gratuitas em vários formatos."},{"n":"FFmpeg","u":"https://www.ffmpeg.org/","d":"O FFmpeg é uma solução multiplataforma de código aberto voltada para o processamento, conversão, gravação e decodificação de fluxos de áudio e vídeo. Operando de forma estrita via interface de linha de comando (CLI), a ferramenta baseia-se em um conjunto massivo de bibliotecas compartilhadas (como libavcodec e libavformat) que fornecem suporte a virtualmente qualquer codec, formato de contêiner ou especificação técnica de arquivo de mídia existente."},{"n":"FindIP (api.findip.net)","u":"https://api.findip.net","d":"O FindIP é uma plataforma e API de inteligência cibernética focada na análise detalhada e enriquecimento de dados associados a endereços IP (IPv4 e IPv6). A ferramenta fornece informações técnicas em tempo real estruturadas em formato JSON, abrangendo dados de geolocalização cadastral (país, região, cidade, coordenadas de latitude/longitude, fuso horário e código postal), informações de atribuição de infraestrutura (provedor de internet/ISP, organização detentora do bloco e Autonomous System Number - ASN), além de um módulo avançado de detecção de tráfego anônimo e mitigação de fraudes (identificação de conexões via Proxies HTTP/SOCKS, VPNs comerciais ou privadas, nós de saída da rede Tor, Apple iCloud Private Relay e cálculo de score de risco reputacional)."},{"n":"Fingerprint Demo (fingerprint.com/demo)","u":"https://fingerprint.com/demo/","d":"O Fingerprint Demo é uma página de demonstração técnica da plataforma comercial Fingerprint. A ferramenta expõe a capacidade de identificação persistente de dispositivos e navegadores através de técnicas avançadas de *browser fingerprinting*. Ela analisa e cruza múltiplos vetores de hardware, software e rede (incluindo atributos de Canvas, WebGL, APIs de áudio, fontes instaladas, componentes de hardware, arquitetura do navegador e telemetria do sistema) para gerar um identificador exclusivo e estável (Visitor ID), capaz de rastrear um dispositivo mesmo que o usuário limpe os cookies, utilize o modo incógnito ou altere o seu endereço IP."},{"n":"Flickr Map","u":"https://www.flickr.com/map/","d":"O Flickr Map é a interface cartográfica interativa da plataforma de compartilhamento de fotos Flickr. O recurso permite visualizar, explorar e pesquisar milhões de imagens e vídeos enviados por usuários que contêm dados de geolocalização (*geotags*) ou coordenadas GPS vinculadas, plotando as mídias diretamente sobre um mapa global navegável."},{"n":"Flickr The Commons","u":"https://www.flickr.com/commons/","d":"O Flickr The Commons é um projeto e repositório público criado para compartilhar acervos fotográficos e documentos visuais históricos provenientes de arquivos, bibliotecas, hemerotecas e museus de diversas partes do mundo. Lançado inicialmente em parceria com a Biblioteca do Congresso dos Estados Unidos, o portal reúne centenas de milhares de imagens que não possuem restrições conhecidas de direitos autorais, permitindo acesso aberto, pesquisa textual e catalogação colaborativa de mídias históricas."},{"n":"FlightAware Photos (pt.flightaware.com/photos/)","u":"https://pt.flightaware.com/photos/","d":"O FlightAware Photos é um repositório e galeria pública colaborativa integrada à plataforma FlightAware. Alimentada por uma rede global de entusiastas e observadores de aeronaves (*spotters*), a ferramenta centraliza milhões de fotografias de aviões comerciais, jatos executivos, helicópteros, aeronaves militares e infraestruturas aeroportuárias. O banco de dados permite indexar e buscar imagens com base em critérios técnicos estritos, como o prefixo ou matrícula da aeronave (Tail Number), o modelo do fabricante, o aeroporto de registro da foto ou a companhia aérea operadora."},{"n":"Flightradar24 (flightradar24.com)","u":"https://www.flightradar24.com/","d":"O Flightradar24 é uma plataforma global de rastreamento de voos que exibe informações em tempo real sobre o tráfego aéreo mundial. Alimentada por uma vasta rede de receptores ADS-B (Automatic Dependent Surveillance-Broadcast) baseados em terra e via satélite, a ferramenta agrega e renderiza dados detalhados de aeronaves comerciais, jatos executivos e certas categorias de transporte logístico ou governamental. Ela exibe a posição geoespacial exata, histórico de rotas, velocidade, altitude, modelo do fabricante, companhia operadora e número de matrícula (Tail Number)."},{"n":"FlightStats (flightstats.com)","u":"https://www.flightstats.com/","d":"O FlightStats é uma plataforma global de dados de aviação civil que fornece informações detalhadas e em tempo real sobre voos comerciais ao redor do mundo. Gerida pela Cirium, a ferramenta compila dados globais de companhias aéreas, terminais aeroportuários e sistemas de controle de tráfego aéreo para disponibilizar o status exato de voos (incluindo partidas, chegadas, atrasos e cancelamentos), portões de embarque, fuso horário, especificações técnicas da aeronave que opera o trecho e condições meteorológicas locais."},{"n":"FOFA (fofa.info)","u":"https://fofa.info","d":"O FOFA é um mecanismo de busca voltado para o mapeamento do ciberespaço, operando de forma análoga a plataformas como Shodan e Censys. A ferramenta realiza varreduras contínuas e massivas na infraestrutura global da internet para indexar e catalogar dispositivos conectados, servidores, roteadores, sistemas industriais e bancos de dados expostos. O FOFA estrutura informações detalhadas sobre portas de comunicação abertas, protocolos de rede, cabeçalhos de resposta (banners HTTP), certificados criptográficos SSL/TLS e assinaturas visuais (hashes de favicons), tornando esse inventário pesquisável por meio de uma sintaxe avançada de filtros."},{"n":"Follow That Page (followthatpage.com)","u":"https://www.followthatpage.com/","d":"O Follow That Page é um serviço online de monitoramento de alterações e inteligência passiva que rastreia modificações no conteúdo de páginas web especificadas pelo usuário. A ferramenta realiza varreduras periódicas programadas (diárias, horárias ou em intervalos customizados) nas URLs cadastradas, extrai o conteúdo textual e compara o resultado atual com o histórico arquivado. Caso qualquer modificação seja detectada (inclusão, exclusão ou alteração de termos e blocos de código), a plataforma gera um relatório diferencial (*diff*) detalhando as mudanças e envia um alerta automatizado diretamente para o e-mail do investigador."},{"n":"FotoForensics (fotoforensics.com)","u":"https://fotoforensics.com/","d":"O FotoForensics é uma plataforma web voltada para a aplicação de técnicas de forense digital e controle de integridade em arquivos de imagem (como JPEG, PNG e WebP). A ferramenta funciona como um laboratório de análise estática, fornecendo múltiplos algoritmos para avaliar se uma imagem foi modificada digitalmente, editada ou gerada artificialmente. Seus recursos centrais incluem a Análise de Nível de Erro (ELA - Error Level Analysis), que identifica a taxa de compressão diferencial em componentes da imagem para destacar edições e inserções secundárias, além de ferramentas de extração completa de metadados estruturados (EXIF, XMP, IPTC), análise de matriz de cores, estimativa de qualidade de compressão JPEG e cálculo de assinaturas de hash (MD5, SHA-1, SHA-256)."},{"n":"Fragment","u":"https://fragment.com/","d":"O Fragment é uma plataforma descentralizada oficial que facilita o leilão e a negociação direta de colecionáveis digitais do ecossistema Telegram, incluindo nomes de usuário (*usernames*), canais e números de telefone anônimos (com o prefixo +888). A infraestrutura opera sobre a blockchain TON (The Open Network), registrando publicamente todas as transações, lances e trocas de custódia desses identificadores por meio de contratos inteligentes."},{"n":"Frinkiac","u":"https://frinkiac.com/","d":"O Frinkiac é uma plataforma de busca e indexação visual dedicada a mapear e correlacionar legendas, citações textuais e fotogramas (*screencaps*) de quase duas décadas de episódios da animação *The Simpsons*. A plataforma analisa o roteiro e as legendas temporais para permitir que usuários encontrem o momento exato em que uma frase ou diálogo ocorre, gerando imagens estáticas e GIFs com legendas embutidas."},{"n":"gau (getallurls)","u":"https://github.com/lc/gau","d":"O `gau` (getallurls) é uma ferramenta desenvolvida em Go voltada para a coleta massiva e passiva de URLs históricas conhecidas associadas a um determinado domínio. Ele realiza consultas automatizadas em múltiplos provedores públicos e agregadores de dados da internet, como a Wayback Machine (Archive.org), AlienVault Open Threat Exchange (OTX), Common Crawl e URLScan, consolidando os resultados encontrados de forma ágil em uma saída de texto unificada."},{"n":"Gemini","u":"https://gemini.google.com/","d":"O Gemini é uma plataforma de inteligência artificial conversacional desenvolvida pela Google, baseada em seus modelos de linguagem de grande porte (LLM). A ferramenta é projetada para compreender, processar e gerar textos, códigos e análises complexas a partir de comandos em linguagem natural, operando de forma integrada ao ecossistema de serviços da Google."},{"n":"Generated Photos","u":"https://generated.photos/","d":"O Generated Photos é uma plataforma baseada em Inteligência Artificial que utiliza Redes Geradoras Adversariais (GANs) para criar fotos de rostos humanos hiper-realistas do zero. O sistema oferece um banco de dados com milhares de imagens isentas de direitos autorais e uma ferramenta de customização (\"Face Generator\") que permite ajustar parâmetros específicos como idade, gênero, etnia, expressão facial, cor dos olhos, comprimento do cabelo e emoções."},{"n":"Genso AI","u":"https://gensoai.io/","d":"O Genso AI é um estúdio online que reúne mais de 20 modelos de IA para gerar imagens e vídeos a partir de texto ou de imagens de referência, incluindo modelos como Seedream, Nano Banana, GPT-4o, Sora 2, Veo 3.1 e Kling. Oferece substituição de personagem em cenas, modelos prontos de estilo, biblioteca de referências e ampliação de imagens até 4K. Não deve ser confundido com o Gensou AI (gensou.ai), serviço japonês diferente."},{"n":"Gensou AI","u":"https://gensou.ai/","d":"O Gensou AI é uma plataforma japonesa de criação de conteúdo visual por inteligência artificial. Reúne vários modelos de geração de imagem e vídeo, permite criar vídeos a partir de texto ou imagens com controle de movimento de câmera, sincronizar a fala com o movimento dos lábios (lip-sync), manter a aparência de um mesmo personagem em várias cenas e ampliar imagens até 4K."},{"n":"Genymotion","u":"https://www.genymotion.com/download/","d":"O Genymotion é um emulador Android de alto desempenho baseado em arquitetura de virtualização. Ele permite simular uma ampla variedade de dispositivos móveis com diferentes versões do sistema operacional Android, configurações de hardware e resoluções de tela diretamente em um computador convencional."},{"n":"GeoNode","u":"https://geonode.com/","d":"O GeoNode é uma plataforma especializada no fornecimento de infraestrutura de redes e servidores proxy, abrangendo conexões residenciais, móveis (4G/5G) e de centros de dados (datacenters). Além dos planos comerciais, o serviço mantém uma listagem pública, atualizada e estruturada de proxies abertos globais, permitindo o redirecionamento escalonável do tráfego HTTP, HTTPS e SOCKS."},{"n":"Gephi","u":"https://gephi.org/","d":"O Gephi é um software de código aberto voltado para a exploração, visualização e análise de redes complexas, grafos direcionados e não-direcionados. Utilizando algoritmos de layout em tempo real (como ForceAtlas2, Fruchterman-Reingold e OpenOrd) e ferramentas de cálculo estatístico, a plataforma processa grandes volumes de dados tabulares estruturados em vértices (nós) e arestas (conexões), permitindo medir métricas de centralidade, modularidade, densidade e proximidade."},{"n":"Gerador de CPF Válido (geradortxt)","u":"https://github.com/willianwistuba/geradorcpfvalido/blob/main/geradortxt","d":"O `geradorcpfvalido` (especificamente o módulo focado em geração textual em lote) é um script utilitário de código aberto projetado para calcular e emitir números de Cadastro de Pessoas Físicas (CPF) matematicamente válidos. A ferramenta aplica o algoritmo oficial de validação de dígitos verificadores (módulo 11) para construir sequências numéricas estruturadas que simulam o formato de um documento civil real, permitindo a exportação direta dos dados em lote."},{"n":"Getúlio AI","u":"https://getulio.ai/","d":"O Getúlio AI é uma plataforma web orientada por inteligência artificial e processamento de linguagem natural (PLN) voltada para o ecossistema jurídico-trabalhista brasileiro. A ferramenta atua na consulta e interpretação de ações e litígios trabalhistas a partir do número do processo judicial, CPF ou CNPJ. Ela consome dados de sistemas processuais públicos (como tribunais do trabalho - TRTs e TST), estruturando informações como fase processual atual, valor da causa, histórico de movimentações, identificação de partes e advogados envolvidos, além de consolidar métricas de contencioso corporativo (volume total de processos por empresa e valores médios de acordos)."},{"n":"Gibiru","u":"https://gibiru.com/","d":"O Gibiru é um mecanismo de busca na web focado em privacidade e anonimato, em operação desde 2009. A plataforma atua como um intermediário de consultas, consultando algoritmos de busca convencionais e bases de dados abertas sem registrar o endereço IP do usuário, sem armazenar consultas em histórico de servidores e sem injetar cookies de rastreamento ou identificadores de perfil comercial. O serviço também indexa páginas e conteúdos que podem sofrer despriorização ou censura algorítmica em buscadores comerciais comuns."},{"n":"GifCities","u":"https://gifcities.org/","d":"O GifCities é um projeto de preservação digital e mecanismo de busca desenvolvido pelo Internet Archive, criado para indexar e resgatar o acervo visual de páginas do extinto serviço de hospedagem Yahoo! GeoCities. A plataforma extrai e cataloga milhões de GIFs animados, gráficos e elementos visuais da era inicial da internet (décadas de 1990 e 2000), vinculando cada artefato às URLs e páginas originais preservadas no acervo do Wayback Machine."},{"n":"GNU Awk (gawk)","u":"https://www.gnu.org/software/gawk/","d":"O GNU Awk (gawk) é uma linguagem de programação interpretada e uma ferramenta de linha de comando voltada para o processamento, manipulação e extração de dados estruturados e textuais. Ele opera realizando varreduras sequenciais em arquivos de texto linha por linha, aplicando expressões regulares (Regex) para identificar padrões específicos e executando ações predefinidas sobre os campos de dados correspondentes."},{"n":"GNU grep","u":"https://www.gnu.org/software/grep","d":"O GNU grep é um utilitário de linha de comando clássico, nativo em sistemas Unix/Linux, projetado para realizar buscas rápidas em arquivos de texto locais com base em padrões definidos pelo usuário ou Expressões Regulares (RegEx). A ferramenta se destaca por sua alta performance e eficiência no processamento de arquivos massivos, sendo capaz de varrer gigabytes de dados sem saturar a memória RAM do sistema."},{"n":"GNU sed (Stream Editor)","u":"https://www.gnu.org/software/sed/","d":"O GNU sed é um editor de fluxo de texto (*stream editor*) nativo de sistemas operacionais Unix-like. Ao contrário de editores de texto interativos tradicionais, o `sed` processa os dados de entrada (arquivos ou pipes de comandos) de forma linear e automatizada, aplicando operações predefinidas — como substituições baseadas em expressões regulares (Regex), remoções de linhas, inserções e filtragens estruturadas — diretamente no fluxo de texto."},{"n":"GNU Wget","u":"https://www.gnu.org/software/wget/","d":"O GNU Wget é uma ferramenta de linha de comando desenvolvida pelo Projeto GNU para o download não interativo de arquivos através dos protocolos HTTP, HTTPS e FTP. O utilitário foi projetado para operar com alta resiliência em conexões instáveis, suportando retomada de transferências interrompidas, limitação de taxa de download, configuração de cabeçalhos/cookies personalizados e navegação recursiva em estruturas de diretórios web e FTP."},{"n":"GoFullPage - Full Page Screen Capture","u":"https://chrome.google.com/webstore/detail/gofullpage-full-page-scre/fdpohaocaechififmbbbbbknoalclacl","d":"O GoFullPage é uma extensão de navegador desenvolvida para capturar capturas de tela (*screenshots*) completas e contínuas de páginas da internet. A ferramenta rola a página renderizada de forma automatizada e programática, costurando os fragmentos visuais para gerar um único arquivo de imagem de alta resolução (PNG ou JPG) ou um documento PDF, capturando com precisão elementos ocultos além da área visível inicial (*viewport*), como rodapés e comentários longos."},{"n":"Google Account Sign-In","u":"https://accounts.google.com/v3/signin","d":"O Google Account Sign-In é o portal oficial e centralizado de autenticação para todos os serviços do ecossistema Google (como Gmail, YouTube, Google Drive e Google Workspace). Sob a perspectiva técnica de segurança e análise de dados, a interface processa requisições em tempo real para verificar a existência de credenciais de usuários em sua base de dados antes de prosseguir para a etapa de inserção de senha."},{"n":"Google Admin Toolbox - Messageheader","u":"https://toolbox.googleapps.com/apps/messageheader/","d":"O Messageheader é um utilitário oficial integrado ao ecossistema de ferramentas de diagnóstico da Google (Google Admin Toolbox). A plataforma foi desenvolvida para decodificar e analisar de forma estática as linhas textuais que compõem o cabeçalho bruto (*headers*) de uma mensagem de e-mail, organizando os dados técnicos de roteamento em uma tabela cronológica linear que evidencia os tempos de transferência e o status de segurança de protocolos de validação de remetentes."},{"n":"Google Advanced Search","u":"https://www.google.com/advanced_search","d":"O Google Advanced Search é uma interface gráfica oficial que simplifica a criação de consultas de pesquisa complexas e altamente filtradas. A plataforma traduz parâmetros inseridos em campos estruturados (como correspondências exatas, exclusão de palavras, intervalos numéricos, idiomas, regiões, sites/domínios específicos e formatos de arquivos) em operadores de busca avançados (Google Dorks) de forma totalmente automatizada."},{"n":"Google Alerts","u":"https://www.google.com.br/alerts","d":"O Google Alerts (Google Alertas) é um serviço de monitoramento de conteúdo baseado na nuvem fornecido pela Google. A ferramenta automatiza a execução de consultas de pesquisa na web, rastreando constantemente o surgimento de novas páginas indexadas, artigos de notícias, postagens em blogs ou menções textuais que correspondam aos termos e critérios predefinidos pelo usuário, enviando notificações consolidadas diretamente por e-mail ou via feed RSS."},{"n":"Google Colaboratory (Colab)","u":"https://colab.research.google.com/","d":"O Google Colaboratory (Colab) é um ambiente baseado em nuvem que permite a criação, execução e compartilhamento de cadernos interativos (*Jupyter Notebooks*). Ele fornece uma interface integrada para a escrita e execução de códigos em linguagens de programação (primariamente Python), concedendo acesso direto e sob demanda a recursos de hardware hospedados nos servidores da Google, como memória RAM e processadores gráficos de alto desempenho (GPUs)."},{"n":"Google Dorks for Bug Bounty","u":"https://github.com/TakSec/google-dorks-bug-bounty","d":"O repositório \"Google Dorks for Bug Bounty\", mantido por TakSec no GitHub, é um guia de referência técnica que reúne uma ampla coleção de strings de pesquisa e operadores avançados de busca (Google Dorks). O projeto é estruturado para auxiliar profissionais de segurança da informação, caçadores de falhas (bug bounty hunters) e analistas de inteligência a localizarem endpoints de APIs expostos, arquivos de configuração confidenciais, logs de sistema, diretórios abertos e parâmetros suscetíveis a vulnerabilidades web (como SQL Injection, Cross-Site Scripting, SSRF e LFI) indexados publicamente pelo Google."},{"n":"Google Earth","u":"https://earth.google.com","d":"O Google Earth é uma plataforma de mapeamento global que renderiza uma representação tridimensional detalhada da Terra baseada primordialmente em imagens de satélite e fotografias aéreas. A sua versão web permite a exploração de continentes, análise de topografias complexas, visualização de estruturas urbanas em 3D e manipulação de dados geográficos diretamente no navegador de internet."},{"n":"Google Hacking Tests (Tutorialspoint)","u":"https://www.tutorialspoint.com/google_hacking_tests.htm","d":"A seção \"Google Hacking Tests\" do portal educacional Tutorialspoint é uma documentação técnica focada na técnica de Google Hacking (também denominada Google Dorking). O recurso detalha a sintaxe e o comportamento dos operadores lógicos e de pesquisa avançados do motor de busca (tais como `intitle:`, `inurl:`, `filetype:`, `site:` e `cache:`), fornecendo exemplos estruturados de strings de consulta utilizadas por auditores e analistas para mapear vulnerabilidades web, localizar arquivos confidenciais esquecidos em servidores e identificar painéis de administração expostos à indexação pública."},{"n":"Google Images","u":"https://images.google.com","d":"O Google Images é o serviço especializado da Google projetado para a indexação, catalogação e varredura de arquivos de imagem em toda a internet. A plataforma integra os algoritmos de reconhecimento visual do Google Lens, permitindo que usuários realizem consultas textuais ou utilizem um arquivo de imagem como entrada (pesquisa reversa) para localizar correspondências exatas, variações de resolução ou elementos visualmente semelhantes indexados na web."},{"n":"Google Keep","u":"https://keep.google.com/","d":"O Google Keep é um serviço de gerenciamento de notas baseado em nuvem desenvolvido pela Google. A plataforma permite a criação ágil de notas textuais, listas de tarefas com caixas de seleção, anexação de imagens, captação de áudios e desenhos livres, sincronizando todo o conteúdo em tempo real entre diferentes dispositivos associados a uma mesma conta de usuário."},{"n":"Google Lens","u":"https://search.google/ways-to-search/lens/","d":"O Google Lens é uma ferramenta de computação visual e reconhecimento de imagens baseada em inteligência artificial e redes neurais profundas. A plataforma analisa dados visuais para identificar objetos, roupas, produtos, espécies biológicas, pontos de referência geográficos, além de realizar a leitura, extração (OCR) e tradução automatizada de textos capturados em fotografias ou capturas de tela."},{"n":"Google Maps (Street View)","u":"https://www.google.com/maps","d":"O Street View é o recurso do Google Maps que exibe fotografias panorâmicas em 360° capturadas ao nível da rua por veículos, pedestres e colaboradores. Em muitas localidades, a ferramenta mantém um histórico de capturas de anos anteriores, acessível pela linha do tempo, além de fotos enviadas por usuários em pontos de interesse."},{"n":"Google My Maps","u":"https://www.google.com/mymaps","d":"O Google My Maps é uma extensão do ecossistema Google Maps que permite aos utilizadores criar, personalizar e partilhar mapas geográficos próprios. A ferramenta viabiliza a inserção manual de marcadores analíticos, desenho de linhas de trajetória, delimitação de perímetros poligonais e a importação de conjuntos de dados estruturados para exibição sobreposta às camadas de mapas vetoriais e imagens de satélite da Google."},{"n":"Google Patents","u":"https://patents.google.com/","d":"O Google Patents é um motor de busca especializado desenvolvido pela Google que indexa e organiza mais de 120 milhões de patentes, pedidos de patentes e documentos técnicos provenientes de mais de 100 escritórios de propriedade intelectual de todo o mundo (incluindo USPTO, EPO, WIPO, e o INPI brasileiro). A plataforma padroniza e traduz automaticamente os resumos e descrições técnicas, vinculando de forma estruturada as famílias de patentes, inventores, empresas requerentes, citações e litígios legais associados."},{"n":"Google Pinpoint","u":"https://journaliststudio.google.com/pinpoint/about","d":"O Google Pinpoint é uma plataforma especializada desenvolvida sob a iniciativa do Google News Initiative (Journalist Studio). O sistema foi projetado para auxiliar pesquisadores e analistas a processar, organizar e explorar grandes e complexas coleções de arquivos (como repositórios com milhares de páginas de PDFs, imagens digitalizadas, planilhas, e-mails brutos e arquivos de áudio). A ferramenta utiliza tecnologias avançadas de Reconhecimento Óptico de Caracteres (OCR) e algoritmos de processamento de linguagem natural da Google para indexar o conteúdo integral dos arquivos e extrair automaticamente as entidades citadas."},{"n":"Google Programmable Search Engine","u":"https://programmablesearchengine.google.com/","d":"O Google Programmable Search Engine (anteriormente denominado Google Custom Search Engine ou CSE) é um serviço disponibilizado pela Google que permite a criação de mecanismos de busca customizados baseados no seu algoritmo de indexação global. A ferramenta possibilita ao utilizador delimitar o escopo das pesquisas a um conjunto estrito de websites, subdomínios ou URLs específicas, além de permitir a customização de filtros, priorização de páginas e refinamentos temáticos estruturados."},{"n":"Google Public DNS","u":"https://dns.google","d":"O `dns.google` é a interface web oficial e o endpoint de API do serviço global de resolução de nomes de internet da Google (Google Public DNS). A plataforma permite a execução de consultas diretas a servidores de nomes para inspecionar registros DNS de qualquer domínio público, oferecendo suporte tanto para visualização em formato de texto estruturado na página quanto para requisições programáticas via protocolos DNS-over-HTTPS (DoH)."},{"n":"Grabify","u":"https://grabify.link/","d":"O Grabify (Grabify IP Logger) é uma ferramenta baseada na web que funciona como um encurtador de URLs avançado, projetado para rastrear e registrar informações detalhadas de qualquer usuário que clique no link gerado. A plataforma captura dados cruciais como o endereço IP, geolocalização estimada, provedor de internet (ISP), sistema operacional, navegador, agentes de usuário (User-Agent) e outras especificações técnicas do dispositivo conectado."},{"n":"Grayhat Warfare","u":"https://grayhatwarfare.com/","d":"O Grayhat Warfare é uma plataforma online e motor de busca especializado na localização, indexação e listagem de repositórios de armazenamento em nuvem publicamente expostos. O sistema realiza varreduras automáticas para catalogar Amazon S3 Buckets, Azure Blobs e DigitalOcean Spaces mal configurados, disponibilizando bilhões de arquivos indexados para consultas textuais por palavras-chave, extensões ou caminhos de diretório."},{"n":"GreyNoise Visualizer","u":"https://viz.greynoise.io","d":"O GreyNoise Visualizer é uma plataforma online que permite a consulta e a análise do \"ruído de fundo\" da internet. A ferramenta coleta, analisa e rotula dados de tráfego gerados por scanners de massa, bots, ferramentas de inventário (como Shodan e Censys), mecanismos de busca e atores maliciosos que realizam varreduras indiscriminadas no espaço de endereçamento IPv4 global."},{"n":"GruposWhats.app","u":"https://gruposwhats.app","d":"O GruposWhats.app é uma plataforma web que funciona como um diretório centralizado e indexador público de links de convite para grupos do WhatsApp. O site organiza e categoriza as comunidades por tópicos, palavras-chave e interesses, permitindo a descoberta e o acesso a salas de conversa ativas no aplicativo de mensageria de forma direta."},{"n":"HackerTarget - Extract Links","u":"https://hackertarget.com/extract-links/","d":"O HackerTarget Extract Links é um utilitário online desenvolvido para analisar o código-fonte de uma URL fornecida e extrair, de forma automatizada, todos os hiperlinks (links internos, links externos, imagens, scripts e arquivos) contidos na página. A ferramenta realiza a requisição HTTP a partir de seus próprios servidores e devolve os dados estruturados em uma lista limpa para análise imediata."},{"n":"Hatching Triage","u":"https://tria.ge/","d":"O Hatching Triage (tria.ge) é uma plataforma de sandbox automatizada baseada na nuvem, projetada para a execução, análise e triagem de amostras de malwares, documentos maliciosos e URLs suspeitas. A ferramenta executa os arquivos enviados em ambientes virtualizados isolados (Windows, Android, Linux), monitorando em tempo real o comportamento do artefato, alterações no sistema de arquivos, chamadas de API e, principalmente, a atividade de rede gerada."},{"n":"Have I Been Pwned (HIBP)","u":"https://haveibeenpwned.com/","d":"A Have I Been Pwned é uma plataforma de referência global voltada à auditoria de segurança e inteligência de ameaças. O serviço consolida e indexa registros de megavazamentos de dados (data breaches) ocorridos em milhares de serviços web, permitindo que analistas verifiquem se um identificador digital específico foi exposto publicamente."},{"n":"Heritrix","u":"https://github.com/internetarchive/heritrix3","d":"O Heritrix é o rastreador web (web crawler) de código aberto em escala de produção desenvolvido e utilizado pelo Internet Archive. Projetado para coletar e arquivar páginas e recursos da World Wide Web, o software opera de forma estruturada para seguir links recursivamente a partir de sementes iniciais (*seed URLs*), gerando arquivos padronizados de preservação digital, como os formatos WARC e ARC, que registram o tráfego HTTP bruto e o código-fonte integral das páginas visitadas."},{"n":"Historypin","u":"https://www.historypin.org/","d":"O Historypin é uma plataforma colaborativa e arquivo digital aberto que mapeia documentos históricos, fotografias antigas, gravações de áudio e relatos em camadas cartográficas e cronológicas interativas. Desenvolvido em parceria com arquivos públicos, bibliotecas, museus e usuários do mundo inteiro, o serviço projeta conteúdos visuais e históricos diretamente sobre mapas digitais e interfaces de Street View, permitindo a comparação espacial e temporal da evolução urbana e rural ao longo dos anos."},{"n":"Holehe","u":"https://github.com/megadose/holehe","d":"O Holehe é uma ferramenta modular de código aberto desenvolvida em Python que permite aos investigadores descobrir em quais sites, fóruns e plataformas online um determinado e-mail está cadastrado. A ferramenta automatiza requisições para os endpoints de login e recuperação de conta de mais de 120 serviços da web, analisando os códigos de resposta dos servidores para confirmar a existência da conta sem enviar e-mails de alerta ou notificações para o alvo sob investigação."},{"n":"Hootsuite","u":"https://www.hootsuite.com/","d":"O Hootsuite é uma plataforma de gerenciamento, escuta ativa (*social listening*) e monitoramento integrado de redes sociais. A ferramenta permite conectar múltiplos perfis e redes (como X/Twitter, Facebook, Instagram, LinkedIn, YouTube e TikTok) em um painel centralizado e modular, viabilizando o acompanhamento simultâneo de feeds, palavras-chave, hashtags, menções a marcas ou indivíduos e interações em tempo real."},{"n":"Hostinger WHOIS Lookup","u":"https://www.hostinger.com/br/whois","d":"A ferramenta WHOIS da Hostinger é uma interface web pública projetada para a consulta de registros do protocolo WHOIS em diversas extensões de domínios genéricos (gTLDs) e de código de país (ccTLDs). O serviço consulta os servidores de registro autoritativos para recuperar informações técnicas e cadastrais atreladas a um domínio, tais como servidor de registro (*registrar*), servidores de nomes de domínio (DNS/Name Servers), status de proteção, datas de criação, atualização e expiração, além de eventuais contatos públicos do titular."},{"n":"Hugging Face","u":"https://huggingface.co/","d":"O Hugging Face é o principal ecossistema colaborativo e plataforma de hospedagem voltada para a inteligência artificial e o aprendizado de máquina de código aberto. O portal centraliza e indexa milhares de modelos pré-treinados, conjuntos de dados (datasets) e aplicações web interativas (Spaces), servindo como uma infraestrutura fundamental para a execução e compartilhamento de tecnologias de processamento de linguagem natural (NLP), visão computacional, reconhecimento de áudio e análise multimodal."},{"n":"Hunter.io","u":"https://hunter.io/","d":"O Hunter.io é uma plataforma web projetada para localizar, extrair e verificar endereços de correio eletrônico corporativos. A ferramenta realiza varreduras em páginas públicas da internet para indexar e mapear a estrutura de e-mails de organizações, identificar os padrões de nomenclatura adotados por pessoas jurídicas, listar profissionais vinculados a esses domínios e auditar a validade técnica de caixas postais."},{"n":"Hurricane Electric BGP Toolkit","u":"https://bgp.he.net","d":"O Hurricane Electric BGP Toolkit é uma plataforma online desenvolvida para a análise, monitoramento e investigação técnica de dados de roteamento e conectividade da internet. Focada primordialmente no protocolo BGP (Border Gateway Protocol), a ferramenta consolida informações globais sobre Sistemas Autônomos (ASNs), prefixos e alocações de endereços IP (IPv4 e IPv6), relações de pareamento (peering), além de integrar dados de registros WHOIS e resoluções de DNS."},{"n":"Hushed","u":"https://hushed.com","d":"O Hushed é uma plataforma comercial voltada para a geração e gerenciamento de números de telefone temporários e secundários (comumente referidos como *burner numbers*). Operando por meio de tecnologia VoIP (Voice over Internet Protocol), o serviço permite que usuários realizem chamadas de voz e enviem mensagens de texto (SMS/MMS) de forma isolada, ocultando por completo o número de celular real atrelado ao chip SIM físico do dispositivo. A plataforma oferece suporte a linhas de múltiplos países, incluindo códigos de área dos Estados Unidos, Canadá e Reino Unido."},{"n":"I Search From","u":"https://isearchfrom.com/pt-BR","d":"O I Search From é uma ferramenta web projetada para permitir que usuários e analistas simulem buscas no mecanismo de pesquisa do Google a partir de localizações geográficas específicas (país, estado ou cidade), idiomas definidos e diferentes tipos de dispositivos (desktop, mobile ou tablet). A plataforma injeta parâmetros precisos de geolocalização (*UULE*, *gl*, *hl* e *near*) nas requisições do Google, exibindo a página exata de resultados (SERP) que um usuário situado naquela localidade veria."},{"n":"i2 Analyst's Notebook","u":"https://i2group.com/i2-analysts-notebook","d":"O i2 Analyst's Notebook é uma aplicação desktop avançada de inteligência visual desenvolvida para consolidar, modelar e analisar volumes massivos de dados estruturados e não estruturados. Através de uma abordagem baseada em entidades, vínculos e propriedades (ELP), a plataforma transforma registros complexos (como históricos de chamadas telefônicas, transações bancárias e logs de tráfego) em gráficos e redes relacionais interativas, auxiliando na identificação rápida de padrões ocultos e fluxos operacionais."},{"n":"I2P Hides","u":"https://i2phides.me","d":"O I2P Hides é um serviço de gateway e proxy baseado na web que atua como uma ponte de comunicação entre a Surface Web e a rede anônima I2P (Darknet). Ele permite que investigadores acessem, visualizem e naveguem em páginas e serviços ocultos nativos da rede I2P (conhecidos como *eepsites* com sufixo `.i2p`) diretamente a partir de um navegador convencional, eliminando a obrigatoriedade de instalar ou configurar o software cliente e o roteador oficial do ecossistema I2P localmente. A plataforma também fornece estatísticas, gráficos de estabilidade e índices de hosts ativos na rede oculta."},{"n":"I2P Search","u":"https://i2psearch.com","d":"O I2P Search (i2psearch.com) é um indexador e mecanismo de busca especializado que opera a partir da web de superfície (surface web), projetado para mapear, catalogar e rastrear páginas ocultas conhecidas como \"eepsites\" na rede I2P (Invisible Internet Project). A plataforma atua varrendo e expondo índices textuais, fóruns criptografados e diretórios descentralizados hospedados sob o sufixo de domínio `.i2p`, tornando visível ao investigador dados e infraestruturas que normalmente não seriam capturados por motores de busca convencionais."},{"n":"IAGRO - Consulta de Ficha Sanitária Animal","u":"https://www.servicos.iagro.ms.gov.br/ficha","d":"O portal de serviços da Agência Estadual de Defesa Sanitária Animal e Vegetal do Estado de Mato Grosso do Sul (IAGRO) disponibiliza a consulta pública e emissão da Ficha Sanitária Animal. A ferramenta oficial permite verificar a regularidade sanitária, a evolução e o saldo de rebanhos (bovinos, bubalinos, equinos, entre outros) associados a propriedades rurais e produtores cadastrados no estado. O sistema consolida dados sobre vacinações obrigatórias (como febre aftosa e brucelose), saldo por espécie/categoria e histórico de trânsito agropecuário."},{"n":"ICIJ Offshore Leaks Database","u":"https://offshoreleaks.icij.org/search","d":"O Offshore Leaks Database é uma plataforma de busca e análise de inteligência financeira mantida pelo International Consortium of Investigative Journalists (ICIJ). O portal disponibiliza dados públicos e desidentificados extraídos de grandes vazamentos de paraísos fiscais — incluindo investigações históricas como Panama Papers, Pandora Papers, Paradise Papers, Bahamas Leaks e FinCEN Files. A base consolida registros estruturados sobre centenas de milhares de entidades offshore, intermediários legais, diretores nomeados e beneficiários finais, oferecendo tanto um motor de busca textual quanto uma ferramenta interativa de visualização em grafos de rede."},{"n":"Identificator.space","u":"https://identificator.space","d":"O Identificator.space é uma plataforma online especializada no rastreamento e identificação de contas digitais associadas a um endereço de e-mail específico. A ferramenta funciona enviando requisições técnicas de forma automatizada para endpoints de login, registro e mecanismos de recuperação de credenciais de centenas de sites e serviços da web, determinando em tempo real se o e-mail em análise possui uma conta ativa nessas plataformas, operando sob uma lógica similar à do utilitário de terminal *holehe*."},{"n":"IDT Express WhatsApp Checker","u":"https://www.idtexpress.com/pt/whatsapp-checker/","d":"O IDT Express WhatsApp Checker é um utilitário baseado na web desenvolvido pela provedora global de comunicações IDT Express. A ferramenta permite que usuários insiram um número de telefone em formato internacional para verificar em tempo real se ele possui uma conta cadastrada e ativa no WhatsApp. Além de checar a existência da conta na plataforma de mensageria, o sistema analisa os prefixos do número para reportar metadados como a operadora de telefonia originária, a validade da estrutura do identificador e a região geográfica correspondente."},{"n":"IKnowWhatYouDownload","u":"https://iknowwhatyoudownload.com/","d":"O IKnowWhatYouDownload é uma plataforma online voltada para a auditoria e rastreamento de atividades de compartilhamento de arquivos em redes P2P (*Peer-to-Peer*). A ferramenta monitora de forma contínua a rede DHT (*Distributed Hash Table*) e trackers públicos do protocolo BitTorrent para indexar os conteúdos (como mídias, softwares e documentos) baixados ou transmitidos por endereços IP públicos, consolidando um histórico cronológico de tráfego associado àquela numeração de rede."},{"n":"ImageIdentify","u":"https://imageidentify.com/","d":"O ImageIdentify é uma plataforma de demonstração baseada na web (vinculada ao ecossistema Wolfram Language) que utiliza redes neurais profundas e algoritmos avançados de visão computacional para analisar o conteúdo de arquivos de imagem. Ao receber um arquivo local ou uma URL de imagem, o sistema processa estaticamente os dados de matrizes de pixels para identificar, categorizar e rotular de forma automática o objeto principal, ser vivo, veículo ou tipo de cenário presente na fotografia, gerando respostas baseadas em sua árvore de conhecimento nativa."},{"n":"Imagga","u":"https://imagga.com/","d":"O Imagga é uma plataforma de computação em nuvem que fornece soluções avançadas de visão computacional baseadas em inteligência artificial e redes neurais profundas. A ferramenta é amplamente conhecida por suas APIs de processamento de imagem, que realizam a etiquetagem automática de objetos (*auto-tagging*), categorização visual, extração e análise de paletas de cores, corte inteligente e detecção/reconhecimento facial. O processamento das mídias ocorre de maneira estática a partir do upload de arquivos locais ou do fornecimento de URLs diretas de imagens."},{"n":"IMEI.info","u":"https://www.imei.info/","d":"O IMEI.info é uma plataforma baseada na web projetada para a decodificação, análise e verificação de números IMEI (International Mobile Equipment Identity), o identificador exclusivo global de dispositivos celulares. A ferramenta processa o código numérico inserido para extrair as especificações de hardware vinculadas ao TAC (Type Allocation Code), identificando o fabricante, modelo comercial exato, data de lançamento e componentes físicos do aparelho. Adicionalmente, ela realiza cruzamentos com registros globais para verificar o status de bloqueio ou inclusão do dispositivo em listas negras (blacklist) por perda, roubo ou fraude."},{"n":"img-encode","u":"https://alexadam.github.io/demos/img-encode/index.html","d":"O img-encode é um utilitário experimental baseado em ambiente web que converte dados matriciais de imagens em um espectro de som, sintetizando as informações visuais em um arquivo de áudio digital no formato `.WAV`. O arquivo sonoro gerado, ao ser submetido a um software de análise espectral de frequências (como Sonic Visualiser ou Spek), renderiza e reconstrói a imagem original diretamente no espectrograma de áudio. O algoritmo processa os pixels do arquivo fornecido de maneira estática e local (client-side)."},{"n":"ImmuniWeb Dark Web & Threat Exposure Test","u":"https://www.immuniweb.com/darkweb/","d":"O ImmuniWeb Dark Web & Threat Exposure Test é uma solução online voltada para a avaliação da superfície de ataque e monitoramento de riscos digitais associados a uma organização. A partir da inserção de um nome de domínio, a plataforma realiza varreduras automatizadas em fóruns cibercriminosos, mercados clandestinos, canais de mensageria (como Telegram), pastebins e repositórios públicos e privados de dados vazados. A ferramenta consolida indicadores sobre credenciais corporativas comprometidas, instâncias de armazenamento em nuvem expostas (AWS, Azure e GCP), domínios falsos de phishing ou typosquatting e perfis fraudulentos em redes sociais."},{"n":"In-The-Sky.org (Live Satellite World Map)","u":"https://in-the-sky.org/satmap_worldmap.php","d":"O Live Satellite World Map do portal In-The-Sky.org é uma aplicação web interativa que plota, em tempo real, a posição geográfica e a trajetória orbital de milhares de satélites artificiais sobre um mapa global bidimensional ou globo 3D. A plataforma processa dados de elementos orbitais (TLE - Two-Line Elements) fornecidos por fontes de rastreamento aeroespacial como o NORAD e o Celestrak, calculando automaticamente variáveis como magnitude visual (brilho estimado), altitude, azimute e as condições de iluminação solar de cada espaçonave em relação a coordenadas terrestres."},{"n":"INMET Satélite","u":"https://satelite.inmet.gov.br/","d":"O portal de satélite do Instituto Nacional de Meteorologia (INMET) disponibiliza de forma pública imagens de sensoriamento remoto atualizadas continuamente, obtidas por satélites geoestacionários como a série GOES. A plataforma permite analisar a cobertura de nuvens, vapor d'água, precipitação e temperatura do topo de nuvens em toda a América do Sul e território brasileiro através de múltiplos canais de bandas e composições de imagem."},{"n":"INPI - Busca Avançada de Patentes","u":"https://busca.inpi.gov.br/pePI/jsp/patentes/PatenteSearchAvancado.jsp","d":"O sistema de Busca Avançada de Patentes do Instituto Nacional da Propriedade Industrial (INPI) é a plataforma oficial do governo brasileiro destinada à pesquisa, consulta e acompanhamento de pedidos de patentes, modelos de utilidade e certificados de adição de invenção depositados no país. A interface permite realizar cruzamentos complexos de dados utilizando múltiplos critérios de indexação, tais como o título da invenção, resumo descritivo, número do pedido, Classificação Internacional de Patentes (CIP), além dos nomes de depositantes, inventores e procuradores."},{"n":"INPI - Pesquisa de Marcas por Titular","u":"https://busca.inpi.gov.br/pePI/jsp/marcas/Pesquisa_titular.jsp","d":"O sistema de Pesquisa de Marcas por Titular do Instituto Nacional da Propriedade Industrial (INPI) é a interface oficial do governo brasileiro voltada para a consulta de marcas comerciais registradas ou em processo de homologação no país, indexadas especificamente a partir do nome ou identificador do seu proprietário (titular). A ferramenta permite rastrear o patrimônio de marcas, logotipos, slogans, patentes de design visual e marcas figurativas vinculados a uma determinada pessoa jurídica ou física."},{"n":"Insecam","u":"http://www.insecam.org/","d":"O Insecam é o maior diretório online do mundo dedicado à indexação e exibição de transmissões de vídeo ao vivo (*streams*) provenientes de câmeras de segurança IP desprotegidas. A plataforma realiza varreduras automatizadas na internet global para localizar sistemas de CFTV, câmeras residenciais, comerciais e industriais que não possuem senhas de autenticação configuradas ou que mantiveram as credenciais padrão de fábrica. Os feeds de vídeo são catalogados e organizados de forma sistemática por país, cidade, fuso horário, fabricante do hardware e categorias de ambiente (como ruas, escritórios, postos de combustíveis e residências)."},{"n":"Insta Stories Viewer","u":"https://insta-stories-viewer.com/en/","d":"O Insta Stories Viewer é um serviço web projetado para visualizar e baixar anonimamente conteúdos de contas públicas do Instagram (Stories, publicações do feed, Reels, fotos de perfil em alta resolução e destaques). A plataforma atua como uma interface intermediária (proxy/espelho), permitindo acessar e capturar mídias de perfis sem a necessidade de realizar login na rede social ou deixar registros de visualização (*views*) nas publicações temporárias dos alvos."},{"n":"Instant Data Scraper","u":"https://chromewebstore.google.com/detail/instant-data-scraper/ofaokhiedipichpaobibbnahnkdoiiah","d":"O Instant Data Scraper é uma extensão de navegador (disponível para navegadores baseados em Chromium) projetada para facilitar a raspagem de dados (*web scraping*) sem a necessidade de criação prévia de scripts ou código. A ferramenta utiliza algoritmos heurísticos para detectar automaticamente elementos tabulares ou listas de dados estruturados na página carregada, permitindo a navegação assistida por paginação ou rolagem contínua (*infinite scroll*) e a exportação direta dos dados em formatos estruturados como CSV e XLSX."},{"n":"InstantUsername","u":"https://instantusername.com/","d":"O InstantUsername é uma plataforma web desenvolvida para consultar, em tempo real, a disponibilidade ou ocupação de um determinado nome de usuário (*username* ou *handle*) em mais de uma centena de serviços digitais, fóruns e redes sociais de forma simultânea. A ferramenta opera enviando requisições assíncronas para verificar a existência de perfis públicos correspondentes ao termo digitado, exibindo os resultados de maneira imediata na interface do usuário."},{"n":"Intelligence X OSINT Tools Portal","u":"https://intelx.io/tools","d":"O Intelligence X OSINT Tools Portal é um framework web estruturado que atua como um indexador e gerador de consultas automatizadas para investigações em fontes abertas. O painel é dividido em abas de especialidade técnica que cobrem categorias essenciais da OSINT, incluindo E-mail, Telefone, Domínio, Endereço IP, CIDR, URLs, Bitcoin/Criptoativos e buscas textuais de escopo geral. A plataforma permite que o analista insira um único dado de entrada (como um username ou um hash de carteira) e gere, instantaneamente, links parametrizados para dezenas de ferramentas externas especializadas e motores de busca de terceiros."},{"n":"IntelTechniques","u":"https://inteltechniques.com/","d":"O IntelTechniques é um ecossistema de referência global voltado para a Inteligência de Fontes Abertas (OSINT) e para a proteção da privacidade digital. Desenvolvida pelo especialista Michael Bazzell, a plataforma atua como um repositório centralizado de ferramentas e scripts baseados na web. Por meio de formulários interativos, o portal automatiza a criação de URLs e consultas de busca avançadas, permitindo realizar investigações estruturadas em múltiplos serviços, bancos de dados abertos e plataformas de terceiros sem a necessidade de digitação manual de comandos complexos."},{"n":"IP Location Finder","u":"https://www.iplocation.net/","d":"O IPLocation.net é um portal e agregador de inteligência de rede que centraliza múltiplos motores e bases de dados de geolocalização IP (como IP2Location, MaxMind, IPinfo, DB-IP, entre outros). A plataforma permite consultar endereços IPv4, IPv6 e nomes de domínio, correlacionando resultados para extrair localização geográfica aproximada (país, região, cidade, coordenadas estimadas), Provedor de Serviços de Internet (ISP), Sistema Autônomo (ASN), além de oferecer utilitários complementares de rede como WHOIS, DNS lookup, cálculo de CIDR e testes de velocidade/portas."},{"n":"ip-api","u":"https://ip-api.com/","d":"O ip-api é um serviço automatizado de geolocalização e análise técnica de endereços IP em tempo real. A plataforma processa requisições contendo endereços IPv4 ou IPv6 e retorna um conjunto estruturado de metadados associados à infraestrutura informada, incluindo o país, estado/região, cidade, código postal, coordenadas geográficas aproximadas (latitude e longitude), fuso horário, provedor de serviços de internet (ISP), organização proprietária e o número do Sistema Autônomo (ASN)."},{"n":"IP2Location","u":"https://www.ip2location.com/","d":"O IP2Location é uma plataforma comercial e de inteligência cibernética projetada para consultar, correlacionar e fornecer dados contextuais detalhados a partir de endereços IPv4 e IPv6 e nomes de domínio. A ferramenta mapeia a geolocalização cadastral (país, região, cidade e coordenadas estimadas), Provedor de Serviços de Internet (ISP), Sistema Autônomo (ASN), velocidade de conexão, tipo de uso da rede, fuso horário e indicadores técnicos sobre o uso de proxies, VPNs, redes TOR e servidores de data centers."},{"n":"IPED","u":"https://github.com/sepinf-inc/IPED","d":"O IPED (Indexador e Processador de Evidências Digitais) é um software forense de código aberto desenvolvido por peritos da Polícia Federal brasileira. Ele processa imagens de disco (E01, DD, AFF), extrações de celulares e pastas de arquivos, recuperando itens apagados, indexando o conteúdo textual e categorizando automaticamente arquivos, e-mails, chats e artefatos de sistema. A análise é feita em uma interface gráfica com busca indexada, filtros, visualizadores e geração de relatórios."},{"n":"Iridium Browser","u":"https://iridiumbrowser.de/","d":"O Iridium Browser é um navegador baseado no projeto Chromium, modificado para priorizar a privacidade do usuário. Ele remove integrações nativas que enviam dados para o Google e implementa políticas de segurança mais rígidas por padrão."},{"n":"Jimpl","u":"https://jimpl.com/","d":"O Jimpl é uma plataforma online projetada para inspecionar e remover metadados ocultos (dados EXIF) incorporados em arquivos de imagem. Ao carregar um arquivo, o sistema extrai informações técnicas gravadas pelo dispositivo captor — como coordenadas geográficas exatas (GPS), data e hora do disparo, modelo do hardware, configurações de lente e softwares de edição utilizados —, fornecendo uma opção direta para expurgar esses registros e reduzir a pegada digital do arquivo."},{"n":"JSON Viewer Pro","u":"https://chrome.google.com/webstore/detail/json-viewer-pro/eifflpmocdbdmepbjaopkkhbfmdgijcc","d":"O JSON Viewer Pro é uma extensão de navegador desenvolvida para otimizar a leitura, formatação e análise de dados estruturados nos formatos JSON, XML ou YAML. A ferramenta converte blocos de texto brutos, densos e minificados — comumente retornados por requisições de APIs ou carregados a partir de arquivos locais — em uma árvore hierárquica interativa e visualmente organizada, oferecendo recursos de realce de sintaxe (*syntax highlighting*), busca textual interna, filtragem de chaves e geração de gráficos estruturais."},{"n":"JUCESP - Busca Avançada","u":"https://jucesponline.sp.gov.br/BuscaAvancada.aspx","d":"O sistema de Busca Avançada da JUCESP (Junta Comercial do Estado de São Paulo) é o portal oficial de consulta pública voltado ao levantamento de atos constitutivos e cadastrais de pessoas jurídicas registradas no estado. A plataforma permite realizar pesquisas refinadas cruzando múltiplos critérios, tais como nome empresarial, Número de Identificação do Registro de Empresas (NIRE), CNPJ, nome de sócios ou administradores, objeto social, município e intervalo de data de constituição."},{"n":"Kali Linux","u":"https://www.kali.org/","d":"O Kali Linux é uma distribuição avançada do sistema operacional Linux, baseada em Debian, desenvolvida especificamente para testes de penetração, auditoria de segurança, engenharia reversa e computação forense. Mantido pela Offensive Security, o sistema traz embarcado um ecossistema com centenas de ferramentas nativas focadas em análise de tráfego, coleta de informações, exploração de vulnerabilidades e preservação de evidências digitais."},{"n":"KeePassXC","u":"https://keepassxc.org/","d":"O KeePassXC é um gerenciador de senhas multiplataforma, de código aberto e de execução estritamente local. Ele permite armazenar e organizar credenciais de acesso, chaves de criptografia, anotações confidenciais e tokens de autenticação de dois fatores (TOTP) dentro de um banco de dados fortemente criptografado (formato .kdbx) protegido por uma senha mestra ou chave física, operando sem qualquer dependência de serviços em nuvem."},{"n":"KeyCDN IP Location Finder","u":"https://tools.keycdn.com/geo","d":"O KeyCDN IP Location Finder é uma ferramenta web disponibilizada pela rede de distribuição de conteúdo KeyCDN para realizar consultas e análises contextuais de endereços IPv4, IPv6 e nomes de host/domínio. A aplicação processa a entrada fornecida e retorna dados detalhados de geolocalização cadastral aproximada (país, código ISO, região, cidade, código postal e coordenadas estimadas de latitude e longitude), além de metadados técnicos de infraestrutura de rede, tais como Provedor de Serviços de Internet (ISP), Sistema Autônomo (ASN) e fuso horário."},{"n":"Lenso.ai","u":"https://lenso.ai/en","d":"O Lenso.ai é um motor de busca reversa visual impulsionado por inteligência artificial e visão computacional. A plataforma permite o envio de fotografias ou links para rastrear correspondências na internet por meio de filtros específicos de categorização, incluindo reconhecimento e correspondência facial (People), identificação de lugares e marcos arquitetônicos (Places), detecção de objetos/produtos (Objects) e busca de duplicatas idênticas ou similares (Duplicates)."},{"n":"LlamaIndex","u":"https://www.llamaindex.ai/","d":"O LlamaIndex é um ecossistema voltado ao processamento de documentos com inteligência artificial. Inclui um framework de código aberto em Python e TypeScript para construir aplicações de busca com LLMs (RAG) e agentes, o LiteParse, um parser local e gratuito, e o LlamaParse, serviço em nuvem que interpreta mais de 50 tipos de arquivo, incluindo layouts complexos, tabelas, gráficos e texto manuscrito, oferecendo funções de leitura, extração, divisão, classificação e indexação."},{"n":"Lupa Veicular","u":"https://www.lupaveicular.com/","d":"O Lupa Veicular é uma plataforma web voltada para a consulta consolidada e emissão de relatórios históricos de automóveis em circulação no território brasileiro. A partir da inserção de um identificador como a placa (nos padrões Mercosul ou retroativos) ou o número de chassi, o sistema realiza buscas em bases de dados integradas para compilar informações técnicas, pendências financeiras, restrições administrativas e registros comerciais do veículo."},{"n":"Magnific Icons","u":"https://www.magnific.com/icons","d":"O Magnific Icons (seção da plataforma Magnific, anteriormente vinculada ao ecossistema Freepik/Iconfinder) é um catálogo online massivo de recursos visuais que reúne milhões de ícones e pictogramas nos formatos vetoriais e rasterizados (PNG e SVG). A plataforma dispõe de mecanismos de busca por estilo, filtros por categorias temáticas e ferramentas de customização gráfica para desenvolvimento de interfaces, apresentações e fluxogramas analíticos."},{"n":"Mailbox.org","u":"https://mailbox.org/","d":"O Mailbox.org é um provedor de e-mail focado em privacidade, segurança e anonimato, operando a partir de servidores seguros localizados na Alemanha. A plataforma oferece serviços de correio eletrônico, nuvem e produtividade com forte proteção de dados, destacando-se por não rastrear ou registrar os endereços IP de conexão de seus usuários, omitir metadados técnicos nos cabeçalhos das mensagens e disponibilizar criptografia de dados de forma simplificada."},{"n":"Maltego","u":"https://www.maltego.com/downloads/","d":"O Maltego é uma ferramenta avançada de mineração de dados e análise de vínculos projetada para correlacionar informações e mapear relacionamentos em investigações complexas. O software funciona por meio da execução de *transforms* (scripts automatizados) que consultam diversas bases de dados integradas e APIs na internet, transformando pedaços isolados de informação em nós gráficos (*entities*) interconectados em tempo real."},{"n":"Malwarebytes","u":"https://www.malwarebytes.com/","d":"O Malwarebytes é uma solução de segurança cibernética focada na detecção proativa, isolamento e remoção de códigos maliciosos, ransomware, spywares e outras ameaças digitais avançadas. A plataforma atua tanto na camada do sistema operacional, analisando a integridade de arquivos e processos locais, quanto na camada de navegação na internet através de extensões que bloqueiam anúncios agressivos, rastreadores e conexões com domínios suspeitos."},{"n":"Mapa do Registro de Imóveis do Brasil","u":"https://mapa.onr.org.br/","d":"O Mapa do Registro de Imóveis do Brasil é uma ferramenta interativa desenvolvida pelo Registro de Imóveis do Brasil (RIB) em cooperação com o ONR. A plataforma integra dados cartográficos e limites territoriais das comarcas para georreferenciar imóveis, delimitar áreas de atuação de cada cartório de registro e mapear o território nacional de forma visual."},{"n":"Mapillary","u":"https://www.mapillary.com/app/","d":"O Mapillary é uma plataforma global de mapeamento visual e imagens de nível de solo (*street-level imagery*) desenvolvida de forma colaborativa e aprimorada por algoritmos de visão computacional. O serviço agrega e indexa milhões de sequências fotográficas e panorâmicas em 360 graus enviadas por usuários, conectando-as a coordenadas geográficas precisas e aplicando detecção automatizada de placas, faixas, objetos urbanos e pontos de interesse cartográfico."},{"n":"MarineTraffic","u":"https://www.marinetraffic.com/","d":"O MarineTraffic é uma plataforma global de inteligência marítima que monitora e mapeia em tempo real o posicionamento, rotas, velocidades e dados operacionais de navios e embarcações em todo o mundo. O sistema baseia-se na coleta massiva de dados provenientes de redes de receptores terrestres e de satélites do Sistema de Identificação Automática (AIS - Automatic Identification System), além de integrar dados sobre portos, tráfego costeiro e detalhes estruturais de frotas comerciais e privadas."},{"n":"Marketing Tool - Face Generator","u":"https://www.marketingtool.online/en/face-generator/","d":"O Face Generator da Marketing Tool é uma ferramenta baseada em inteligência artificial (modelos generativos) projetada para criar retratos realistas de rostos humanos de pessoas que não existem no mundo real. A plataforma permite personalizar características específicas, como a faixa etária e o gênero do perfil, gerando novas imagens exclusivas instantaneamente a cada requisição."},{"n":"MarkItDown","u":"https://github.com/microsoft/markitdown","d":"O MarkItDown é um utilitário de código aberto da Microsoft, escrito em Python, que converte arquivos de diversos formatos para Markdown preservando a estrutura do conteúdo (títulos, listas, tabelas e links). Aceita PDF, Word, PowerPoint, Excel, HTML, CSV, JSON, XML, EPUB, arquivos ZIP, imagens (com leitura de metadados EXIF e OCR) e áudio (com transcrição), além de URLs do YouTube. Pode ser usado pela linha de comando, como biblioteca Python ou como servidor MCP (markitdown-mcp) conectado a assistentes de IA."},{"n":"Mermaid Live Editor","u":"https://mermaid.live/","d":"O Mermaid Live Editor é uma plataforma online que permite a criação, edição e renderização em tempo real de diagramas, fluxogramas, gráficos de sequência, cronologias e mapas relacionais a partir de uma sintaxe simples baseada em texto (Markdown-like). O código inserido é processado de forma dinâmica para gerar gráficos estruturados sem a necessidade de ferramentas de desenho manual."},{"n":"MetaGer","u":"https://metager.org/","d":"O MetaGer é um mecanismo de metabusca de código aberto operado pela associação alemã sem fins lucrativos SUMA-EV em cooperação com a Universidade de Hannover. O serviço agrega e compila resultados de múltiplos motores de busca independentes e índices web, entregando respostas sem rastrear as consultas dos usuários, sem armazenar endereços IP e sem repassar dados telemétricos a corretores de dados. Além disso, disponibiliza a funcionalidade nativa \"Abrir anonimamente\" (*Open Anonymously*), que atua como um servidor proxy intermediário para acessar os links resultantes sem expor a identidade do pesquisador ao servidor de destino."},{"n":"Miami-Dade County Property Appraiser - Property Search","u":"https://apps.miamidadepa.gov/PropertySearch/#/","d":"O Property Search do Miami-Dade County Property Appraiser é o portal oficial de consulta imobiliária e cadastral do Condado de Miami-Dade, na Flórida (EUA). A plataforma indexa e disponibiliza dados públicos de todas as parcelas imobiliárias da região metropolitana de Miami, permitindo buscas por endereço, nome do proprietário, número de fólio (*Parcel ID*) ou subdivisão. O sistema consolida dados cadastrais detalhados, incluindo nome do titular, endereço de correspondência (*mailing address*), descrição legal do lote, histórico cronológico de escrituras e vendas (*sales history*), valor venal/avaliação fiscal de mercado (*assessed & market value*), especificações construtivas e zoneamento urbano, integrando camadas cartográficas de sensoriamento remoto e fotos aéreas anuais."},{"n":"MindMeister","u":"https://www.mindmeister.com/pt","d":"O MindMeister é uma plataforma de mapeamento mental baseada na nuvem que permite aos usuários criar, estruturar e colaborar em diagramas visuais de forma hierárquica. A ferramenta possibilita organizar ideias, conectar conceitos por meio de linhas direcionais e ramificações, inserir ícones, notas contextuais e anexar arquivos em nós específicos dentro de uma interface gráfica dinâmica."},{"n":"MindMup","u":"https://www.mindmup.com","d":"O MindMup é uma ferramenta de mapeamento mental baseada na nuvem projetada para criar, estruturar e compartilhar diagramas e mapas conceituais de forma ágil. Integrada de forma nativa ao ecossistema do Google Drive, a plataforma permite organizar ideias através de nós hierárquicos, adicionar notas textuais, links e anexos, além de suportar a exportação dos mapas estruturados para diversos formatos digitais (como imagens, PDFs e vetores)."},{"n":"Minha Receita","u":"https://minhareceita.org/","d":"O Minha Receita é uma solução web e uma API de código aberto (*open-source*) desenvolvida para facilitar a consulta de informações públicas de empresas brasileiras registradas no Cadastro Nacional da Pessoa Jurídica (CNPJ). A plataforma consome, trata e indexa de forma eficiente os dados brutos disponibilizados periodicamente pela Receita Federal do Brasil, permitindo buscas rápidas sem a necessidade de preenchimento de captchas ou navegação nos sistemas governamentais tradicionais."},{"n":"Miniwebtool - Pesquisa de ID de Usuário do Instagram","u":"https://miniwebtool.com/br/pesquisa-de-id-de-usu%C3%A1rio-do-instagram/","d":"Ferramenta online do Miniwebtool que converte um nome de usuário do Instagram (com ou sem @, ou a URL do perfil) no ID numérico da conta, e também faz o caminho inverso: a partir do ID, retorna o nome de usuário atual. Funciona apenas com perfis públicos e não exige cadastro."},{"n":"Miro","u":"https://miro.com/","d":"O Miro é uma plataforma de espaço de trabalho visual e quadro branco digital baseado na nuvem projetada para permitir a ideação, diagramação e colaboração em tempo real. A ferramenta disponibiliza uma tela de dimensões infinitas (*infinite canvas*) altamente flexível onde usuários podem inserir notas adesivas virtuais, conectores vetoriais direcionais, formas geométricas, tabelas, imagens e links para organizar conceitos abstratos e conjuntos de dados de forma estruturada."},{"n":"MISP (Open Source Threat Intelligence Platform)","u":"https://www.misp-project.org/","d":"O MISP é uma plataforma de inteligência de ameaças de código aberto projetada para armazenar, correlacionar e compartilhar dados estruturados sobre incidentes de segurança cibernética, fraudes financeiras e vulnerabilidades. A ferramenta opera como um ecossistema de banco de dados onde Indicadores de Comprometimento (IoCs) — como hashes de arquivos, artefatos maliciosos e dados de rede — são ingeridos via feeds ou inserções manuais, gerando correlações automatizadas entre eventos distintos com base em atributos comuns."},{"n":"MITRE ATT&CK","u":"https://attack.mitre.org/","d":"O MITRE ATT&CK (Adversarial Tactics, Techniques, and Common Knowledge) é uma base de conhecimento globalmente acessível que cataloga as táticas, técnicas e procedimentos (TTPs) utilizados por adversários cibernéticos com base em observações do mundo real. O framework fornece uma matriz estruturada que divide o ciclo de vida de ataques a sistemas corporativos, móveis e industriais, documentando detalhadamente o comportamento de grupos cibercriminosos (APTs), campanhas ativas e o uso de softwares ou malwares específicos."},{"n":"Mobilefish Steganography","u":"https://www.mobilefish.com/services/steganography/steganography.php","d":"O Mobilefish Steganography é um serviço online especializado na aplicação e decodificação de esteganografia digital em arquivos de imagem. A ferramenta permite que usuários ocultem textos ou arquivos inteiros dentro de uma imagem portadora (cover image) gerando um arquivo modificado visualmente idêntico, além de realizar o processo inverso de extração e engenharia reversa de artefatos suspeitos por meio de senhas ou chaves de criptografia."},{"n":"Mojeek","u":"https://www.mojeek.com/","d":"O Mojeek é um mecanismo de busca na web com sede no Reino Unido que se destaca por construir seu próprio índice de páginas a partir de um rastreador autônomo (*web crawler*), sem depender de dados ou APIs de outros motores como Google ou Microsoft Bing. A plataforma é orientada à privacidade estrita, operando com uma política rigorosa de não rastreamento que assegura a não coleta de endereços IP, histórico de pesquisa ou perfis comportamentais de seus usuários."},{"n":"Morbotron","u":"https://morbotron.com/","d":"O Morbotron é uma plataforma de busca e indexação visual desenvolvida pelos mesmos criadores do Frinkiac, voltada para o mapeamento de legendas, transcrições de diálogos e fotogramas (*screencaps*) de todas as temporadas e filmes da série de animação *Futurama*. O motor sincroniza as linhas de roteiro com os respectivos frames de vídeo, permitindo a localização exata de cenas por meio de termos textuais e a geração de capturas estáticas ou GIFs personalizados com legendas embutidas."},{"n":"Mullvad VPN","u":"https://mullvad.net/","d":"O Mullvad é um serviço de Rede Privada Virtual (VPN) focado estritamente em privacidade e anonimato. A plataforma opera mitigando o rastreamento técnico de dados de navegação por meio de criptografia forte (usando os protocolos WireGuard e OpenVPN) e ocultando o endereço IP real do usuário. Destaca-se no mercado por não exigir e-mail, nome ou qualquer dado pessoal para a criação de contas, utilizando um sistema de numeração gerado aleatoriamente e aceitando pagamentos anônimos (como dinheiro em espécie e criptomoedas focadas em privacidade)."},{"n":"MxFace - Face Comparing","u":"https://mxface.ai/face-comparing","d":"O MxFace Face Comparing é um módulo especializado integrado a uma plataforma de biometria e reconhecimento facial baseada em APIs. A ferramenta utiliza modelos de aprendizado profundo (*deep learning*) para extrair e mapear pontos de marcos faciais (*facial landmarks*) de duas imagens distintas, convertendo-as em vetores faciais e calculando a distância euclidiana entre eles. O resultado final é apresentado sob a forma de uma pontuação ou índice de confiança (*confidence score*) que indica a probabilidade matemática de as duas imagens pertencerem ao mesmo indivíduo físico."},{"n":"MXToolbox SuperTool","u":"https://mxtoolbox.com/SuperTool.aspx","d":"O MXToolbox SuperTool é uma plataforma web integrada concebida para a execução de diagnósticos rápidos, monitoramento e auditoria técnica de redes e servidores de correio eletrônico. A ferramenta funciona consolidando dezenas de comandos de rede tradicionais em uma única interface gráfica unificada. Através dela, é possível realizar consultas detalhadas de registros de DNS (como MX, A, TXT, CNAME, PTR), verificar a conformidade de mecanismos de autenticação de e-mail (SPF, DKIM, DMARC), consultar o status de reputação de endereços IP em mais de uma centena de listas de bloqueio (*blacklists*) em tempo real, além de extrair dados cadastrais de WHOIS e ASN."},{"n":"MyHeritage","u":"https://www.myheritage.es/","d":"O MyHeritage é uma plataforma global voltada à genealogia, mapeamento de linhagem familiar e história da inteligência biográfica. A ferramenta gerencia bilhões de registros históricos unificados e utiliza tecnologias de correspondência automatizada (*Smart Matches* e *Record Matches*) para correlacionar perfis familiares adicionados por usuários em todo o mundo. Além da construção de árvores genealógicas e digitalização de arquivos, a empresa gerencia um amplo banco de dados de testes genéticos (DNA), cruzando perfis biológicos para determinar graus de parentesco e ancestralidade geográfica."},{"n":"MyHeritage Deep Nostalgia","u":"https://www.myheritage.es/deep-nostalgia/","d":"O Deep Nostalgia é um recurso baseado em web e inteligência artificial desenvolvido pela MyHeritage, em parceria com a D-ID, que utiliza algoritmos de aprendizado profundo (*deep learning*) para animar rostos em fotografias estáticas. A ferramenta aplica mapeamentos de vídeo predefinidos (compostos por movimentos humanos reais de olhos, boca, sobrancelhas e cabeça) sobre uma imagem bidimensional, gerando um fragmento de vídeo realista com alta fidelidade de movimentos."},{"n":"NCSC - Operations Security (OPSEC)","u":"https://archive.dni.gov/index.php/ncsc-what-we-do/operations-security","d":"A página oficial do Centro Nacional de Contrainteligência e Segurança (NCSC), albergada sob o portal do Diretor de Inteligência Nacional (DNI) dos Estados Unidos, delineia o escopo, as diretrizes e a governança do programa nacional de OPSEC (Operations Security). O portal define o processo analítico de cinco etapas projetado para identificar, controlar e proteger informações não sigilosas, porém críticas, que poderiam ser exploradas por adversários para prever, comprometer ou neutralizar atividades de inteligência e investigações."},{"n":"Netcraft Site Report","u":"https://sitereport.netcraft.com","d":"O Netcraft Site Report é um serviço de inteligência cibernética voltado para o mapeamento detalhado e auditoria independente de propriedades na web. A ferramenta atua consolidando dados técnicos abrangentes sobre qualquer site ou domínio fornecido. Seu relatório automatizado abrange o histórico de propriedade e delegação (WHOIS), apontamentos de DNS, dados do bloco de endereços IP e sistemas autônomos (ASN), além de detalhar as tecnologias empregadas no lado do servidor, tais como o sistema operacional subjacente, servidores web (Apache, Nginx, IIS), frameworks, certificados SSL/TLS ativos e históricos, e a empresa responsável pela hospedagem física da aplicação."},{"n":"Netlas.io","u":"https://app.netlas.io","d":"O Netlas.io é uma plataforma global de inteligência de internet que realiza varreduras contínuas na rede para catalogar e indexar dispositivos conectados, sites, certificados SSL/TLS, registros de DNS e WHOIS. Funcionando de forma análoga a motores de busca como Shodan e Censys, ele permite pesquisar e analisar detalhadamente a infraestrutura técnica exposta publicamente na internet."},{"n":"NewOCR","u":"https://www.newocr.com/","d":"O NewOCR é um serviço online gratuito de Reconhecimento Óptico de Caracteres (*Optical Character Recognition* - OCR) baseado no motor Tesseract OCR. A plataforma permite carregar arquivos de imagem em múltiplos formatos (JPEG, PNG, GIF, BMP, TIFF) e documentos (PDF, DjVu), processando e convertendo elementos visuais textuais em arquivos de texto editáveis (TXT, DOC, PDF), com suporte a mais de 120 idiomas e ferramentas de seleção de área e rotação de imagem."},{"n":"NirSoft","u":"https://www.nirsoft.net/","d":"A NirSoft é uma coleção de utilitários de sistema independentes, compactos e gratuitos desenvolvidos para sistemas operacionais Windows. O site fornece ferramentas voltadas para a recuperação de senhas armazenadas localmente em navegadores e clientes de e-mail, monitoramento de tráfego de rede e gerenciamento avançado de artefatos do sistema operacional."},{"n":"NordVPN","u":"https://nordvpn.com/","d":"A NordVPN é um serviço comercial de Rede Privada Virtual (VPN) que estabelece um túnel criptografado seguro entre o dispositivo do usuário e a internet. Sediada no Panamá (fora da jurisdição das alianças de compartilhamento de inteligência de 5/9/14 Olhos), a plataforma oculta o endereço IP real do usuário, substitui-o por um IP de servidor compartilhado e criptografa todo o tráfego de rede com protocolos avançados como NordLynx (baseado em WireGuard) e OpenVPN."},{"n":"NoxPlayer (BigNox)","u":"https://www.bignox.com","d":"O NoxPlayer, desenvolvido pela BigNox, é um software proprietário de emulação do sistema operacional Android projetado para execução em computadores desktop. Ele permite a criação de múltiplas instâncias simultâneas de dispositivos móveis virtuais em um único computador, oferecendo suporte a diferentes versões do Android, manipulação de coordenadas de localização e simulação de configurações de hardware específicas."},{"n":"nslookup.io","u":"https://www.nslookup.io/","d":"O nslookup.io é uma ferramenta baseada na web projetada para realizar consultas de DNS (Domain Name System) de forma limpa e detalhada. A plataforma atua enviando requisições a servidores de nomes para obter registros específicos associados a um determinado nome de domínio, como registros A, AAAA, MX, TXT, NS, CNAME e SOA, exibindo adicionalmente informações sobre os resolvedores e a geolocalização IP correspondente."},{"n":"NumLookup R
